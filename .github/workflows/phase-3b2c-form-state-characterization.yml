          const links=(text,file)=>[...text.matchAll(/<link\b[^>]*>/gi)].map(m=>{const t=m[0],r=t.match(/\brel=["']([^"']+)["']/i),h=t.match(/\bhref=["']([^"']+)["']/i);return r&&h&&r[1].toLowerCase().split(/\s+/).includes('stylesheet')?{tag:t,href:h[1],path:hrefPath(file,h[1])}:null;}).filter(Boolean);
