name: Phase 3B-2C Form-State Characterization

on:
  push:
    branches:
      - basair/phase-3b-2c-characterization-evidence

permissions:
  contents: write

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated evidence infrastructure
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize exact authoritative source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BRANCH=basair/phase-3b-2c-form-state-characterization
          SOURCE=6de74b2271b937823d63ac33909cc36fe8e73662
          TREE=d99acf85fabd717ddac495e63092f4f0728a9b3c
          PARENT=37e2e6e85d695efcc346d7f35619f6a76eb9aac3
          git fetch --all --prune
          test "$(git rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE"
          test "$(git rev-parse $SOURCE^{tree})" = "$TREE"
          test "$(git rev-parse $SOURCE^1)" = "$PARENT"
          test "$(git merge-base $SOURCE origin/$SOURCE_BRANCH)" = "$SOURCE"
          rm -rf /tmp/basair-3b2c-source /tmp/basair-3b2c-synthetic
          git worktree add --detach /tmp/basair-3b2c-source "$SOURCE"
          test "$(git -C /tmp/basair-3b2c-source rev-parse HEAD)" = "$SOURCE"
          test "$(git -C /tmp/basair-3b2c-source rev-parse HEAD^{tree})" = "$TREE"
          test -z "$(git -C /tmp/basair-3b2c-source status --porcelain)"
          echo "SOURCE_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_ENV"
          echo "SOURCE_HEAD=$SOURCE" >> "$GITHUB_ENV"
          echo "SOURCE_TREE=$TREE" >> "$GITHUB_ENV"
          echo "SOURCE_PARENT=$PARENT" >> "$GITHUB_ENV"

      - name: Run exact source structural gates
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/basair-3b2c-source
          node scripts/verify-css-consolidation-preflight.mjs --expected-css-count=54 | tee "$GITHUB_WORKSPACE/preflight.log"
          npm ci | tee "$GITHUB_WORKSPACE/npm-ci.log"
          npm run verify | tee "$GITHUB_WORKSPACE/npm-verify.log"
          npm run build | tee "$GITHUB_WORKSPACE/npm-build.log"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
          git status --short --ignored -- node_modules dist | tee "$GITHUB_WORKSPACE/ignored-generated.txt"
          cat > /tmp/source-verification.json <<'JSON'
          {
            "preflight": "PASS",
            "npmCi": "PASS",
            "npmRunVerify": "PASS",
            "npmRunBuildStandalone": "PASS",
            "gitDiffCheck": "PASS",
            "gitDiffExitCode": "PASS",
            "statusPorcelain": "CLEAN",
            "ignoredGenerated": ["dist/", "node_modules/"]
          }
          JSON

      - name: Install browser tooling outside repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/basair-browser-tooling
          mkdir -p /tmp/basair-browser-tooling
          npm install --prefix /tmp/basair-browser-tooling puppeteer-core@24.16.0 --no-save --no-package-lock
          google-chrome --version | tee "$GITHUB_WORKSPACE/chrome-version.txt"
          node -e "console.log(require('/tmp/basair-browser-tooling/node_modules/puppeteer-core/package.json').version)" | tee "$GITHUB_WORKSPACE/puppeteer-version.txt"

      - name: Run static and browser characterization
        shell: bash
        env:
          SOURCE_DIR: /tmp/basair-3b2c-source
          CANDIDATE_DIR: /tmp/basair-3b2c-synthetic
          SOURCE_VERIFICATION_JSON: /tmp/source-verification.json
        run: |
          set -euo pipefail
          mkdir -p /tmp/basair-3b2c-synthetic
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/basair-3b2c-source >/tmp/3b2c-source-http.log 2>&1 & SPID=$!
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/basair-3b2c-synthetic >/tmp/3b2c-synthetic-http.log 2>&1 & CPID=$!
          trap 'kill $SPID $CPID 2>/dev/null || true' EXIT

          cat > /tmp/basair-browser-tooling/characterize.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
