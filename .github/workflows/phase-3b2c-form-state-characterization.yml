            if(/\.(js|mjs|ts)$/.test(f)&&/(document\.styleSheets|ownerNode|createElement\(\s*['"]link['"]|insertRule\(|deleteRule\(|rel\s*=\s*['"]stylesheet['"])/i.test(txt))cssom.push({file:f,markers:[...new Set([...txt.matchAll(/document\.styleSheets|ownerNode|createElement\(\s*['"]link['"]|insertRule\(|deleteRule\(|rel\s*=\s*['"]stylesheet['"]/gi)].map(x=>x[0]))]});
          }

          function splitSelectors(s){const o=[];let q='',d=0,c='';for(let i=0;i<s.length;i++){const x=s[i];if(q){c+=x;if(x===q&&s[i-1]!=="\\")q='';continue;}if(x==='"'||x==="'"){q=x;c+=x;continue;}if(x==='('||x==='[')d++;if(x===')'||x===']')d--;if(x===','&&d===0){if(c.trim())o.push(c.trim());c='';}else c+=x;}if(c.trim())o.push(c.trim());return o;}
          function spec(s){let a=(s.match(/#[\w-]+/g)||[]).length,b=(s.match(/\.[\w-]+/g)||[]).length+(s.match(/\[[^\]]+\]/g)||[]).length+(s.match(/:(?!:)(?!not\(|is\(|has\(|where\()[\w-]+/g)||[]).length,c=(s.match(/::[\w-]+/g)||[]).length;for(const m of s.matchAll(/:(not|is|has)\(([^()]*)\)/g)){const ms=splitSelectors(m[2]).map(spec).sort((x,y)=>y[0]-x[0]||y[1]-x[1]||y[2]-x[2])[0]||[0,0,0];a+=ms[0];b+=ms[1];c+=ms[2];}const clean=s.replace(/#[\w-]+|\.[\w-]+|\[[^\]]+\]|:{1,2}[\w-]+(?:\([^)]*\))?|\*/g,' ');c+=(clean.match(/(^|[\s>+~])([a-zA-Z][\w-]*)/g)||[]).length;return[a,b,c];}
