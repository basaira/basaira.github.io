          eq=json.load(open(out/"folio-m4-equivalence.json"))
          live=json.load(open(out/"folio-live-deadness.json"))

          assert source["exactFourPathBoundary"] and source["changedPathCount"]==4
          assert authority["match"]
          assert build["verify"]=="PASS" and build["build"]=="PASS" and build["tokenAuthorityChecker"]=="PASS"
          assert delta["counts"]=={"ADD":2,"MODIFY":1,"DELETE":2,"PRESERVE":22}
          assert eq["domEquivalence"]=="PASS" and eq["geometry"]=="EXACT" and eq["screenshots"]=="PIXEL IDENTICAL" and eq["unexplainedDifferences"]==0
          assert live["callability"]=="UNREACHABLE" and live["builtFolioExecutablePath"]=="ABSENT"
          assert live["naturalLiveFolioMarkers"]==0 and live["folioSpecificLiveObservers"]==0
          assert live["currentTypeAProductionDefect"]=="NONE PROVEN"
          assert live["mutatingDispatchCount"]==0

          protected={
            "initManuscriptHero":"PRESERVED",
            "initReadingProgress":"PRESERVED",
            "initOverdrive":"PRESERVED",
            "DOMContentLoadedBootstrap":"PRESERVED",
            "overdrive-ready":"PRESERVED",
            "overdrive-manuscript":"BEHAVIORALLY IDENTICAL",
            "overdrive-reading-progress":"BEHAVIORALLY IDENTICAL",
            "unrelatedOverdriveCss":"PRESERVED BY EXACT FOLIO-ONLY DIFF",
            "unrelatedHotfixRules":"PRESERVED BY ONE-RULE HOTFIX DIFF",
            "unrelatedManifestRecords":"PRESERVED BY FOUR JSON-PATH CHANGES",
            "--layout-section-compact":"UNCHANGED",
            "wholeFileDeletion":"FORBIDDEN"
          }
          json.dump(protected,open(out/"folio-m4-protected-behavior.json","w"),indent=2)

          branch_contract={
            "futureImplementationBranch":"basair/post-3b-folio-opacity-implementation",
            "base":"006ba05c7361451865660450695c48428a3ed8d0",
            "createProductMutationDuringThisReview":False
          }
          json.dump(branch_contract,open(out/"folio-m4-implementation-branch-contract.json","w"),indent=2)

          commit_contract={
            "suggestedMessage":"Post-3B: remove dormant Folio subsystem",
            "parent":"006ba05c7361451865660450695c48428a3ed8d0",
            "parentCount":1,
            "merge":False,"rebase":False,"reset":False,"force":False,
            "changedPathCount":4,
            "changedPaths":["overdrive-v1.js","overdrive-v1.css","visual-layout-hotfix-v2.css","token-authority-manifest.json"],
            "atomic":True,
            "wholeFileDeletion":False
          }
          json.dump(commit_contract,open(out/"folio-m4-implementation-commit-contract.json","w"),indent=2)

          gates={
            "freshPreflightAuthorityExact":True,
            "exactFourPathSourceDiff":True,
            "noFifthProductionPath":True,
            "authority":{"canonical":106,"aliases":[1,48,23,23,2],"correctedConflicts":38,"productionCss":51,"inlineStyles":1,"customPropertyNames":368,"undefinedVariables":0},
            "npmCi":"REQUIRED PASS",
            "npmRunVerify":"REQUIRED PASS",
            "npmRunBuild":"REQUIRED PASS",
            "tokenAuthorityChecker":"REQUIRED PASS",
            "gitDiffCheck":"REQUIRED PASS",
            "cleanWorkingTreeAfterCommit":"REQUIRED",
            "dist":{"files":25,"bytes":2554010},
            "criticalAssets":["assets/main-CdDtQcjc.js","assets/main-BJIbyLNf.css"],
            "behavioralEquivalence":"EXACT",
            "geometry":"EXACT",
            "screenshots":"PIXEL IDENTICAL",
            "builtJsFolioRuntimeSource":0,
            "builtCssFolioOpacity":0,
            "builtCssFolioMarkerSubsystem":0,
            "hotfixFolioMask":0,
            "staleManifestFolioAuthority":0
          }
          json.dump(gates,open(out/"folio-m4-acceptance-gates.json","w"),indent=2)

          json.dump({
            "outcome":"A — M4 IMPLEMENTATION AUTHORIZED",
            "authorizedMutation":"M4 — FOLIO JS + CSS + HOTFIX + MANIFEST AS ONE ATOMIC REMOVAL",
            "authorizedSourcePaths":4,
            "paths":commit_contract["changedPaths"],
            "wholeFileDeletion":"FORBIDDEN",
            "expectedAuthorityAfterImplementation":gates["authority"],
            "expectedBuild":{"files":25,"bytes":2554010,"criticalAssets":gates["criticalAssets"]},
            "expectedBehavior":"NO CHANGE",
            "expectedGeometry":"EXACT",
            "expectedScreenshots":"PIXEL IDENTICAL",
            "futureImplementationBranch":branch_contract["futureImplementationBranch"],
            "futureCommitMessage":commit_contract["suggestedMessage"],
            "implementationMayBegin":"YES — ONLY AFTER INDEPENDENT CLOSURE OF THIS AUTHORIZATION REVIEW",
            "promotionAuthorized":False,
            "deploymentAuthorized":False,
            "implementationPerformed":False,
            "currentTypeAProductionDefect":"NONE PROVEN",
            "nextPossibleGate":"FOLIO OPACITY IMPLEMENTATION",
            "doNotMutateProductionInThisReview":True
          },open(out/"folio-implementation-auth-summary.json","w"),indent=2)
          PY

      - name: Terminal authority and zero-mutation check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/folio-auth"
          api() {
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$1"
          }
          MAIN="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" | jq -r '.object.sha')"
          IMPL="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/basair/post-3b-compact-token-ownership-implementation" | jq -r '.object.sha')"
          GH="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/gh-pages" | jq -r '.object.sha')"
          MG="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${MAIN}")"
          GG="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${GH}")"
          test "${MAIN}" = "${MAIN_SHA}"
          test "${IMPL}" = "${IMPL_SHA}"
          test "${GH}" = "${GH_SHA}"
          test "$(jq -r '.tree.sha' <<<"${MG}")" = "${MAIN_TREE}"
          test "$(jq -r '.tree.sha' <<<"${GG}")" = "${GH_TREE}"
          jq -n \
            --arg main "${MAIN}" --arg impl "${IMPL}" --arg gh "${GH}" \
            --arg mainTree "$(jq -r '.tree.sha' <<<"${MG}")" --arg ghTree "$(jq -r '.tree.sha' <<<"${GG}")" \
            '{main:$main,implementation:$impl,ghPages:$gh,mainTree:$mainTree,ghPagesTree:$ghTree,noProductionRefMutation:true,noDeployment:true,noPagesSettingsMutation:true,noFirebaseMutation:true,noBackendMutation:true}' \
            | tee "${OUT}/folio-implementation-auth-terminal-refs.json"

      - name: Verify required authorization evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/folio-auth"
          for F in \
            folio-implementation-auth-preflight.json \
            folio-characterization-authority.json \
            folio-m4-source-contract.json \
            folio-m4-js-contract.json \
            folio-m4-css-contract.json \
            folio-m4-hotfix-contract.json \
            folio-m4-manifest-contract.json \
            folio-m4-authority-model.json \
            folio-m4-build-contract.json \
            folio-m4-generated-delta.json \
            folio-m4-equivalence.json \
            folio-m4-protected-behavior.json \
            folio-m4-implementation-branch-contract.json \
            folio-m4-implementation-commit-contract.json \
            folio-m4-acceptance-gates.json \
            folio-implementation-auth-summary.json \
            folio-implementation-auth-terminal-refs.json
          do
            test -s "${OUT}/${F}"
          done
          jq -e '.outcome=="A — M4 IMPLEMENTATION AUTHORIZED"' "${OUT}/folio-implementation-auth-summary.json" >/dev/null
          jq -e '.changedPathCount==4 and .unrelatedFormattingChurn==0 and .unrelatedSemanticChanges==0' "${OUT}/folio-m4-source-contract.json" >/dev/null
          jq -e '.domEquivalence=="PASS" and .geometry=="EXACT" and .screenshots=="PIXEL IDENTICAL"' "${OUT}/folio-m4-equivalence.json" >/dev/null

      - name: Upload implementation authorization evidence
        uses: actions/upload-artifact@v4
        with:
          name: post-3b-folio-opacity-implementation-authorization-review
          path: ${{ runner.temp }}/folio-auth
          if-no-files-found: error
          retention-days: 90
