name: Phase 3B-5C Full Deterministic Hero Pairwise Characterization

on:
  push:
    branches:
      - basair/phase-3b-5c-hero-ownership-characterization-evidence
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: e72fc5b2bfa073806e514cd7a05fdab6315a1df7
  BASE_TREE: 805265ffc0d24238490948c48830e329d6cba644
  BASE_PARENT: a4671e5f4aa6ecc56fbf1b0b619e26fcb105f22f
  SOURCE_BRANCH: basair/phase-3b-5c-hero-ownership-characterization
  EVIDENCE_BRANCH: basair/phase-3b-5c-hero-ownership-characterization-evidence
  REQUIRED_EVIDENCE_ANCESTOR: 19790a0120161f732d578fe21ecbb8fc2880e649

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout evidence
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-5c-hero-ownership-characterization-evidence
          fetch-depth: 0
          path: evidence

      - name: Checkout authoritative source
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-5c-hero-ownership-characterization
          fetch-depth: 0
          path: source

      - name: Verify frozen source and evidence-only lineage
        shell: bash
        run: |
          set -euo pipefail
          git -C source fetch origin "$SOURCE_BRANCH" "$EVIDENCE_BRANCH"
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$BASE_TREE"
          test "$(git -C source rev-parse HEAD^1)" = "$BASE_PARENT"
          test "$(git -C source merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$BASE_SHA"
          git -C evidence merge-base --is-ancestor "$REQUIRED_EVIDENCE_ANCESTOR" HEAD
          printf '%s\n' \
            .github/workflows/phase-3b5c-hero-ownership-characterization.yml \
            scripts/evidence/phase-3b5c-hero-static-characterization.mjs \
            scripts/evidence/phase-3b5c-hero-browser-characterization.mjs \
            scripts/evidence/phase-3b5c-round2-base.mjs \
            scripts/evidence/phase-3b5c-round2-lifecycle.mjs \
            scripts/evidence/phase-3b5c-round2-measure.mjs \
            scripts/evidence/phase-3b5c-round2-matrix.mjs \
            scripts/evidence/phase-3b5c-round2-normalization-v2.mjs \
            scripts/evidence/phase-3b5c-full-pairwise-browser.mjs \
            scripts/evidence/phase-3b5c-full-pairwise-summary.mjs \
            | sort > /tmp/allowed-evidence-paths
          git -C evidence diff --name-only "$BASE_SHA"..HEAD | sort > /tmp/actual-evidence-paths
          diff -u /tmp/allowed-evidence-paths /tmp/actual-evidence-paths
          for f in evidence/scripts/evidence/phase-3b5c-*.mjs; do node --check "$f"; done
          echo SOURCE_HEAD=$(git -C source rev-parse HEAD)
          echo SOURCE_TREE=$(git -C source rev-parse HEAD^{tree})
          echo SOURCE_PARENT=$(git -C source rev-parse HEAD^1)
          echo EVIDENCE_HEAD=$(git -C evidence rev-parse HEAD)
          echo EVIDENCE_TREE=$(git -C evidence rev-parse HEAD^{tree})
          echo EVIDENCE_PARENT=$(git -C evidence rev-parse HEAD^1)

      - name: Authoritative source verification
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          node scripts/verify-css-consolidation-preflight.mjs --expected-css-count=52
          npm ci
          npm run verify
          npm run build
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo SOURCE_GATE_PASS

      - name: Final source immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$BASE_TREE"
          test "$(git -C source rev-parse HEAD^1)" = "$BASE_PARENT"
          test -z "$(git -C source diff --name-only "$BASE_SHA"..HEAD)"
          test -z "$(git -C source status --porcelain)"
          (cd source && node scripts/verify-css-consolidation-preflight.mjs --expected-css-count=52)
          echo FINAL_SOURCE_IMMUTABILITY_PASS

  p4-canary:
    needs: source-gate
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
    name: P4 generalization canary ${{ matrix.repeat }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PAIR: P4
      REPEAT: ${{ matrix.repeat }}
      CAMPAIGN: p4-canary
    steps:
      - name: Checkout evidence
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-5c-hero-ownership-characterization-evidence
          fetch-depth: 0
          path: evidence
      - name: Checkout frozen source
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-5c-hero-ownership-characterization
          fetch-depth: 0
          path: source
      - name: Verify pair input identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$BASE_TREE"
          test "$(git -C source rev-parse HEAD^1)" = "$BASE_PARENT"
          git -C evidence merge-base --is-ancestor "$REQUIRED_EVIDENCE_ANCESTOR" HEAD
          node --check evidence/scripts/evidence/phase-3b5c-full-pairwise-browser.mjs
      - name: Prepare deterministic harness
        shell: bash
        run: |
          set -euo pipefail
          HARNESS_DIR="${RUNNER_TEMP}/phase3b5c-harness"; OUT_DIR="${RUNNER_TEMP}/phase3b5c-out"
          rm -rf "$HARNESS_DIR" "$OUT_DIR"; mkdir -p "$HARNESS_DIR" "$OUT_DIR"; cd "$HARNESS_DIR"
          npm init -y >/dev/null
          npm install --no-package-lock postcss postcss-selector-parser puppeteer-core >/dev/null
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b5c-hero-static-characterization.mjs" static.mjs
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b5c-full-pairwise-browser.mjs" browser.mjs
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b5c-round2-base.mjs" phase-3b5c-round2-base.mjs
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b5c-round2-lifecycle.mjs" phase-3b5c-round2-lifecycle.mjs
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b5c-round2-measure.mjs" phase-3b5c-round2-measure.mjs
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b5c-round2-matrix.mjs" phase-3b5c-round2-matrix.mjs
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b5c-round2-normalization-v2.mjs" phase-3b5c-round2-normalization-v2.mjs
          node --check browser.mjs
      - name: Static identity and pair facts
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/phase3b5c-harness"
          BASE_SHA="$BASE_SHA" node static.mjs --source="${GITHUB_WORKSPACE}/source" --out="${RUNNER_TEMP}/phase3b5c-out/static-inventory.json"
          python3 -m json.tool "${RUNNER_TEMP}/phase3b5c-out/static-inventory.json" >/dev/null
      - name: Run P4 S-S X-X S-X
        shell: bash
        run: |
          set -uo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then sudo apt-get update -y >/dev/null && sudo apt-get install -y xvfb >/dev/null; fi
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"; test -n "$CHROME_BIN"
          cd "${RUNNER_TEMP}/phase3b5c-harness"
          set +e
          BASE_SHA="$BASE_SHA" xvfb-run -a node browser.mjs --source="${GITHUB_WORKSPACE}/source" --static="${RUNNER_TEMP}/phase3b5c-out/static-inventory.json" --out="${RUNNER_TEMP}/phase3b5c-out/browser-evidence.json" --chrome="$CHROME_BIN" --pair="$PAIR" --repeat="$REPEAT" --campaign="$CAMPAIGN"
          status=$?; set -e; echo "$status" > "${RUNNER_TEMP}/phase3b5c-out/browser-exit.txt"; exit 0
      - name: Final frozen-source immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${RUNNER_TEMP}/phase3b5c-out"; mkdir -p "$OUT_DIR"
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$BASE_TREE"
          test "$(git -C source rev-parse HEAD^1)" = "$BASE_PARENT"
          test -z "$(git -C source status --porcelain)"
          test -z "$(git -C source diff --name-only "$BASE_SHA"..HEAD)"
          (cd source && node scripts/verify-css-consolidation-preflight.mjs --expected-css-count=52)
          { echo SOURCE_HEAD=$(git -C source rev-parse HEAD); echo SOURCE_TREE=$(git -C source rev-parse HEAD^{tree}); echo SOURCE_PARENT=$(git -C source rev-parse HEAD^1); echo SOURCE_MERGE_BASE=$(git -C source merge-base HEAD "$BASE_SHA"); echo PRODUCTION_CHANGED_PATHS=0; echo PRODUCTION_CSS=52; echo EVIDENCE_HEAD=$(git -C evidence rev-parse HEAD); echo EVIDENCE_TREE=$(git -C evidence rev-parse HEAD^{tree}); echo EVIDENCE_PARENT=$(git -C evidence rev-parse HEAD^1); echo FINAL_SOURCE_IMMUTABILITY_PASS; } | tee "$OUT_DIR/final-source-identity.txt"
      - name: Upload P4 canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3b5c-p4-canary-${{ matrix.repeat }}
          path: ${{ runner.temp }}/phase3b5c-out
          if-no-files-found: warn
          compression-level: 6
      - name: Enforce P4 canary gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/phase3b5c-out"; test "$(cat "$OUT/browser-exit.txt")" = "0"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          b=json.loads((Path(os.environ['RUNNER_TEMP'])/'phase3b5c-out'/'browser-evidence.json').read_text())
          assert b['pair']['id']=='P4' and b['ready'] is True,b
          for k in ['sourceSource','syntheticSynthetic','sourceSynthetic']:
              m=b['modes'][k]; t=m['totals']; mt=m['motionTotals']
              assert t['comparisons']==93 and mt['comparisons']==5,(k,t,mt)
              assert all((t.get(x,0)==0) for x in ['computed','geometry','custom','state','accessibility','inventoryMismatches']),(k,t)
              assert all((mt.get(x,0)==0) for x in ['computed','geometry','custom','state','accessibility','inventoryMismatches']),(k,mt)
              assert m['resourceFailureCount']==0 and m['readinessBlockers']==0 and len(m['blockers'])==0,(k,m['blockers'])
          print('P4_GENERALIZATION_CANARY_PASS')
          PY

  full-matrix:
    needs: p4-canary
    strategy:
      fail-fast: false
      matrix:
        pair: [P1, P2, P3, P4, P5, P6]
    name: Full characterization ${{ matrix.pair }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PAIR: ${{ matrix.pair }}
      REPEAT: 1
      CAMPAIGN: full
    steps:
      - name: Checkout evidence
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-5c-hero-ownership-characterization-evidence
          fetch-depth: 0
          path: evidence
      - name: Checkout frozen source
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-5c-hero-ownership-characterization
          fetch-depth: 0
          path: source
      - name: Verify pair input identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$BASE_TREE"
          test "$(git -C source rev-parse HEAD^1)" = "$BASE_PARENT"
          git -C evidence merge-base --is-ancestor "$REQUIRED_EVIDENCE_ANCESTOR" HEAD
          node --check evidence/scripts/evidence/phase-3b5c-full-pairwise-browser.mjs
      - name: Prepare deterministic harness
        shell: bash
        run: |
          set -euo pipefail
          HARNESS_DIR="${RUNNER_TEMP}/phase3b5c-harness"; OUT_DIR="${RUNNER_TEMP}/phase3b5c-out"
          rm -rf "$HARNESS_DIR" "$OUT_DIR"; mkdir -p "$HARNESS_DIR" "$OUT_DIR"; cd "$HARNESS_DIR"
          npm init -y >/dev/null
          npm install --no-package-lock postcss postcss-selector-parser puppeteer-core >/dev/null
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b5c-hero-static-characterization.mjs" static.mjs
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b5c-full-pairwise-browser.mjs" browser.mjs
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b5c-round2-base.mjs" phase-3b5c-round2-base.mjs
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b5c-round2-lifecycle.mjs" phase-3b5c-round2-lifecycle.mjs
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b5c-round2-measure.mjs" phase-3b5c-round2-measure.mjs
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b5c-round2-matrix.mjs" phase-3b5c-round2-matrix.mjs
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b5c-round2-normalization-v2.mjs" phase-3b5c-round2-normalization-v2.mjs
          node --check browser.mjs
      - name: Static identity and pair facts
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/phase3b5c-harness"
          BASE_SHA="$BASE_SHA" node static.mjs --source="${GITHUB_WORKSPACE}/source" --out="${RUNNER_TEMP}/phase3b5c-out/static-inventory.json"
      - name: Run pair S-S X-X S-X
        shell: bash
        run: |
          set -uo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then sudo apt-get update -y >/dev/null && sudo apt-get install -y xvfb >/dev/null; fi
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"; test -n "$CHROME_BIN"
          cd "${RUNNER_TEMP}/phase3b5c-harness"
          set +e
          BASE_SHA="$BASE_SHA" xvfb-run -a node browser.mjs --source="${GITHUB_WORKSPACE}/source" --static="${RUNNER_TEMP}/phase3b5c-out/static-inventory.json" --out="${RUNNER_TEMP}/phase3b5c-out/browser-evidence.json" --chrome="$CHROME_BIN" --pair="$PAIR" --repeat="$REPEAT" --campaign="$CAMPAIGN"
          status=$?; set -e; echo "$status" > "${RUNNER_TEMP}/phase3b5c-out/browser-exit.txt"; exit 0
      - name: Final frozen-source immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${RUNNER_TEMP}/phase3b5c-out"; mkdir -p "$OUT_DIR"
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$BASE_TREE"
          test "$(git -C source rev-parse HEAD^1)" = "$BASE_PARENT"
          test -z "$(git -C source status --porcelain)"
          test -z "$(git -C source diff --name-only "$BASE_SHA"..HEAD)"
          (cd source && node scripts/verify-css-consolidation-preflight.mjs --expected-css-count=52)
          { echo SOURCE_HEAD=$(git -C source rev-parse HEAD); echo SOURCE_TREE=$(git -C source rev-parse HEAD^{tree}); echo SOURCE_PARENT=$(git -C source rev-parse HEAD^1); echo SOURCE_MERGE_BASE=$(git -C source merge-base HEAD "$BASE_SHA"); echo PRODUCTION_CHANGED_PATHS=0; echo PRODUCTION_CSS=52; echo EVIDENCE_HEAD=$(git -C evidence rev-parse HEAD); echo EVIDENCE_TREE=$(git -C evidence rev-parse HEAD^{tree}); echo EVIDENCE_PARENT=$(git -C evidence rev-parse HEAD^1); echo FINAL_SOURCE_IMMUTABILITY_PASS; } | tee "$OUT_DIR/final-source-identity.txt"
      - name: Upload full pair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3b5c-full-${{ matrix.pair }}
          path: ${{ runner.temp }}/phase3b5c-out
          if-no-files-found: warn
          compression-level: 6
      - name: Enforce pair gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/phase3b5c-out"; test "$(cat "$OUT/browser-exit.txt")" = "0"
          PAIR_EXPECTED="$PAIR" python3 - <<'PY'
          import json,os
          from pathlib import Path
          b=json.loads((Path(os.environ['RUNNER_TEMP'])/'phase3b5c-out'/'browser-evidence.json').read_text())
          assert b['pair']['id']==os.environ['PAIR_EXPECTED'] and b['ready'] is True,b
          for k in ['sourceSource','syntheticSynthetic','sourceSynthetic']:
              m=b['modes'][k]; t=m['totals']; mt=m['motionTotals']
              assert t['comparisons']==93 and mt['comparisons']==5,(k,t,mt)
              assert all((t.get(x,0)==0) for x in ['computed','geometry','custom','state','accessibility','inventoryMismatches']),(k,t)
              assert all((mt.get(x,0)==0) for x in ['computed','geometry','custom','state','accessibility','inventoryMismatches']),(k,mt)
              assert m['resourceFailureCount']==0 and m['readinessBlockers']==0 and len(m['blockers'])==0,(k,m['blockers'])
          print('PAIR_DETERMINISTIC_PASS',b['pair']['id'])
          PY

  final-summary:
    if: always()
    needs: [source-gate, p4-canary, full-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout evidence
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-5c-hero-ownership-characterization-evidence
          fetch-depth: 0
          path: evidence
      - name: Checkout frozen source
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-5c-hero-ownership-characterization
          fetch-depth: 0
          path: source
      - name: Download P4 canary artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: phase-3b5c-p4-canary-*
          path: results
      - name: Download full matrix artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: phase-3b5c-full-*
          path: results
      - name: Build final machine-readable disposition
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p final-out
          set +e
          node evidence/scripts/evidence/phase-3b5c-full-pairwise-summary.mjs --input=results --out=final-out/phase-3b5c-final-evidence.json
          status=$?
          set -e
          echo "$status" > final-out/summary-exit.txt
          if [ -s final-out/phase-3b5c-final-evidence.json ]; then
            EVIDENCE_HEAD="$(git -C evidence rev-parse HEAD)" EVIDENCE_TREE="$(git -C evidence rev-parse HEAD^{tree})" EVIDENCE_PARENT="$(git -C evidence rev-parse HEAD^1)" python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('final-out/phase-3b5c-final-evidence.json'); d=json.loads(p.read_text())
          d['evidence'].update({'head':os.environ['EVIDENCE_HEAD'],'tree':os.environ['EVIDENCE_TREE'],'parent':os.environ['EVIDENCE_PARENT']})
          first=next((x for x in d.get('pairResults',[]) if x.get('pair')=='P1'),None)
          browser_files=list(Path('results').rglob('browser-evidence.json'))
          if browser_files:
              b=json.loads(browser_files[0].read_text()); mode=b.get('modes',{}).get('sourceSource',{})
              d['pointerCapabilities']=mode.get('environment')
              recs=mode.get('records',[])
              d['viewportMatrix']=sorted({json.dumps(r.get('source',{}).get('context',{}).get('viewport'),sort_keys=True) for r in recs if r.get('source',{}).get('context',{}).get('viewport') is not None})
              d['locales']=sorted({r.get('source',{}).get('context',{}).get('locale') for r in recs if r.get('source',{}).get('context',{}).get('locale')})
              d['directions']=sorted({r.get('source',{}).get('state',{}).get('dir') for r in recs if r.get('source',{}).get('state',{}).get('dir')})
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False))
          PY
          fi
          exit 0
      - name: Final frozen-source immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$BASE_TREE"
          test "$(git -C source rev-parse HEAD^1)" = "$BASE_PARENT"
          test -z "$(git -C source status --porcelain)"
          test -z "$(git -C source diff --name-only "$BASE_SHA"..HEAD)"
          (cd source && node scripts/verify-css-consolidation-preflight.mjs --expected-css-count=52)
          { echo SOURCE_HEAD=$(git -C source rev-parse HEAD); echo SOURCE_TREE=$(git -C source rev-parse HEAD^{tree}); echo SOURCE_PARENT=$(git -C source rev-parse HEAD^1); echo PRODUCTION_CHANGED_PATHS=0; echo PRODUCTION_CSS=52; echo EVIDENCE_HEAD=$(git -C evidence rev-parse HEAD); echo EVIDENCE_TREE=$(git -C evidence rev-parse HEAD^{tree}); echo EVIDENCE_PARENT=$(git -C evidence rev-parse HEAD^1); echo FINAL_SOURCE_IMMUTABILITY_PASS; } | tee final-out/final-source-identity.txt
      - name: Upload final characterization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3b5c-final-pairwise-characterization
          path: final-out
          if-no-files-found: warn
      - name: Enforce final characterization gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat final-out/summary-exit.txt)" = "0"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('final-out/phase-3b5c-final-evidence.json').read_text())
          assert d['p4GeneralizationCanary']['pass'] is True,d['p4GeneralizationCanary']
          assert len(d['pairResults'])==6,d['pairResults']
          assert d['readyForPhase3B5'] is True,d['readinessChecks']
          assert all(not p['finalDisposition'].startswith('E') for p in d['pairResults'])
          print('PHASE_3B5C_FULL_PAIRWISE_PASS')
          PY
