name: Phase 3B-5C Hero Determinism Canary

on:
  push:
    branches:
      - basair/phase-3b-5c-hero-ownership-characterization-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: e72fc5b2bfa073806e514cd7a05fdab6315a1df7
      BASE_TREE: 805265ffc0d24238490948c48830e329d6cba644
      BASE_PARENT: a4671e5f4aa6ecc56fbf1b0b619e26fcb105f22f
      SOURCE_BRANCH: basair/phase-3b-5c-hero-ownership-characterization
      EVIDENCE_BRANCH: basair/phase-3b-5c-hero-ownership-characterization-evidence
      REQUIRED_EVIDENCE_ANCESTOR: b8e7b6df2f28f7b94d2623dc7a0671bb101b9bb5
    steps:
      - name: Checkout evidence
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-5c-hero-ownership-characterization-evidence
          fetch-depth: 0
          path: evidence

      - name: Checkout authoritative source
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-5c-hero-ownership-characterization
          fetch-depth: 0
          path: source

      - name: Verify frozen source and evidence lineage
        shell: bash
        run: |
          set -euo pipefail
          git -C source fetch origin "$SOURCE_BRANCH" "$EVIDENCE_BRANCH"
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$BASE_TREE"
          test "$(git -C source rev-parse HEAD^1)" = "$BASE_PARENT"
          test "$(git -C source merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$BASE_SHA"
          git -C evidence merge-base --is-ancestor "$REQUIRED_EVIDENCE_ANCESTOR" HEAD
          printf '%s\n' \
            .github/workflows/phase-3b5c-hero-ownership-characterization.yml \
            scripts/evidence/phase-3b5c-hero-static-characterization.mjs \
            scripts/evidence/phase-3b5c-hero-browser-characterization.mjs \
            | sort > /tmp/allowed-evidence-paths
          git -C evidence diff --name-only "$BASE_SHA"..HEAD | sort > /tmp/actual-evidence-paths
          diff -u /tmp/allowed-evidence-paths /tmp/actual-evidence-paths
          node --check evidence/scripts/evidence/phase-3b5c-hero-static-characterization.mjs
          node --check evidence/scripts/evidence/phase-3b5c-hero-browser-characterization.mjs
          echo SOURCE_HEAD=$(git -C source rev-parse HEAD)
          echo SOURCE_TREE=$(git -C source rev-parse HEAD^{tree})
          echo SOURCE_PARENT=$(git -C source rev-parse HEAD^1)
          echo EVIDENCE_HEAD=$(git -C evidence rev-parse HEAD)
          echo EVIDENCE_TREE=$(git -C evidence rev-parse HEAD^{tree})
          echo EVIDENCE_PARENT=$(git -C evidence rev-parse HEAD^1)

      - name: Authoritative source verification
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          node scripts/verify-css-consolidation-preflight.mjs --expected-css-count=52
          npm ci
          npm run verify
          npm run build
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
          node token-authority-check.mjs
          echo SOURCE_GATE_PASS

      - name: Final source immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$BASE_TREE"
          test "$(git -C source rev-parse HEAD^1)" = "$BASE_PARENT"
          test -z "$(git -C source diff --name-only "$BASE_SHA"..HEAD)"
          test -z "$(git -C source status --porcelain)"
          (cd source && node scripts/verify-css-consolidation-preflight.mjs --expected-css-count=52)
          echo FINAL_SOURCE_IMMUTABILITY_PASS

  p1-canary:
    needs: source-gate
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    name: P1 canary repeat ${{ matrix.repeat }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_SHA: e72fc5b2bfa073806e514cd7a05fdab6315a1df7
      BASE_TREE: 805265ffc0d24238490948c48830e329d6cba644
      BASE_PARENT: a4671e5f4aa706ecc56fbf1b0b619e26fcb105f22f
      SOURCE_BRANCH: basair/phase-3b-5c-hero-ownership-characterization
      EVIDENCE_BRANCH: basair/phase-3b-5c-hero-ownership-characterization-evidence
      REQUIRED_EVIDENCE_ANCESTOR: b8e7b6df2f28f7b94d2623dc7a0671bb101b9bb5
      REPEAT: ${{ matrix.repeat }}
    steps:
      - name: Checkout committed evidence harness
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-5c-hero-ownership-characterization-evidence
          fetch-depth: 0
          path: evidence

      - name: Checkout frozen source
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-5c-hero-ownership-characterization
          fetch-depth: 0
          path: source

      - name: Verify canary input identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$BASE_TREE"
          test "$(git -C source rev-parse HEAD^1)" = "$BASE_PARENT"
          git -C evidence merge-base --is-ancestor "$REQUIRED_EVIDENCE_ANCESTOR" HEAD
          node --check evidence/scripts/evidence/phase-3b5c-hero-browser-characterization.mjs
          echo CANARY_INPUT_IDENTITY_PASS

      - name: Prepare committed harness
        shell: bash
        run: |
          set -euo pipefail
          HARNESS_DIR="${RUNNER_TEMP}/phase3b5c-harness"
          OUT_DIR="${RUNNER_TEMP}/phase3b5c-out"
          rm -rf "$HARNESS_DIR" "$OUT_DIR"
          mkdir -p "$HARNESS_DIR" "$OUT_DIR"
          cd "$HARNESS_DIR"
          npm init -y >/dev/null
          npm install --no-package-lock postcss postcss-selector-parser puppeteer-core >/dev/null
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b5c-hero-static-characterization.mjs" static.mjs
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b5c-hero-browser-characterization.mjs" browser.mjs
          node --check browser.mjs
          echo COMMITTED_HARNESS_READY

      - name: P1 static inventory
        shell: bash
        run: |
          set -euo pipefail
          HARNESS_DIR="${RUNNER_TEMP}/phase3b5c-harness"
          OUT_DIR="${RUNNER_TEMP}/phase3b5c-out"
          cd "$HARNESS_DIR"
          BASE_SHA="$BASE_SHA" node static.mjs \
            --source="${GITHUB_WORKSPACE}/source" \
            --out="$OUT_DIR/static-inventory.json"
          python3 -m json.tool "$OUT_DIR/static-inventory.json" >/dev/null

      - name: Run P1 S-S X-X S-X canary
        id: browser
        shell: bash
        run: |
          set -uo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -y >/dev/null
            sudo apt-get install -y xvfb >/dev/null
          fi
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          HARNESS_DIR="${RUNNER_TEMP}/phase3b5c-harness"
          OUT_DIR="${RUNNER_TEMP}/phase3b5c-out"
          cd "$HARNESS_DIR"
          set +e
          BASE_SHA="$BASE_SHA" xvfb-run -a node browser.mjs \
            --source="${GITHUB_WORKSPACE}/source" \
            --static="$OUT_DIR/static-inventory.json" \
            --out="$OUT_DIR/browser-evidence.json" \
            --chrome="$CHROME_BIN" \
            --repeat="$REPEAT"
          status=$?
          set -e
          echo "$status" > "$OUT_DIR/browser-exit.txt"
          if [ -s "$OUT_DIR/browser-evidence.json" ]; then python3 -m json.tool "$OUT_DIR/browser-evidence.json" >/dev/null; fi
          echo BROWSER_EXIT=$status
          exit 0

      - name: Build raw diagnostic artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${RUNNER_TEMP}/phase3b5c-out"
          mkdir -p "$OUT_DIR"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'phase3b5c-out'
          src=out/'browser-evidence.json'
          if not src.exists():
              (out/'canary-summary.json').write_text(json.dumps({'ready':False,'reason':'browser-evidence-missing'},indent=2))
              raise SystemExit(0)
          b=json.loads(src.read_text())
          modes=b.get('modes',{})
          mapping={'sourceSource':'control-source-source.json','syntheticSynthetic':'control-synthetic-synthetic.json','sourceSynthetic':'real-source-synthetic.json'}
          for key,name in mapping.items():
              (out/name).write_text(json.dumps(modes.get(key),indent=2,ensure_ascii=False))
          deltas=[];inventories={};readiness={}
          for key,m in modes.items():
              deltas.extend(m.get('deltaAttribution',[]))
              inventories[key]={'entranceMotion':m.get('entranceMotion'),'recordInventories':[{'label':r.get('label'),'inventoryEqual':r.get('inventoryEqual'),'source':r.get('source',{}).get('animationInventory'),'synthetic':r.get('synthetic',{}).get('animationInventory')} for r in m.get('records',[])],'motionInventories':[{'label':r.get('label'),'inventoryEqual':r.get('inventoryEqual'),'source':r.get('source',{}).get('animationInventory'),'synthetic':r.get('synthetic',{}).get('animationInventory')} for r in m.get('motionRecords',[])]}
              readiness[key]=[{'label':r.get('label'),'problems':r.get('readinessProblems'),'source':r.get('source',{}).get('readiness'),'synthetic':r.get('synthetic',{}).get('readiness')} for r in [*m.get('records',[]),*m.get('motionRecords',[])]]
          (out/'delta-attribution.json').write_text(json.dumps(deltas,indent=2,ensure_ascii=False))
          (out/'animation-inventories.json').write_text(json.dumps(inventories,indent=2,ensure_ascii=False))
          (out/'readiness-diagnostics.json').write_text(json.dumps(readiness,indent=2,ensure_ascii=False))
          def brief(m):
              t=(m or {}).get('totals',{});mt=(m or {}).get('motionTotals',{})
              return {'comparisons':t.get('comparisons',0),'computed':t.get('computed',0),'geometry':t.get('geometry',0),'custom':t.get('custom',0),'state':t.get('state',0),'motion':sum(mt.get(k,0) for k in ['computed','geometry','custom','state','accessibility']),'accessibility':t.get('accessibility',0),'resources':(m or {}).get('resourceFailureCount',0),'inventoryMismatches':t.get('inventoryMismatches',0)+mt.get('inventoryMismatches',0),'readinessBlockers':(m or {}).get('readinessBlockers',0),'pass':(m or {}).get('pass',False)}
          summary={'repeat':b.get('repeat'),'baseSha':b.get('baseSha'),'variant':b.get('variant'),'S/S':brief(modes.get('sourceSource')),'X/X':brief(modes.get('syntheticSynthetic')),'S/X':brief(modes.get('sourceSynthetic')),'controlsPass':b.get('controlsPass'),'realPass':b.get('realPass'),'ready':b.get('ready'),'fatal':b.get('fatal')}
          (out/'canary-summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False))
          print('P1 CONTROL SOURCE/SOURCE',summary['S/S'])
          print('P1 CONTROL SYNTHETIC/SYNTHETIC',summary['X/X'])
          print('P1 REAL SOURCE/SYNTHETIC',summary['S/X'])
          print('CANARY_READY',summary['ready'])
          PY

      - name: Final frozen-source immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${RUNNER_TEMP}/phase3b5c-out"
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$BASE_TREE"
          test "$(git -C source rev-parse HEAD^1)" = "$BASE_PARENT"
          test "$(git -C source merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test -z "$(git -C source status --porcelain)"
          test -z "$(git -C source diff --name-only "$BASE_SHA"..HEAD)"
          (cd source && node scripts/verify-css-consolidation-preflight.mjs --expected-css-count=52)
          {
            echo SOURCE_HEAD=$(git -C source rev-parse HEAD)
            echo SOURCE_TREE=$(git -C source rev-parse HEAD^{tree})
            echo SOURCE_PARENT=$(git -C source rev-parse HEAD^1)
            echo SOURCE_MERGE_BASE=$(git -C source merge-base HEAD "$BASE_SHA")
            echo PRODUCTION_CHANGED_PATHS=0
            echo PRODUCTION_CSS=52
            echo FINAL_SOURCE_IMMUTABILITY_PASS
          } | tee "$OUT_DIR/final-source-identity.txt"

      - name: Upload P1 canary evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3b5c-p1-canary-${{ matrix.repeat }}
          path: ${{ runner.temp }}/phase3b5c-out
          if-no-files-found: warn
          compression-level: 6

      - name: Enforce canary gate after artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${RUNNER_TEMP}/phase3b5c-out"
          test -s "$OUT_DIR/browser-exit.txt"
          test "$(cat "$OUT_DIR/browser-exit.txt")" = "0"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'phase3b5c-out'/'canary-summary.json'
          s=json.loads(p.read_text())
          assert s.get('ready') is True, s
          for key in ['S/S','X/X','S/X']:
              m=s[key]
              assert m['comparisons']==93, (key,m)
              assert all(m[x]==0 for x in ['computed','geometry','custom','state','motion','accessibility','resources','inventoryMismatches','readinessBlockers']), (key,m)
          print('P1_DETERMINISM_CANARY_PASS')
          PY
