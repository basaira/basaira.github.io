name: Phase 2 Review Fix CI
on:
  push:
    branches: ["basair/phase-2-review-fix-ci"]
permissions:
  contents: write
jobs:
  fix-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply surface-safe alias isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "afb9d9d77aec1af69163719927ea6a0fe07110b2" || true
          python3 - <<'PY'
          import json,re,pathlib,posixpath,collections
          root=pathlib.Path('.')
          mf=json.loads((root/'token-authority-manifest.json').read_text())
          aliases=mf['aliases']
          def cls(a):
            if a=='--gold': return 'A'
            if a in {'--line','--muted'}: return 'E'
            if a.startswith('--admin-'): return 'D'
            if a.startswith('--acq-'): return 'C'
            if a.startswith('--basair-'): return 'B'
            if a.startswith(('--layout-','--type-','--leading-','--measure-','--motion-')): return 'B'
            if a in {'--quranic','--quranic-deep','--gold-ink','--ink','--ivory','--navy','--surface','--shadow','--radius-md','--radius-lg','--radius-xl'}: return 'C'
            raise SystemExit(f'Unclassified alias: {a}')
          classes={a:cls(a) for a in aliases}
          counts=collections.Counter(classes.values())
          print('CLASS_COUNTS',dict(counts))
          # Capture current alias declarations before moving them.
          tokens=(root/'tokens.css').read_text()
          def find_decl(a):
            m=re.search(rf'^\s*{re.escape(a)}\s*:\s*([^;]+);\s*$',tokens,re.M)
            if not m: raise SystemExit(f'missing authority alias {a}')
            return m.group(1).strip()
          vals={a:find_decl(a) for a in aliases}
          # Remove every non-global legacy alias from global authority. Keep canonical tokens and --gold only.
          for a in aliases:
            if classes[a]!='A':
              tokens,n=re.subn(rf'^\s*{re.escape(a)}\s*:\s*[^;]+;\s*\n?', '', tokens, count=1, flags=re.M)
              if n!=1: raise SystemExit(f'failed removing global alias {a}')
          tokens=tokens.replace('/* Compatibility aliases: preserve historical contracts while ownership migrates. */','/* Global compatibility aliases only: cross-surface semantic/value contract must be identical. */')
          (root/'tokens.css').write_text(tokens)
          def bridge(title, code, include_ambiguous=False):
            names=[a for a in aliases if classes[a]==code]
            if include_ambiguous: names += [a for a in aliases if classes[a]=='E']
            lines=[f'/* Basair Academy — {title}', '   Legacy bindings are surface-scoped; canonical semantic tokens remain in tokens.css. */', ':root {']
            for a in names: lines.append(f'  {a}: {vals[a]};')
            lines.append('}')
            return '\n'.join(lines)+'\n'
          (root/'tokens-public-compat.css').write_text(bridge('Public compatibility bridge','B'))
          (root/'tokens-acquisition-compat.css').write_text(bridge('Acquisition compatibility bridge','C',True))
          (root/'tokens-admin-compat.css').write_text(bridge('Admin compatibility bridge','D'))
          # Import bridges immediately after canonical authority; preserve every other stylesheet/order.
          for fn,imp in [('index.css','@import "./tokens-public-compat.css";'),('acquisition.css','@import "./tokens-acquisition-compat.css";'),('admin-ui-fixes-v1.css','@import "./tokens-admin-compat.css";')]:
            p=root/fn; t=p.read_text(); marker='@import "./tokens.css";'
            if marker not in t: raise SystemExit(f'{fn} missing tokens import')
            if imp not in t: t=t.replace(marker,marker+'\n'+imp,1)
            p.write_text(t)
          # Confirm admin inline owns the ambiguous legacy values.
          admin=(root/'admin.html').read_text()
          styles=re.findall(r'<style\b[^>]*>([\s\S]*?)</style\s*>',admin,re.I)
          if not styles: raise SystemExit('admin inline style missing')
          inline='\n'.join(styles)
          def inline_val(name):
            m=re.search(rf'{re.escape(name)}\s*:\s*([^;}}]+)',inline)
            return m.group(1).strip() if m else None
          expected={'--muted':'rgba(255,255,255,.62)','--line':'rgba(255,255,255,.12)','--gold':'#d4af37'}
          for a,v in expected.items():
            if (inline_val(a) or '').replace(' ','').lower()!=v.replace(' ','').lower(): raise SystemExit(f'admin inline {a} changed/missing: {inline_val(a)}')
          # Manifest classification + bindings.
          files={'A':'tokens.css','B':'tokens-public-compat.css','C':'tokens-acquisition-compat.css','D':'tokens-admin-compat.css'}
          labels={'A':'genuinely-cross-surface-identical','B':'public-only','C':'acquisition-only','D':'admin-only','E':'ambiguous-different-semantics-by-surface'}
          for a,meta in aliases.items():
            c=classes[a]; meta['surfaceClassification']=c; meta['surfaceClassificationLabel']=labels[c]
            if c in files:
              meta['bindingFile']=files[c]
            else:
              meta.pop('bindingFile',None)
              meta['surfaceBindings']={
                'acquisition':{'file':'tokens-acquisition-compat.css','canonical':meta['canonical']},
                'admin':{'owner':'admin.html::<style#1>','value':expected[a],'canonical':None}
              }
              meta['sameSemanticMeaning']=False
              meta['safeAlias']=True
              meta['migrationRisk']='moderate'
              meta['note']='Same legacy name has different Admin and Acquisition semantics; never bind globally.'
          mf['aliasSurfaceSummary']={
            'classificationCounts':dict(sorted(counts.items())),
            'globalCompatibilityAliases':sorted(a for a,c in classes.items() if c=='A'),
            'publicCompatibilityAliases':sorted(a for a,c in classes.items() if c=='B'),
            'acquisitionCompatibilityAliases':sorted(a for a,c in classes.items() if c=='C'),
            'adminCompatibilityAliases':sorted(a for a,c in classes.items() if c=='D'),
            'ambiguousCompatibilityAliases':sorted(a for a,c in classes.items() if c=='E'),
            'bridges':{'public':'tokens-public-compat.css','acquisition':'tokens-acquisition-compat.css','admin':'tokens-admin-compat.css'}
          }
          mf['phase2ReviewFix']={
            'reason':'Surface-isolate legacy aliases so later tokens.css cannot overwrite semantically different inline/admin legacy variables.',
            'preservedAdminInline':expected,
            'intentionalComputedValueChanges':[],
            'legacyConflictDecisionsNote':'conflictDecisions is the original 30-item Phase-1/2 migration decision set and is not treated as exhaustive after inline-style scope correction.'
          }
          # Corrected audited scope: external production CSS plus inline style blocks.
          css_files={str(p).replace('\\','/') for p in root.rglob('*.css') if '.git' not in p.parts and 'dist' not in p.parts}
          def resolve(base,href):
            href=href.split('?')[0].split('#')[0]
            if not href or href.startswith(('http:','https:','//','data:')): return None
            p=('/'+href.lstrip('/')) if href.startswith('/') else posixpath.normpath(posixpath.join(posixpath.dirname(base),href)); p=p.lstrip('/')
            return p if p in css_files else None
          production=set(); inline_blocks=[]
          for hp in sorted(root.rglob('*.html')):
            if '.git' in hp.parts or 'dist' in hp.parts: continue
            rel=str(hp).replace('\\','/'); txt=hp.read_text()
            for i,s in enumerate(re.findall(r'<style\b[^>]*>([\s\S]*?)</style\s*>',txt,re.I),1): inline_blocks.append((f'{rel}::<style#{i}>',s))
            for tag in re.findall(r'<link\b[^>]*>',txt,re.I):
              rm=re.search(r'\brel=["\']([^"\']+)',tag,re.I); hm=re.search(r'\bhref=["\']([^"\']+)',tag,re.I)
              if rm and hm and 'stylesheet' in rm.group(1).lower().split():
                p=resolve(rel,hm.group(1));
                if p: production.add(p)
          changed=True
          while changed:
            changed=False
            for f in list(production):
              t=(root/f).read_text()
              for href in re.findall(r'@import\s+(?:url\()?\s*["\']([^"\']+)',t):
                if href.startswith(('.', '/')):
                  p=resolve(f,href)
                  if p and p not in production: production.add(p); changed=True
          def decls(src,text):
            text=re.sub(r'/\*[\s\S]*?\*/','',text)
            out=[]
            for m in re.finditer(r'(--[A-Za-z0-9_-]+)\s*:\s*([^;}{]+?)\s*(?=;|})',text):
              v=re.sub(r'\s*!important\s*$','',m.group(2).strip(),flags=re.I)
              out.append((m.group(1),v,src))
            return out
          by=collections.defaultdict(list)
          for f in sorted(production):
            for n,v,s in decls(f,(root/f).read_text()): by[n].append((v,s))
          for s,t in inline_blocks:
            for n,v,src in decls(s,t): by[n].append((v,src))
          canonical={k:v for k,v in mf['canonicalTokens'].items()}
          def audit_norm(v):
            v=re.sub(r'\s+',' ',v.strip()).lower()
            m=re.fullmatch(r'var\((--[a-z0-9_-]+)\)',v)
            if m and m.group(1) in canonical: return re.sub(r'\s+',' ',canonical[m.group(1)].strip()).lower()
            return v
          conflicts=sorted(n for n,xs in by.items() if len({audit_norm(v) for v,s in xs})>1)
          mf['correctedAuditScope']={
            'includesExternalProductionCss':True,
            'includesInlineStyleBlocks':True,
            'productionCssFileCount':len(production),
            'inlineStyleBlockCount':len(inline_blocks),
            'customPropertyNameCount':len(by),
            'conflictCount':len(conflicts),
            'conflictTokens':conflicts,
            'comparisonNormalization':'case/whitespace normalized; trailing !important stripped; direct var(--canonical) aliases resolved to canonical literal value',
            'scopeDeltaFromOriginal30':{'originalDecisionCount':len(mf.get('conflictDecisions',[])),'note':'Corrected scope is independently recomputed and may include responsive/component-state conflicts plus inline HTML definitions. The original 30 migration decisions are retained as historical decisions, not exhaustive inventory.'}
          }
          (root/'token-authority-manifest.json').write_text(json.dumps(mf,indent=2,ensure_ascii=False)+'\n')
          print('CORRECTED_SCOPE',mf['correctedAuditScope'])
          PY
          cat > token-authority-check.mjs <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          import posix from "node:path/posix";
          const root=process.cwd();
          const read=(p)=>fs.readFileSync(path.join(root,p),"utf8");
          const manifest=JSON.parse(read("token-authority-manifest.json"));
          const authority=read(manifest.authorityFile);
          const design=read("DESIGN.md");
          const bridges={B:"tokens-public-compat.css",C:"tokens-acquisition-compat.css",D:"tokens-admin-compat.css"};
          const stripComments=(s)=>s.replace(/\/\*[\s\S]*?\*\//g,"");
          const norm=(s)=>String(s).trim().replace(/\s*!important\s*$/i,"").replace(/\s+/g," ").toLowerCase();
          const decls=(s)=>[...stripComments(s).matchAll(/(--[A-Za-z0-9_-]+)\s*:\s*([^;}{]+?)\s*(?=;|})/g)].map(m=>({name:m[1],value:m[2].trim()}));
          const vars=(s)=>[...stripComments(s).matchAll(/var\(\s*(--[A-Za-z0-9_-]+)\s*(,\s*[^)]*)?\)/g)].map(m=>({name:m[1],fallback:!!m[2]}));
          const fail=(s)=>{throw new Error(`Token authority contract failed: ${s}`)};
          const byName=new Map();
          for(const d of decls(authority)){if(!byName.has(d.name))byName.set(d.name,[]);byName.get(d.name).push(d.value)}
          for(const [name,expected] of Object.entries(manifest.canonicalTokens)){
            const vals=byName.get(name)||[];
            if(vals.length!==1)fail(`${name} must be declared exactly once in ${manifest.authorityFile}; got ${vals.length}`);
            if(norm(vals[0])!==norm(expected))fail(`${name} differs from manifest`);
          }
          for(const [name,expected] of Object.entries(manifest.designExplicit)){
            if(!manifest.canonicalTokens[name])fail(`DESIGN token ${name} is not canonical`);
            if(norm(manifest.canonicalTokens[name])!==norm(expected))fail(`${name} diverges from DESIGN mapping`);
            if(!norm(design).replace(/\s+/g,"").includes(norm(expected).replace(/\s+/g,"")))fail(`DESIGN.md no longer contains ${expected}`);
          }
          const allowed=new Set(["A","B","C","D","E"]);
          const bridgeText=Object.fromEntries(Object.entries(bridges).map(([k,f])=>[k,read(f)]));
          const bridgeDecls=Object.fromEntries(Object.entries(bridgeText).map(([k,t])=>[k,new Map(decls(t).map(d=>[d.name,d.value]))]));
          const edge=new Map();
          let globalAliasCount=0;
          const classCounts={A:0,B:0,C:0,D:0,E:0};
          for(const [legacy,meta] of Object.entries(manifest.aliases)){
            const c=meta.surfaceClassification;
            if(!allowed.has(c))fail(`${legacy} missing valid surfaceClassification`);
            classCounts[c]++;
            if(!manifest.canonicalTokens[meta.canonical])fail(`${legacy} points to missing canonical ${meta.canonical}`);
            const authVals=byName.get(legacy)||[];
            if(c==="A"){
              globalAliasCount++;
              if(authVals.length!==1)fail(`${legacy} class A must be global exactly once`);
              const target=authVals[0].match(/^var\((--[A-Za-z0-9_-]+)\)$/)?.[1];
              if(target!==meta.canonical)fail(`${legacy} global target mismatch`);
              edge.set(legacy,target);
              for(const [bc,m] of Object.entries(bridgeDecls))if(m.has(legacy))fail(`${legacy} class A leaked into bridge ${bc}`);
            } else {
              if(authVals.length)fail(`${legacy} class ${c} must not be globally bound in tokens.css`);
              if(c==="E"){
                const v=bridgeDecls.C.get(legacy); const target=v?.match(/^var\((--[A-Za-z0-9_-]+)\)$/)?.[1];
                if(target!==meta.canonical)fail(`${legacy} ambiguous acquisition binding mismatch`);
                if(bridgeDecls.B.has(legacy)||bridgeDecls.D.has(legacy))fail(`${legacy} ambiguous alias leaked into wrong bridge`);
                edge.set(legacy,target);
              } else {
                const expectedBridge=bridges[c]; const v=bridgeDecls[c].get(legacy); const target=v?.match(/^var\((--[A-Za-z0-9_-]+)\)$/)?.[1];
                if(target!==meta.canonical)fail(`${legacy} class ${c} missing/mismatched in ${expectedBridge}`);
                edge.set(legacy,target);
                for(const [bc,m] of Object.entries(bridgeDecls))if(bc!==c&&m.has(legacy))fail(`${legacy} class ${c} leaked into bridge ${bc}`);
              }
            }
          }
          for(const start of edge.keys()){const seen=new Set();let cur=start;while(edge.has(cur)){if(seen.has(cur))fail(`alias cycle from ${start}`);seen.add(cur);cur=edge.get(cur)}}
          function walk(dir){const out=[];for(const e of fs.readdirSync(dir,{withFileTypes:true})){if(["node_modules","dist",".git"].includes(e.name))continue;const abs=path.join(dir,e.name);if(e.isDirectory())out.push(...walk(abs));else out.push(abs)}return out}
          const cssSet=new Set(walk(root).filter(f=>f.endsWith(".css")).map(f=>path.relative(root,f).replaceAll(path.sep,"/")));
          function resolveCss(fromFile,href){const clean=href.split("?")[0].split("#")[0];if(!clean||/^(?:https?:)?\/\//.test(clean)||clean.startsWith("data:"))return null;const rel=clean.startsWith("/")?clean.slice(1):posix.normalize(posix.join(posix.dirname(fromFile),clean));return cssSet.has(rel)?rel:null}
          const pages=[];
          for(const abs of walk(root).filter(f=>f.endsWith(".html"))){
            const rel=path.relative(root,abs).replaceAll(path.sep,"/");const html=fs.readFileSync(abs,"utf8");const linked=[];
            for(const tag of html.match(/<link\b[^>]*>/gi)||[]){const ra=tag.match(/\brel=["']([^"']+)["']/i)?.[1]||"";const href=tag.match(/\bhref=["']([^"']+)["']/i)?.[1];if(!href||!ra.toLowerCase().split(/\s+/).includes("stylesheet"))continue;const c=resolveCss(rel,href);if(c)linked.push(c)}
            const loaded=new Set();const stack=[...linked];while(stack.length){const f=stack.shift();if(loaded.has(f))continue;loaded.add(f);for(const m of read(f).matchAll(/@import\s+(?:url\()?\s*["']([^"']+)["']/g)){const href=m[1];if(!href.startsWith(".")&&!href.startsWith("/"))continue;const c=resolveCss(f,href);if(c&&!loaded.has(c))stack.push(c)}}
            const inline=[...(html.matchAll(/<style\b[^>]*>([\s\S]*?)<\/style\s*>/gi))].map((m,i)=>({source:`${rel}::<style#${i+1}>`,text:m[1]}));
            const surface=rel==="admin.html"||[...loaded].some(f=>/^admin(?:-|\.)/.test(posix.basename(f)))?"admin":[...loaded].some(f=>posix.basename(f)==="acquisition.css"||posix.basename(f).startsWith("acquisition-"))?"acquisition":"public";
            pages.push({rel,html,loaded,inline,surface});
          }
          if(!pages.some(p=>p.surface==="admin")||!pages.some(p=>p.surface==="acquisition")||!pages.some(p=>p.surface==="public"))fail("all three surface families must be discovered");
          for(const p of pages)if(!p.loaded.has(manifest.authorityFile))fail(`${p.rel} cannot reach ${manifest.authorityFile}`);
          const allProdCss=new Set(pages.flatMap(p=>[...p.loaded]));
          for(const file of allProdCss){if(file===manifest.authorityFile)continue;const defs=new Set(decls(read(file)).map(x=>x.name));for(const n of Object.keys(manifest.canonicalTokens))if(defs.has(n))fail(`canonical ${n} re-declared in ${file}`)}
          for(const p of pages)for(const block of p.inline){const defs=new Set(decls(block.text).map(x=>x.name));for(const n of Object.keys(manifest.canonicalTokens))if(defs.has(n))fail(`canonical ${n} re-declared inline at ${block.source}`)}
          // Inline collision model: a class-A global alias may shadow inline only when resolved value contract is identical.
          const resolveCanonical=(v)=>{const m=norm(v).match(/^var\((--[a-z0-9_-]+)\)$/);return m&&manifest.canonicalTokens[m[1]]?norm(manifest.canonicalTokens[m[1]]):norm(v)};
          for(const [legacy,meta] of Object.entries(manifest.aliases)){
            const inlineDefs=pages.flatMap(p=>p.inline.flatMap(b=>decls(b.text).filter(d=>d.name===legacy).map(d=>({p,b,d}))));
            if(meta.surfaceClassification==="A"){
              const gv=(byName.get(legacy)||[])[0];for(const x of inlineDefs)if(resolveCanonical(gv)!==resolveCanonical(x.d.value))fail(`${legacy} global alias shadows different inline contract at ${x.b.source}`);
            }
            if(meta.surfaceClassification==="E"){
              const adminDefs=inlineDefs.filter(x=>x.p.surface==="admin");if(!adminDefs.length)fail(`${legacy} ambiguous alias lost Admin inline owner`);
              const expected=meta.surfaceBindings?.admin?.value;if(!expected||!adminDefs.some(x=>norm(x.d.value)===norm(expected)))fail(`${legacy} Admin inline value drifted`);
            }
          }
          // Undefined vars are checked per production page, including inline style blocks.
          for(const p of pages){const sources=[...p.loaded].map(f=>read(f)).concat(p.inline.map(x=>x.text));const defined=new Set(sources.flatMap(t=>decls(t).map(d=>d.name)));for(const t of sources)for(const v of vars(t))if(!v.fallback&&!defined.has(v.name))fail(`undefined ${v.name} without fallback on ${p.rel}`)}
          for(const n of Object.keys(manifest.canonicalTokens)){if(manifest.componentLocalPrefixes.some(p=>n.startsWith(p)))fail(`component-local prefix promoted: ${n}`);if(manifest.componentLocalExplicit.includes(n))fail(`component-local token promoted: ${n}`)}
          if(!read("animate-v1.css").includes("prefers-reduced-motion"))fail("prefers-reduced-motion contract missing");
          if(![...allProdCss].some(f=>/forced-colors/i.test(read(f))))fail("forced-colors contract missing");
          if(!fs.existsSync(path.join(root,"track-buttons-v6.css")))fail("track-buttons-v6.css missing");
          // Exhaustive corrected conflict inventory: external production CSS + inline styles, deduped by source.
          const auditBy=new Map();const add=(src,text)=>{for(const d of decls(text)){if(!auditBy.has(d.name))auditBy.set(d.name,[]);auditBy.get(d.name).push({src,value:d.value})}};
          for(const f of [...allProdCss].sort())add(f,read(f));for(const p of pages)for(const b of p.inline)add(b.source,b.text);
          const actual=[...auditBy.entries()].filter(([n,xs])=>new Set(xs.map(x=>resolveCanonical(x.value))).size>1).map(([n])=>n).sort();
          const declared=[...(manifest.correctedAuditScope?.conflictTokens||[])].sort();
          if(JSON.stringify(actual)!==JSON.stringify(declared))fail(`corrected conflict inventory drift: actual ${actual.length}, manifest ${declared.length}`);
          if(manifest.correctedAuditScope.productionCssFileCount!==allProdCss.size)fail("corrected production CSS scope count drift");
          const inlineCount=pages.reduce((n,p)=>n+p.inline.length,0);if(manifest.correctedAuditScope.inlineStyleBlockCount!==inlineCount)fail("corrected inline-style scope count drift");
          if(!manifest.correctedAuditScope.includesInlineStyleBlocks)fail("inline-style audit scope disabled");
          if(manifest.conflictDecisions.length!==30)fail("historical 30 migration decisions changed unexpectedly");
          console.log(`Token authority PASS: ${Object.keys(manifest.canonicalTokens).length} canonical; aliases A/B/C/D/E=${classCounts.A}/${classCounts.B}/${classCounts.C}/${classCounts.D}/${classCounts.E}; corrected conflicts=${actual.length}; production CSS=${allProdCss.size}; inline styles=${inlineCount}.`);
          EOF
          node token-authority-check.mjs
          git diff --check
      - name: Verify forbidden surfaces unchanged
        shell: bash
        run: |
          set -euo pipefail
          BASE=afb9d9d77aec1af69163719927ea6a0fe07110b2
          git diff --exit-code "$BASE" -- app.js admin.js acquisition.js firestore.rules firebase-config.js index.html admin.html en ru uz track-buttons-v6.css public-ui-fixes-v1.js form-overdrive-v1.js
          test "$(git hash-object track-buttons-v6.css)" = "b7225c70d6ece6b5a0e8380cd24ce8be6d9d0ea7"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install clean dependencies
        run: npm ci
      - name: Full verification
        run: npm run verify
      - name: Explicit production build
        run: npm run build
      - name: Commit verified source candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase2-review-fix-ci.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          echo 'FINAL_CHANGED_FILES_FROM_AFB9:'
          git diff --cached --name-only afb9d9d77aec1af69163719927ea6a0fe07110b2
          echo 'FINAL_DIFFSTAT_FROM_AFB9:'
          git diff --cached --stat afb9d9d77aec1af69163719927ea6a0fe07110b2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Phase 2 review: isolate legacy token bindings by surface'
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:basair/phase-2-review-fix-ci
