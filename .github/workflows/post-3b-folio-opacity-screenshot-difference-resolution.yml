          let stateMismatch=sn.filter(x=>!x.stateHashEqual),allCrossZero=xn.length===0,cause='C6 — INCONCLUSIVE',outcome='F — INCONCLUSIVE',root='Unresolved',pixel='NOT PROVEN';if(sn.length){if(stateMismatch.length){cause='C1 — HARNESS NONDETERMINISM';root='Same variant changed pixels with normalized render-state changes.'}else{cause='C3 — BROWSER RASTERIZATION NONDETERMINISM';root='Same variant changed pixels despite identical normalized render-state fingerprints.'}if(allCrossZero){outcome=cause.startsWith('C3')?'C — BROWSER RASTER NONDETERMINISM PROVEN; CANONICAL M4↔M5 PIXEL EQUIVALENCE PROVEN':'A — HARNESS / RENDER NONDETERMINISM PROVEN; CANONICAL M4↔M5 PIXEL EQUIVALENCE PROVEN';pixel='PROVEN'}}else if(allCrossZero){cause='C1 — HARNESS NONDETERMINISM';outcome='A — HARNESS / RENDER NONDETERMINISM PROVEN; CANONICAL M4↔M5 PIXEL EQUIVALENCE PROVEN';root='Both variants are self-stable and 20 repeated canonical M4-M5 captures are pixel-identical; previous one-shot deltas are not reproducible under fixed normalization.';pixel='PROVEN'}else{cause='C5 — REAL VISUAL DIFFERENCE BUT NOT YET CAUSALLY ATTRIBUTED';outcome='E — REAL DIFFERENCE EXISTS BUT CAUSE NOT YET RESOLVED';root='Repeated cross-difference remains while removed selector has zero natural matches; fifth-rule causality is not proven.'}
