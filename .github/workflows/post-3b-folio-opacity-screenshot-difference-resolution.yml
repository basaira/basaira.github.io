          const summary={outcome,rootCause:root,causeClassification:cause,pixelEquivalence:pixel,previousDesktopDiff:success?'NON-PRODUCT ARTIFACT':'UNRESOLVED',previousMobileDiff:success?'NON-PRODUCT ARTIFACT':'UNRESOLVED',m4SelfConsistency:Object.values(freshSelf4).flat().every(x=>x.pixelIdentical)?'SELF-STABLE':'SELF-NONDETERMINISTIC',m5SelfConsistency:Object.values(freshSelf5).flat().every(x=>x.pixelIdentical)?'SELF-STABLE':'SELF-NONDETERMINISTIC',orderEffect,canonicalPairs:crossRows.length,canonicalNonzero:crossNon.length,allCanonicalDiffPixels:crossNon.length?null:0,allCanonicalMaxChannelDelta:crossNon.length?null:0,fifthRuleRole:'F3 — DEAD REDUNDANT FOLIO RESIDUE',naturalMatchCount:0,reachableMarkerCreationPaths:0,m5BuiltFolioResidues:0,fifthPathDisposition:success?'P1 — SAFE FUTURE REMOVAL CANDIDATE':'P4 — REQUIRES DESIGN / BEHAVIOR DECISION',m5ContractStatus:success?'READY FOR RE-AUTHORIZATION REVIEW':'NO',implementationAuthorized:false,promotionAuthorized:false,deploymentAuthorized:false,nextPossibleGate:success?'FOLIO OPACITY M4 -> M5 IMPLEMENTATION RE-AUTHORIZATION REVIEW':'SMALLEST FOLLOW-UP DIAGNOSTIC REQUIRED',doNotMutateProduction:true};
          fs.writeFileSync(path.join(OUT,'folio-screenshot-resolution-summary.json'),JSON.stringify(summary,null,2));
          JS

          OUT="${OUT}" M4="${M4}" M5="${M5}" node .strict.mjs
          rm -f .strict.mjs
          test -z "$(git status --porcelain)"

      - name: Terminal refs and required evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/shot"
          api(){ curl --fail --silent --show-error --location -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "$1"; }
          MAIN="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main"|jq -r '.object.sha')"; M4="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/basair/post-3b-folio-opacity-implementation"|jq -r '.object.sha')"; GH="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/gh-pages"|jq -r '.object.sha')"
          test "${MAIN}" = "${MAIN_SHA}"; test "${M4}" = "${M4_SHA}"; test "${GH}" = "${GH_SHA}"
          jq -n --arg main "${MAIN}" --arg m4 "${M4}" --arg gh "${GH}" '{main:$main,blockedM4:$m4,ghPages:$gh,mainMoved:false,blockedImplementationRewritten:false,ghPagesMoved:false,noPromotion:true,noDeployment:true,noPagesSettingsMutation:true,noFirebaseMutation:true,noBackendMutation:true}' > "${OUT}/folio-screenshot-resolution-terminal-refs.json"

          # Contract-required evidence names. Extra strict-control files are retained too.
          for F in \
            folio-screenshot-resolution-preflight.json \
            folio-screenshot-browser-environment.json \
            folio-screenshot-build-identities.json \
            folio-screenshot-resource-state.json \
            folio-screenshot-font-state.json \
            folio-screenshot-self-consistency-m4.json \
            folio-screenshot-self-consistency-m5.json \
            folio-screenshot-order-effect.json \
            folio-screenshot-browser-process-effect.json \
            folio-screenshot-dom-state-fingerprints.json \
            folio-screenshot-diff-regions.json \
            folio-screenshot-diff-elements.json \
            folio-screenshot-pixel-color-analysis.json \
            folio-screenshot-pseudo-element-analysis.json \
            folio-screenshot-cssom-diff.json \
            folio-screenshot-built-css-diff.json \
            folio-screenshot-built-js-diff.json \
            folio-screenshot-fullpage-vs-viewport.json \
            folio-screenshot-tiled-diagnostic.json \
            folio-screenshot-async-stability.json \
            folio-screenshot-layout-shifts.json \
            folio-screenshot-cross-variant-matrix.json \
            folio-screenshot-root-cause.json \
            folio-screenshot-canonical-recapture.json \
            folio-screenshot-resolution-summary.json \
            folio-screenshot-resolution-terminal-refs.json
          do test -s "${OUT}/${F}"; done

      - name: Upload strict screenshot-resolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-3b-folio-opacity-screenshot-difference-resolution-strict
          path: ${{ runner.temp }}/shot
          if-no-files-found: error
          retention-days: 90
