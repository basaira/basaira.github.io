name: Folio Screenshot Difference Resolution Strict

on:
  push:
    branches:
      - 'basair/post-3b-folio-opacity-screenshot-difference-resolution'

permissions:
  contents: read

env:
  MAIN_SHA: 006ba05c7361451865660450695c48428a3ed8d0
  MAIN_TREE: 2c0350c3bb50988842481a7bb28aa81c5d8e50ad
  M4_SHA: 5bc4e216a568a57b217187b4030f8208ad87fe31
  M4_TREE: d5cd6ee2a3f3bcb7fe226ba6dcfa314796c26d65
  GH_SHA: cef59ba05b3382978b4c18e83592f08227b2f9c4
  GH_TREE: 1b80d7144e8bac484cf98a4ebbefc1c96ca8d821
  FIFTH_BLOB: ef073fbb20c95292c40d6ca9f0775c1f2a4f8866

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout frozen main read-only
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MAIN_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fresh authority exact M5 and build identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/shot"; M4="${RUNNER_TEMP}/m4"; M5="${RUNNER_TEMP}/m5"
          mkdir -p "${OUT}"
          api(){ curl --fail --silent --show-error --location -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "$1"; }
          MAIN="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main"|jq -r '.object.sha')"
          M4R="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/basair/post-3b-folio-opacity-implementation"|jq -r '.object.sha')"
          GH="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/gh-pages"|jq -r '.object.sha')"
          MG="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${MAIN}")"; M4G="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${M4R}")"; GG="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${GH}")"
          test "${MAIN}" = "${MAIN_SHA}"; test "${M4R}" = "${M4_SHA}"; test "${GH}" = "${GH_SHA}"
          test "$(jq -r '.tree.sha'<<<"${MG}")" = "${MAIN_TREE}"; test "$(jq -r '.tree.sha'<<<"${M4G}")" = "${M4_TREE}"; test "$(jq -r '.tree.sha'<<<"${GG}")" = "${GH_TREE}"
          test "$(git rev-parse "${MAIN_SHA}:homepage-sections-v1.css")" = "${FIFTH_BLOB}"
          test "$(git rev-parse "${M4_SHA}:homepage-sections-v1.css")" = "${FIFTH_BLOB}"
          jq -n --arg main "${MAIN}" --arg m4 "${M4R}" --arg gh "${GH}" --arg mt "$(jq -r '.tree.sha'<<<"${MG}")" --arg m4t "$(jq -r '.tree.sha'<<<"${M4G}")" --arg gt "$(jq -r '.tree.sha'<<<"${GG}")" \
            '{main:$main,blockedM4:$m4,ghPages:$gh,mainTree:$mt,m4Tree:$m4t,ghPagesTree:$gt,authorityDrift:false}' > "${OUT}/folio-screenshot-resolution-preflight.json"

          git worktree add --detach "${M4}" "${M4_SHA}"
          git worktree add --detach "${M5}" "${MAIN_SHA}"

          M4="${M4}" M5="${M5}" OUT="${OUT}" python3 - <<'PY'
          import os,re,subprocess,json,hashlib
          from pathlib import Path
          m4=Path(os.environ["M4"]);m5=Path(os.environ["M5"]);out=Path(os.environ["OUT"])
          fifth='main > section.home-chapter > .overdrive-folio-marker{display:none!important}\n'
          # Exact characterized M4 + exact fifth rule deletion, from frozen main.
          p=m5/'overdrive-v1.js';s=p.read_text();m=re.search(r'\nfunction initFolioMarkers\(\) \{.*?\n\}\n\nfunction initOverdrive\(\)',s,re.S);assert m;p.write_text(s[:m.start()]+'\nfunction initOverdrive()'+s[m.end():])
          p=m5/'overdrive-v1.css';s=p.read_text();a=s.index('/* ── 3. Section leaves:');b=s.index('/* ── 4. Scroll-linked depth',a);s=s[:a]+s[b:]
          for x in ['  .overdrive-folio-marker { width: min(15rem,62vw); inset-block-start: .72rem; }\n','  .overdrive-folio-marker,\n','  .overdrive-folio-marker { opacity: .55 !important; transform: translateX(-50%) !important; }\n']:
            assert x in s;s=s.replace(x,'',1)
          p.write_text(s)
          p=m5/'visual-layout-hotfix-v2.css';s=p.read_text();x='.overdrive-folio-marker{display:none!important}\n';assert s.count(x)==1;p.write_text(s.replace(x,'',1))
          p=m5/'token-authority-manifest.json';s=p.read_text();assert s.count('    "--folio-opacity",\n')==2;s=s.replace('    "--folio-opacity",\n','',2).replace('    "customPropertyNameCount": 369,\n','    "customPropertyNameCount": 368,\n',1).replace('    "conflictCount": 39,\n','    "conflictCount": 38,\n',1);p.write_text(s)
          p=m5/'homepage-sections-v1.css';s=p.read_text();assert s.count(fifth)==1;p.write_text(s.replace(fifth,'',1))
          exp=['homepage-sections-v1.css','overdrive-v1.css','overdrive-v1.js','token-authority-manifest.json','visual-layout-hotfix-v2.css']
          changed=subprocess.check_output(['git','-C',str(m5),'diff','--name-only','HEAD','--'],text=True).splitlines();assert changed==exp
          subprocess.check_call(['git','-C',str(m5),'diff','--check'])
          # Prove byte identity to blocked M4 + one exact deletion.
          files=subprocess.check_output(['git','-C',str(m5),'ls-files'],text=True).splitlines();bad=[]
          for rel in files:
            a=(m4/rel).read_bytes();b=(m5/rel).read_bytes()
            if rel=='homepage-sections-v1.css':
              if a.decode().replace(fifth,'',1)!=b.decode():bad.append(rel)
            elif a!=b:bad.append(rel)
          assert not bad,bad
          json.dump({'m5PathCount':5,'paths':exp,'m5EqualsBlockedM4PlusExactFifthDeletion':True,'otherByteDifferences':0},open(out/'m5-reconstruction.json','w'),indent=2)
          PY

          npm ci >/dev/null
          ln -s "${GITHUB_WORKSPACE}/node_modules" "${M4}/node_modules"; ln -s "${GITHUB_WORKSPACE}/node_modules" "${M5}/node_modules"
          for V in M4 M5; do DIR="${M4}"; [ "${V}" = M5 ] && DIR="${M5}"; (cd "${DIR}" && npm run verify >"${OUT}/${V}-verify.log" 2>&1 && npm run build >"${OUT}/${V}-build.log" 2>&1 && node token-authority-check.mjs >"${OUT}/${V}-token.log" 2>&1); git -C "${DIR}" diff --check; done
          grep -F 'Token authority PASS: 106 canonical; aliases A/B/C/D/E=1/48/23/23/2; corrected conflicts=38; production CSS=51; inline styles=1.' "${OUT}/M4-token.log"
          grep -F 'Token authority PASS: 106 canonical; aliases A/B/C/D/E=1/48/23/23/2; corrected conflicts=38; production CSS=51; inline styles=1.' "${OUT}/M5-token.log"

          M4="${M4}" M5="${M5}" OUT="${OUT}" python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          o=Path(os.environ['OUT']);m4=Path(os.environ['M4']);m5=Path(os.environ['M5'])
          def snap(root):
            rows={}
            for p in sorted(x for x in root.rglob('*') if x.is_file()):
              b=p.read_bytes();rows[p.relative_to(root).as_posix()]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
            return rows
          a=snap(m4/'dist');b=snap(m5/'dist')
          ajs=[k for k in a if k.startswith('assets/main-') and k.endswith('.js')];acss=[k for k in a if k.startswith('assets/main-') and k.endswith('.css')]
          bjs=[k for k in b if k.startswith('assets/main-') and k.endswith('.js')];bcss=[k for k in b if k.startswith('assets/main-') and k.endswith('.css')]
          assert len(a)==25 and sum(x['bytes'] for x in a.values())==2554010 and ajs==['assets/main-CdDtQcjc.js'] and acss==['assets/main-BJIbyLNf.css']
          assert len(b)==25 and sum(x['bytes'] for x in b.values())==2553937 and bjs==['assets/main-B4PdnOC4.js'] and bcss==['assets/main-B-cTtzqp.css']
          json.dump({'M4':{'files':25,'bytes':2554010,'mainJs':ajs[0],'mainCss':acss[0]},'M5':{'files':25,'bytes':2553937,'mainJs':bjs[0],'mainCss':bcss[0]}},open(o/'folio-screenshot-build-identities.json','w'),indent=2)
          c4=(m4/'dist'/acss[0]).read_text();c5=(m5/'dist'/bcss[0]).read_text();r='main>section.home-chapter>.overdrive-folio-marker{display:none!important}'
          assert c4.count(r)==1 and r not in c5 and c4.replace(r,'',1)==c5
          json.dump({'exactSemanticDifferenceCount':1,'removedRule':r,'unrelatedBuiltCssChanges':0,'m4MinusRuleEqualsM5':True,'parserSideEffect':False,'adjacentRuleMerge':False,'cascadeReordering':False},open(o/'folio-screenshot-cssom-diff.json','w'),indent=2)
          json.dump({'exactSemanticDifferenceCount':1,'removedRule':r,'unrelatedBuiltCssChanges':0,'m4MinusRuleEqualsM5':True},open(o/'folio-screenshot-built-css-diff.json','w'),indent=2)
          j4=(m4/'dist'/ajs[0]).read_text();j5=(m5/'dist'/bjs[0]).read_text()
          same=j4==j5 or j4.replace(acss[0].split('/')[-1],'<CSS>')==j5.replace(bcss[0].split('/')[-1],'<CSS>');assert same
          json.dump({'executableBehaviorDifference':False,'differenceLimitedToAssetReferenceMetadata':j4!=j5},open(o/'folio-screenshot-built-js-diff.json','w'),indent=2)
          PY

      - name: Install fixed browser environment and run strict diagnostic matrix
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/shot"; M4="${RUNNER_TEMP}/m4"; M5="${RUNNER_TEMP}/m5"
          npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7.0.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          git checkout -- package.json package-lock.json 2>/dev/null || true; rm -f node_modules/.package-lock.json 2>/dev/null || true
          uname -a >"${OUT}/os.txt"; (fc-list||true)|sort >"${OUT}/fonts.txt"
          python3 -m http.server 4674 --directory "${M4}/dist" >/tmp/m4-strict.log 2>&1 &
          python3 -m http.server 4675 --directory "${M5}/dist" >/tmp/m5-strict.log 2>&1 &
          sleep 2

          cat > .strict.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { PNG } from 'pngjs';

          const OUT=process.env.OUT;
          const O={M4:'http://127.0.0.1:4674',M5:'http://127.0.0.1:4675'};
          const V=[{n:'desktop',w:1440,h:1000},{n:'mobile',w:390,h:844},{n:'below760',w:759,h:900},{n:'above760',w:761,h:900}];
          const ARGS=['--disable-background-networking','--disable-default-apps','--disable-sync','--no-first-run'];
          const H=b=>crypto.createHash('sha256').update(b).digest('hex');
          const OPT=v=>({viewport:{width:v.w,height:v.h},deviceScaleFactor:1,colorScheme:'light',reducedMotion:'reduce',locale:'en-US',timezoneId:'UTC'});
          fs.mkdirSync(path.join(OUT,'pixel-evidence'),{recursive:true});

          function pdiff(a,b){
            const A=PNG.sync.read(a),B=PNG.sync.read(b);if(A.width!==B.width||A.height!==B.height)throw Error('png size');
            let n=0,m=0,minX=A.width,minY=A.height,maxX=-1,maxY=-1;const mask=new PNG({width:A.width,height:A.height}),heat=new PNG({width:A.width,height:A.height}),pairs=new Map();
            for(let y=0;y<A.height;y++)for(let x=0;x<A.width;x++){let i=(y*A.width+x)*4,hit=false;for(let c=0;c<4;c++){let d=Math.abs(A.data[i+c]-B.data[i+c]);if(d){hit=true;m=Math.max(m,d)}}if(hit){n++;minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);mask.data[i]=mask.data[i+1]=mask.data[i+2]=mask.data[i+3]=255;heat.data[i]=255;heat.data[i+3]=255;let k=[...A.data.slice(i,i+4)].join(',')+' -> '+[...B.data.slice(i,i+4)].join(',');pairs.set(k,(pairs.get(k)||0)+1)}else{mask.data[i+3]=255;heat.data[i+3]=70}}
            return{diffPixels:n,maxChannelDelta:m,diffRatio:n/(A.width*A.height),boundingBox:n?{minX,minY,maxX,maxY,width:maxX-minX+1,height:maxY-minY+1}:null,pixelIdentical:n===0,A,B,mask:PNG.sync.write(mask),heat:PNG.sync.write(heat),pairs:[...pairs.entries()].sort((a,b)=>b[1]-a[1]).slice(0,30).map(([pair,count])=>({pair,count}))}
          }
          function crop(P,b){if(!b)return null;let q=8,x=Math.max(0,b.minX-q),y=Math.max(0,b.minY-q),w=Math.min(P.width-x,b.width+2*q),h=Math.min(P.height-y,b.height+2*q),C=new PNG({width:w,height:h});PNG.bitblt(P,C,x,y,w,h,0,0);return PNG.sync.write(C)}
          function save(k,a,b,d){if(d.pixelIdentical)return;const q=path.join(OUT,'pixel-evidence');fs.writeFileSync(path.join(q,k+'-m4.png'),a);fs.writeFileSync(path.join(q,k+'-m5.png'),b);fs.writeFileSync(path.join(q,k+'-mask.png'),d.mask);fs.writeFileSync(path.join(q,k+'-heatmap.png'),d.heat);let x=crop(d.A,d.boundingBox),y=crop(d.B,d.boundingBox),z=crop(PNG.sync.read(d.heat),d.boundingBox);if(x)fs.writeFileSync(path.join(q,k+'-m4-crop.png'),x);if(y)fs.writeFileSync(path.join(q,k+'-m5-crop.png'),y);if(z)fs.writeFileSync(path.join(q,k+'-diff-crop.png'),z)}
          const selector=e=>e?e.tagName.toLowerCase()+(e.id?'#'+e.id:'')+(typeof e.className==='string'&&e.className.trim()?'.'+e.className.trim().split(/\s+/).slice(0,4).join('.'):''):null;

          async function addAudit(ctx){
            await ctx.addInitScript(()=>{
              window.__strictAudit={mutations:[],layoutShifts:[],pending:0,req:0,finished:0,failed:0};
              const mo=new MutationObserver(list=>{for(const m of list)window.__strictAudit.mutations.push({type:m.type,target:m.target?.nodeName,attr:m.attributeName||null,added:m.addedNodes?.length||0,removed:m.removedNodes?.length||0,t:performance.now()})});
              document.addEventListener('DOMContentLoaded',()=>mo.observe(document.documentElement,{subtree:true,childList:true,attributes:true,characterData:true}),{once:true});
              try{new PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput)window.__strictAudit.layoutShifts.push({value:e.value,startTime:e.startTime})}).observe({type:'layout-shift',buffered:true})}catch{}
            });
          }
          async function routeSafe(ctx,origin,net){
            await ctx.route('**/*',async route=>{
              const req=route.request(),m=req.method().toUpperCase(),url=req.url();let u;try{u=new URL(url)}catch{return route.abort('blockedbyclient')}
              const ro=/google\.firestore\.v1\.Firestore\/Listen\/channel/i.test(url)||/firestore\.googleapis\.com\/.*:(runQuery|batchGet)(\?|$)/i.test(url);
              const telemetry=/google-analytics\.com|googletagmanager\.com|google\.com\/g\/collect/.test(url);
              if(telemetry){net.blockedTelemetry++;return route.abort('blockedbyclient')}
              if(['GET','HEAD','OPTIONS'].includes(m)){net.allowedGets++;return route.continue()}
              if(ro){net.blockedReadOnly++;return route.abort('blockedbyclient')}
              net.blockedUnsafe.push({method:m,url});return route.abort('blockedbyclient');
            });
          }
          async function canonicalNormalize(page,v){
            await page.evaluate(async()=>{
              try{await document.fonts.ready}catch{}
              const imgs=[...document.images];
              await Promise.all(imgs.map(i=>i.complete?Promise.resolve():new Promise(r=>{let done=()=>r();i.addEventListener('load',done,{once:true});i.addEventListener('error',done,{once:true});setTimeout(done,2500)})));
              await Promise.all(imgs.map(async i=>{try{if(i.complete&&i.naturalWidth)await i.decode()}catch{}}));
              for(const x of document.querySelectorAll('video')){try{x.pause();x.currentTime=0}catch{}}
              scrollTo(0,0);try{document.activeElement?.blur?.()}catch{};try{getSelection()?.removeAllRanges()}catch{}
            });
            await page.mouse.move(v.w-2,v.h-2);
            await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;caret-color:transparent!important}video{visibility:hidden!important}#splash-screen{display:none!important;opacity:0!important;visibility:hidden!important}'});
            await page.evaluate(()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))));
            let quiet=false,detail=null;
            for(let i=0;i<6&&!quiet;i++){
              detail=await page.evaluate(async()=>{
                const a=window.__strictAudit;const m0=a.mutations.length,l0=a.layoutShifts.length;
                const g0={h:document.documentElement.scrollHeight,w:document.documentElement.scrollWidth,bh:document.body.scrollHeight,bw:document.body.scrollWidth};
                await new Promise(r=>setTimeout(r,300));
                const g1={h:document.documentElement.scrollHeight,w:document.documentElement.scrollWidth,bh:document.body.scrollHeight,bw:document.body.scrollWidth};
                return{mutationDelta:a.mutations.length-m0,layoutShiftDelta:a.layoutShifts.length-l0,geometryStable:JSON.stringify(g0)===JSON.stringify(g1),g0,g1};
              });
              quiet=detail.mutationDelta===0&&detail.layoutShiftDelta===0&&detail.geometryStable;
            }
            if(!quiet)throw new Error('canonical state did not reach quiet window '+JSON.stringify(detail));
            return detail;
          }
          async function legacyNormalize(page,v){
            await page.evaluate(async()=>{try{await document.fonts?.ready}catch{};await Promise.all([...document.images].map(i=>i.complete?Promise.resolve():new Promise(r=>{let d=()=>r();i.addEventListener('load',d,{once:true});i.addEventListener('error',d,{once:true});setTimeout(d,1500)})));for(const x of document.querySelectorAll('video')){try{x.pause();x.currentTime=0}catch{}}scrollTo(0,0)});
            await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;caret-color:transparent!important}video{visibility:hidden!important}#splash-screen{display:none!important;opacity:0!important;visibility:hidden!important}'});
            await page.evaluate(()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))));await page.waitForTimeout(80);
            return{legacy:true};
          }
          async function fingerprint(page){
            return await page.evaluate(()=>{
              const R=r=>({x:+r.x.toFixed(2),y:+r.y.toFixed(2),width:+r.width.toFixed(2),height:+r.height.toFixed(2),top:+r.top.toFixed(2),right:+r.right.toFixed(2),bottom:+r.bottom.toFixed(2),left:+r.left.toFixed(2)});
              const Q=e=>e?e.tagName.toLowerCase()+(e.id?'#'+e.id:'')+(typeof e.className==='string'&&e.className.trim()?'.'+e.className.trim().split(/\s+/).slice(0,4).join('.'):''):null;
              const S=e=>{let s=getComputedStyle(e);return{display:s.display,visibility:s.visibility,opacity:s.opacity,position:s.position,zIndex:s.zIndex,transform:s.transform,filter:s.filter,background:s.background,backgroundImage:s.backgroundImage,border:s.border,boxShadow:s.boxShadow,fontFamily:s.fontFamily,fontSize:s.fontSize,fontWeight:s.fontWeight,fontStyle:s.fontStyle,fontFeatureSettings:s.fontFeatureSettings,fontVariationSettings:s.fontVariationSettings,letterSpacing:s.letterSpacing,lineHeight:s.lineHeight,objectFit:s.objectFit,objectPosition:s.objectPosition,overflowX:s.overflowX,overflowY:s.overflowY}};
              const visible=[...document.querySelectorAll('*')].map(e=>{let r=e.getBoundingClientRect(),s=getComputedStyle(e);if(r.width<=0||r.height<=0||s.visibility==='hidden'||s.display==='none')return null;let b=getComputedStyle(e,'::before'),a=getComputedStyle(e,'::after');return{selector:Q(e),rect:R(r),style:S(e),text:(e.textContent||'').trim().replace(/\s+/g,' ').slice(0,80),before:{content:b.content,display:b.display,position:b.position,opacity:b.opacity,transform:b.transform,background:b.background,border:b.border,boxShadow:b.boxShadow,filter:b.filter},after:{content:a.content,display:a.display,position:a.position,opacity:a.opacity,transform:a.transform,background:a.background,border:a.border,boxShadow:a.boxShadow,filter:a.filter}}}).filter(Boolean);
              return{
                htmlClass:document.documentElement.className,bodyClass:document.body.className,lang:document.documentElement.lang,dir:document.documentElement.dir||getComputedStyle(document.documentElement).direction,
                scrollX,scrollY,innerWidth,innerHeight,devicePixelRatio,clientWidth:document.documentElement.clientWidth,scrollbarWidth:innerWidth-document.documentElement.clientWidth,
                scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight,bodyScrollWidth:document.body.scrollWidth,bodyScrollHeight:document.body.scrollHeight,
                active:Q(document.activeElement),selectionLength:(getSelection()?.toString()||'').length,
                fixedSticky:visible.filter(x=>x.style.position==='fixed'||x.style.position==='sticky'),
                images:[...document.images].map(i=>({src:i.src,currentSrc:i.currentSrc,complete:i.complete,naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight,rect:R(i.getBoundingClientRect()),style:S(i)})),
                videos:[...document.querySelectorAll('video')].map(v=>({currentTime:v.currentTime,paused:v.paused,readyState:v.readyState,rect:R(v.getBoundingClientRect()),visibility:getComputedStyle(v).visibility})),
                canvases:[...document.querySelectorAll('canvas')].map(c=>({width:c.width,height:c.height,rect:R(c.getBoundingClientRect())})),
                iframes:[...document.querySelectorAll('iframe')].map(f=>({src:f.src,rect:R(f.getBoundingClientRect())})),
                resources:performance.getEntriesByType('resource').map(e=>({name:e.name.replace(location.origin,'ORIGIN'),type:e.initiatorType,transferSize:e.transferSize,encodedBodySize:e.encodedBodySize})).sort((a,b)=>a.name.localeCompare(b.name)),
                fontStatus:document.fonts.status,
                fontChecks:{manrope400:document.fonts.check('400 16px Manrope'),manrope700:document.fonts.check('700 16px Manrope'),plex400:document.fonts.check('400 16px "IBM Plex Sans Arabic"'),plex700:document.fonts.check('700 16px "IBM Plex Sans Arabic"')},
                keyFonts:[...document.querySelectorAll('h1,h2,h3,p,a,button')].filter(e=>{let r=e.getBoundingClientRect();return r.width>0&&r.height>0}).slice(0,100).map(e=>({selector:Q(e),text:(e.textContent||'').trim().replace(/\s+/g,' ').slice(0,60),font:S(e)})),
                visible
              };
            });
          }
          async function capture(browser,vn,v,label,{canonical=true,fullPage=true,mode='normal',sameContext=null}={}){
            const origin=O[vn],net={allowedGets:0,blockedReadOnly:0,blockedTelemetry:0,blockedUnsafe:[]};
