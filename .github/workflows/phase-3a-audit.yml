name: Phase 3A Source Inventory Audit
on:
  push:
    branches: ["basair/phase-3a-css-consolidation-plan"]
    paths: [".github/workflows/phase-3a-audit.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact Phase-2 CSS ownership graph
        shell: bash
        run: |
          set -euo pipefail
          BASE=1504baad33b2123056877c1e92f4e2d558c00d51
          TREE=1d987040d0158387d0425d6e6ed00fe2a68ec617
          test "$(git rev-parse "$BASE")" = "$BASE"
          test "$(git rev-parse "$BASE^{tree}")" = "$TREE"
          test -z "$(git status --porcelain)"
          rm -rf /tmp/prod
          git worktree add --detach /tmp/prod "$BASE" >/dev/null
          test "$(git -C /tmp/prod rev-parse HEAD)" = "$BASE"
          test "$(git -C /tmp/prod rev-parse HEAD^{tree})" = "$TREE"
          test -z "$(git -C /tmp/prod status --porcelain)"
          echo "BASE_PROOF HEAD=$BASE TREE=$TREE CLEAN=YES"
          cat >/tmp/audit.py <<'PY'
          import os,re,json,hashlib,subprocess,collections
          from pathlib import Path
          ROOT=Path('/tmp/prod')
          BASE='1504baad33b2123056877c1e92f4e2d558c00d51'
          TREE='1d987040d0158387d0425d6e6ed00fe2a68ec617'
          EXCLUDE={'.git','node_modules','dist'}
          def files(ext):
              out=[]
              for p in ROOT.rglob('*'):
                  if not p.is_file() or any(x in EXCLUDE for x in p.parts): continue
                  if p.suffix.lower()==ext: out.append(p.relative_to(ROOT).as_posix())
              return sorted(out)
          htmls=files('.html'); css_all=files('.css'); js_all=files('.js')+files('.mjs')
          def read(rel): return (ROOT/rel).read_text('utf-8',errors='replace')
          def strip_comments(s): return re.sub(r'/\*[\s\S]*?\*/','',s)
          def resolve_css(from_rel,href):
              href=href.split('?')[0].split('#')[0].strip()
              if not href or href.startswith(('http://','https://','//','data:')): return None
              base=Path('/') if href.startswith('/') else Path(from_rel).parent
              p=(base / href.lstrip('/')).as_posix()
              p=os.path.normpath(p).replace('\\','/').lstrip('./')
              return p if p in css_all else None
          link_re=re.compile(r'<link\b[^>]*>',re.I)
          def attrs(tag):
              return {m.group(1).lower():m.group(3) for m in re.finditer(r'([\w:-]+)\s*=\s*(["\'])(.*?)\2',tag,re.S)}
          imp_re=re.compile(r'@import\s+(?:url\()?\s*["\']([^"\']+)["\']',re.I)
          direct_links={}
          for h in htmls:
              ls=[]
              for tag in link_re.findall(read(h)):
                  a=attrs(tag); rel=a.get('rel','').lower().split(); href=a.get('href')
                  if 'stylesheet' in rel and href:
                      c=resolve_css(h,href)
                      if c: ls.append(c)
              direct_links[h]=ls
          imports={c:[] for c in css_all}
          for c in css_all:
              for href in imp_re.findall(read(c)):
                  x=resolve_css(c,href)
                  if x: imports[c].append(x)
          reachable_by_entry={}
          occurrences_by_entry={}
          for h,links in direct_links.items():
              seen=set(); occ=[]
              def visit(c,via):
                  occ.append({'file':c,'via':via})
                  if c in seen: return
                  seen.add(c)
                  for x in imports.get(c,[]): visit(x,c)
              for c in links: visit(c,h)
              reachable_by_entry[h]=seen; occurrences_by_entry[h]=occ
          prod_css=sorted(set().union(*reachable_by_entry.values()))
          # surface is based on actual entry graph, not filename.
          entry_surface={}
          for h in htmls:
              if h=='admin.html': s='ADMIN'
              elif 'acquisition.css' in reachable_by_entry[h]: s='ACQUISITION'
              else: s='PUBLIC'
              entry_surface[h]=s
          importers=collections.defaultdict(list)
          for owner,xs in imports.items():
              for x in xs: importers[x].append(owner)
          for h,xs in direct_links.items():
              for x in xs: importers[x].append('HTML:'+h)
          # CSS structural scanner.
          def split_commas(s):
              out=[]; start=0; depth=0; quote=None; esc=False
              for i,ch in enumerate(s):
                  if esc: esc=False; continue
                  if ch=='\\': esc=True; continue
                  if quote:
                      if ch==quote: quote=None
                      continue
                  if ch in "'\"": quote=ch; continue
                  if ch in '([': depth+=1
                  elif ch in ')]': depth=max(0,depth-1)
                  elif ch==',' and depth==0: out.append(s[start:i].strip()); start=i+1
              out.append(s[start:].strip()); return [x for x in out if x]
          def css_rules(text):
              s=strip_comments(text); stack=[]; rules=[]; i=0; start=0
              quote=None; esc=False
              while i<len(s):
                  ch=s[i]
                  if esc: esc=False; i+=1; continue
                  if ch=='\\': esc=True; i+=1; continue
                  if quote:
                      if ch==quote: quote=None
                      i+=1; continue
                  if ch in "'\"": quote=ch; i+=1; continue
                  if ch=='{':
                      pre=s[start:i].strip(); stack.append((pre,i+1)); start=i+1
                  elif ch=='}' and stack:
                      pre,body_start=stack.pop(); body=s[body_start:i]
                      if pre and not pre.startswith('@'):
                          media=[p for p,_ in stack if p.startswith('@media')]
                          rules.append((pre,body,media))
                      start=i+1
                  i+=1
              return rules
          decl_re=re.compile(r'(?<![-\w])([\w-]+|--[A-Za-z0-9_-]+)\s*:\s*([^;{}]+)')
          var_re=re.compile(r'var\(\s*(--[A-Za-z0-9_-]+)')
          media_re=re.compile(r'@media\s*([^\{]+)\{',re.I)
          class_re=re.compile(r'\.([A-Za-z_-][A-Za-z0-9_-]*)')
          id_re=re.compile(r'#([A-Za-z_-][A-Za-z0-9_-]*)')
          file_stats={}
          triples=collections.defaultdict(set)
          block_hashes=collections.defaultdict(list)
          for c in prod_css:
              txt=read(c); rs=css_rules(txt); sels=[]; anchors=collections.Counter(); decl_custom=[]; cons=[]
              for pre,body,media in rs:
                  parts=split_commas(pre); sels.extend(parts)
                  for sel in parts:
                      for a in class_re.findall(sel): anchors['.'+a]+=1
                      for a in id_re.findall(sel): anchors['#'+a]+=1
                  ds=[(m.group(1),re.sub(r'\s+',' ',m.group(2).strip())) for m in decl_re.finditer(body)]
                  norm=';'.join(sorted(f'{k.lower()}:{v.lower()}' for k,v in ds))
                  if norm: block_hashes[hashlib.sha1(norm.encode()).hexdigest()].append({'file':c,'selectors':parts,'declarations':ds})
                  for sel in parts:
                      for k,v in ds: triples[(sel,k.lower(),v.lower())].add(c)
              decl_custom=[m.group(1) for m in re.finditer(r'(--[A-Za-z0-9_-]+)\s*:',strip_comments(txt))]
              cons=var_re.findall(strip_comments(txt))
              surfaces=sorted({entry_surface[h] for h in htmls if c in reachable_by_entry[h]})
              owners=sorted(h for h in htmls if c in reachable_by_entry[h])
              # Component signals from actual selectors.
              selector_text=' '.join(sels).lower(); comps=[]
              signals=[('TOKEN_AUTHORITY',':root'),('FORM',['.form','.field','input','textarea','select']),('HERO',['.hero']),('NAVIGATION',['.nav','.topbar','.site-header','.mobile-menu','.drawer']),('COURSE_CARD',['.course','.dossier','.track-card','.pathway']),('TRACK_CTA',['track-cta','track-btn','.track-button']),('VIDEO',['.video']),('TESTIMONIAL',['.testimonial']),('WELCOME',['.welcome','.splash']),('ADMIN_PANEL',['.admin','.auth-shell','.request','.dashboard']),('FAQ',['.faq','details'])]
              for name,need in signals:
                  needles=[need] if isinstance(need,str) else need
                  if any(n in selector_text for n in needles): comps.append(name)
              if not comps: comps=['GENERAL_'+('_'.join(surfaces) if surfaces else 'UNKNOWN')]
              mqs=[re.sub(r'\s+',' ',x.strip()) for x in media_re.findall(strip_comments(txt))]
              file_stats[c]={
                  'path':c,'bytes':len(txt.encode()),'surfaces':surfaces,'entryOwners':owners,
                  'importers':sorted(importers.get(c,[])),'imports':imports.get(c,[]),
                  'selectorCount':len(sels),'customPropertiesDeclaredCount':len(decl_custom),
                  'customPropertiesDeclared':sorted(set(decl_custom)),'customPropertiesConsumed':sorted(set(cons)),
                  'mediaQueryCount':len(mqs),'mediaQueries':mqs,'componentOwnershipSignals':comps,
                  'topSelectorAnchors':anchors.most_common(8),'participatesMultipleSurfaces':len(surfaces)>1,
                  'removalWouldAlterCascadeOrder': bool(sels or decl_custom or imports.get(c,[]))
              }
          # duplicate clusters: same selector/property/value appears in >=2 files.
          dup_triples=[{'selector':k[0],'property':k[1],'value':k[2],'files':sorted(v)} for k,v in triples.items() if len(v)>=2]
          dup_blocks=[{'hash':h,'occurrences':[{'file':x['file'],'selectors':x['selectors']} for x in xs],'declarationCount':len(xs[0]['declarations'])} for h,xs in block_hashes.items() if len({x['file'] for x in xs})>=2]
          # token static evidence from exact source.
          review=['--course-btn-glow','--course-btn-press','--layout-section-compact','--mobile-drawer-hidden-x']
          unobs=['--dossier-accent','--dossier-border','--fo-bg','--fo-border','--fo-border-strong','--fo-danger-bg','--fo-muted','--fo-shadow','--fo-success-bg','--fo-surface','--fo-surface-strong','--fo-text','--folio-opacity']
          all_src=sorted(set(prod_css+htmls+js_all))
          def token_evidence(tok):
              decl=[]; consume=[]; textual=[]
              for f in all_src:
                  t=read(f)
                  for i,line in enumerate(t.splitlines(),1):
                      if tok not in line: continue
                      rec={'file':f,'line':i,'text':line.strip()[:260]}
                      textual.append(rec)
                      if re.search(re.escape(tok)+r'\s*:',line): decl.append(rec)
                      if re.search(r'var\(\s*'+re.escape(tok),line): consume.append(rec)
              css_files=sorted(set(x['file'] for x in decl+consume if x['file'].endswith('.css')))
              surfaces=sorted(set(s for f in css_files for s in file_stats.get(f,{}).get('surfaces',[])))
              state_words=[]
              for r in consume+decl:
                  q=r['text'].lower()
                  for w in [':hover',':focus',':active','::before','::after','@media','.is-','.active','.open','.hidden','.reveal']:
                      if w in q: state_words.append(w)
              js_hits=[x for x in textual if x['file'].endswith(('.js','.mjs'))]
              html_hits=[x for x in textual if x['file'].endswith('.html')]
              return {'token':tok,'declarations':decl,'consumers':consume,'allOccurrences':textual,'surfaces':surfaces,'stateOrPseudoSignals':sorted(set(state_words)),'javascriptOccurrences':js_hits,'htmlOccurrences':html_hits}
          token_details={t:token_evidence(t) for t in review+unobs}
          # contextual list from reconciled 2.5A evidence.
          contextual=['--acq-layout-gutter','--acq-layout-section','--acq-type-display','--acq-type-section','--admin-type-body','--admin-type-panel','--admin-type-support','--admin-type-title','--home-journey-section','--layout-gutter','--layout-section','--line','--muted','--pathway-accent','--pathway-accent-ink','--pathway-summary-bg','--pathway-summary-ink','--pathway-summary-line','--pathway-summary-muted','--type-body','--type-display','--type-section','--type-subsection']
          # Adjacent HTML-linked sheets and exact duplicate-block evidence for candidate generation.
          adjacency=collections.Counter()
          for h,ls in direct_links.items():
              for a,b in zip(ls,ls[1:]): adjacency[(a,b)]+=1
          adjacency_rows=[{'a':a,'b':b,'entryCount':n,'entries':[h for h,ls in direct_links.items() if any(x==a and y==b for x,y in zip(ls,ls[1:]))]} for (a,b),n in adjacency.items()]
          # token/canonical ownership dependency summary
          token_dep={c:{'declaresCanonical':any(x.startswith('--color-') or x.startswith('--font-') or x.startswith('--layout-') or x.startswith('--space-') or x.startswith('--motion-') or x.startswith('--radius-') or x.startswith('--shadow-') or x.startswith('--measure-') for x in st['customPropertiesDeclared']),'consumesCanonicalLike':[x for x in st['customPropertiesConsumed'] if x.startswith(('--color-','--font-','--layout-','--space-','--motion-','--radius-','--shadow-','--measure-'))]} for c,st in file_stats.items()}
          # Search exact rule-local duplicate declarations (same property/value repeated in same rule).
          local_exact=[]
          for c in prod_css:
              for pre,body,media in css_rules(read(c)):
                  seen=collections.Counter((m.group(1).lower(),re.sub(r'\s+',' ',m.group(2).strip()).lower()) for m in decl_re.finditer(body))
                  for (p,v),n in seen.items():
                      if n>1: local_exact.append({'file':c,'selector':pre.strip(),'property':p,'value':v,'count':n,'media':media})
          report={
              'base':{'commit':BASE,'tree':TREE,'workingTreeClean':True},
              'counts':{'productionHtmlEntries':len(htmls),'allCssFiles':len(css_all),'productionCssFiles':len(prod_css),'totalProductionCssBytes':sum(file_stats[c]['bytes'] for c in prod_css),'selectorCount':sum(file_stats[c]['selectorCount'] for c in prod_css),'customPropertyDeclarationCount':sum(file_stats[c]['customPropertiesDeclaredCount'] for c in prod_css),'duplicateSelectorPropertyValueClusters':len(dup_triples),'duplicateExactDeclarationBlockClustersAcrossFiles':len(dup_blocks),'localExactDuplicateDeclarations':len(local_exact)},
              'entries':[{'path':h,'surface':entry_surface[h],'directStylesheets':direct_links[h],'reachableCssCount':len(reachable_by_entry[h]),'logicalLoadOccurrences':occurrences_by_entry[h]} for h in htmls],
              'productionCssInventory':[file_stats[c] for c in prod_css],
              'imports':{c:imports[c] for c in prod_css if imports[c]},
              'duplicateSelectorPropertyValueClusters':dup_triples,
              'duplicateExactDeclarationBlockClustersAcrossFiles':dup_blocks,
              'localExactDuplicateDeclarations':local_exact,
              'reviewCandidateTokens':{t:token_details[t] for t in review},
              'unobservedTokens':{t:token_details[t] for t in unobs},
              'contextualTokens':contextual,
              'adjacentDirectStylesheetPairs':adjacency_rows,
              'tokenDependencySummary':token_dep
          }
          Path('/tmp/phase3a-source-audit.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print('AUDIT_SUMMARY',json.dumps(report['counts']))
          print('HTML_ENTRIES',json.dumps(report['entries'],indent=2))
          print('CSS_INVENTORY',json.dumps(report['productionCssInventory'],indent=2))
          print('REVIEW_TOKENS',json.dumps(report['reviewCandidateTokens'],indent=2))
          print('UNOBSERVED_TOKENS',json.dumps(report['unobservedTokens'],indent=2))
          print('LOCAL_EXACT_DUPES',json.dumps(report['localExactDuplicateDeclarations'],indent=2))
          print('DUP_BLOCKS_TOP',json.dumps(report['duplicateExactDeclarationBlockClustersAcrossFiles'][:80],indent=2))
          print('ADJACENCY',json.dumps(report['adjacentDirectStylesheetPairs'],indent=2))
          PY
          python3 /tmp/audit.py
          git -C /tmp/prod diff --check
          test -z "$(git -C /tmp/prod status --porcelain)"
          echo "PRODUCTION_CHECKOUT_UNCHANGED=YES"
