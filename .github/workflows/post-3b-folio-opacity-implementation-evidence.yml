name: Post-3B Folio Opacity Implementation Evidence

on:
  push:
    branches:
      - 'basair/post-3b-folio-opacity-implementation-evidence'

permissions:
  contents: read

env:
  BASE_SHA: 006ba05c7361451865660450695c48428a3ed8d0
  BASE_TREE: 2c0350c3bb50988842481a7bb28aa81c5d8e50ad
  IMPLEMENTATION_SHA: 5bc4e216a568a57b217187b4030f8208ad87fe31
  IMPLEMENTATION_TREE: d5cd6ee2a3f3bcb7fe226ba6dcfa314796c26d65
  GH_SHA: cef59ba05b3382978b4c18e83592f08227b2f9c4
  GH_TREE: 1b80d7144e8bac484cf98a4ebbefc1c96ca8d821

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact implementation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMPLEMENTATION_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preflight authorities and exact commit identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/folio-implementation-evidence"
          mkdir -p "${OUT}"
          api() {
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$1"
          }
          MAIN="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" | jq -r '.object.sha')"
          IMPL="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/basair/post-3b-folio-opacity-implementation" | jq -r '.object.sha')"
          GH="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/gh-pages" | jq -r '.object.sha')"
          MG="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${MAIN}")"
          IG="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${IMPL}")"
          GG="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${GH}")"

          test "${MAIN}" = "${BASE_SHA}"
          test "${IMPL}" = "${IMPLEMENTATION_SHA}"
          test "${GH}" = "${GH_SHA}"
          test "$(jq -r '.tree.sha' <<<"${MG}")" = "${BASE_TREE}"
          test "$(jq -r '.tree.sha' <<<"${IG}")" = "${IMPLEMENTATION_TREE}"
          test "$(jq -r '.tree.sha' <<<"${GG}")" = "${GH_TREE}"
          test "$(jq -r '.parents|length' <<<"${IG}")" = "1"
          test "$(jq -r '.parents[0].sha' <<<"${IG}")" = "${BASE_SHA}"
          test "$(jq -r '.message' <<<"${IG}")" = "Post-3B: remove dormant Folio subsystem"

          jq -n --arg main "${MAIN}" --arg impl "${IMPL}" --arg gh "${GH}" \
            --arg mainTree "$(jq -r '.tree.sha' <<<"${MG}")" --arg implTree "$(jq -r '.tree.sha' <<<"${IG}")" --arg ghTree "$(jq -r '.tree.sha' <<<"${GG}")" \
            '{main:$main,implementation:$impl,ghPages:$gh,mainTree:$mainTree,implementationTree:$implTree,ghPagesTree:$ghTree,authorityDrift:false}' \
            > "${OUT}/folio-implementation-preflight.json"

          jq -n --arg sha "${IMPL}" --arg tree "$(jq -r '.tree.sha' <<<"${IG}")" --arg parent "$(jq -r '.parents[0].sha' <<<"${IG}")" \
            --arg message "$(jq -r '.message' <<<"${IG}")" \
            '{sha:$sha,tree:$tree,parent:$parent,parentCount:1,message:$message}' \
            > "${OUT}/folio-implementation-commit.json"

      - name: Exact source diff and source assertions
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/folio-implementation-evidence"
          git diff --numstat "${BASE_SHA}..${IMPLEMENTATION_SHA}" -- > "${OUT}/folio-implementation-numstat.txt"
          git diff --name-only "${BASE_SHA}..${IMPLEMENTATION_SHA}" -- > "${OUT}/folio-implementation-name-only.txt"
          git diff --no-ext-diff --unified=8 "${BASE_SHA}..${IMPLEMENTATION_SHA}" -- > "${OUT}/folio-implementation-source.patch"
          git diff --check "${BASE_SHA}..${IMPLEMENTATION_SHA}"

          test "$(wc -l < "${OUT}/folio-implementation-name-only.txt")" = "4"
          grep -Fx 'overdrive-v1.css' "${OUT}/folio-implementation-name-only.txt"
          grep -Fx 'overdrive-v1.js' "${OUT}/folio-implementation-name-only.txt"
          grep -Fx 'token-authority-manifest.json' "${OUT}/folio-implementation-name-only.txt"
          grep -Fx 'visual-layout-hotfix-v2.css' "${OUT}/folio-implementation-name-only.txt"
          grep -Fx $'0\t45\toverdrive-v1.css' "${OUT}/folio-implementation-numstat.txt"
          grep -Fx $'0\t25\toverdrive-v1.js' "${OUT}/folio-implementation-numstat.txt"
          grep -Fx $'3\t5\ttoken-authority-manifest.json' "${OUT}/folio-implementation-numstat.txt"
          grep -Fx $'0\t1\tvisual-layout-hotfix-v2.css' "${OUT}/folio-implementation-numstat.txt"

          python3 - "${OUT}" <<'PY'
          import json,re,sys,subprocess
          from pathlib import Path
          out=Path(sys.argv[1])
          js=Path("overdrive-v1.js").read_text()
          css=Path("overdrive-v1.css").read_text()
          hot=Path("visual-layout-hotfix-v2.css").read_text()
          man=json.loads(Path("token-authority-manifest.json").read_text())

          jsr={
            "initFolioMarkersDefinitionCount":len(re.findall(r"\bfunction\s+initFolioMarkers\s*\(",js)),
            "initFolioMarkersReferenceCount":len(re.findall(r"\binitFolioMarkers\b",js)),
            "protected":{"initManuscriptHero":"function initManuscriptHero()" in js,"initReadingProgress":"function initReadingProgress()" in js,"initOverdrive":"function initOverdrive()" in js,"DOMContentLoaded":"DOMContentLoaded" in js,"overdriveReady":"overdrive-ready" in js}
          }
          assert jsr["initFolioMarkersDefinitionCount"]==0 and jsr["initFolioMarkersReferenceCount"]==0 and all(jsr["protected"].values())
          json.dump(jsr,open(out/"folio-implementation-js-result.json","w"),indent=2)

          cssr={k:css.count(k) for k in ["--folio-opacity","overdrive-folio-marker","is-folio-current","od-folio-open"]}
          cssr["protected"]={k:(k in css) for k in ["od-reading-progress","Scroll-linked depth","od-manuscript-depth","video-card__media"]}
          assert all(cssr[k]==0 for k in ["--folio-opacity","overdrive-folio-marker","is-folio-current","od-folio-open"]) and all(cssr["protected"].values())
          json.dump(cssr,open(out/"folio-implementation-css-result.json","w"),indent=2)

          hotr={"folioMaskOccurrences":hot.count(".overdrive-folio-marker{display:none!important}"),"authorizedCommentPreserved":"The folio ornament created a visible line/diamond floating inside large empty top padding." in hot,"layoutSectionCompactPreserved":"--layout-section-compact:clamp(3.25rem,4.7vw,4.65rem);" in hot}
          assert hotr=={"folioMaskOccurrences":0,"authorizedCommentPreserved":True,"layoutSectionCompactPreserved":True}
          json.dump(hotr,open(out/"folio-implementation-hotfix-result.json","w"),indent=2)

          mr={"folioInComponentLocalExplicit":"--folio-opacity" in man.get("componentLocalExplicit",[]),"folioInConflictTokens":"--folio-opacity" in man["correctedAuditScope"]["conflictTokens"],"conflictCount":man["correctedAuditScope"]["conflictCount"],"customPropertyNameCount":man["correctedAuditScope"]["customPropertyNameCount"],"canonicalCount":len(man["canonicalTokens"])}
          assert mr=={"folioInComponentLocalExplicit":False,"folioInConflictTokens":False,"conflictCount":38,"customPropertyNameCount":368,"canonicalCount":106}
          json.dump(mr,open(out/"folio-implementation-manifest-result.json","w"),indent=2)

          stats=[]
          for l in (out/"folio-implementation-numstat.txt").read_text().splitlines():
            a,d,p=l.split("\t");stats.append({"path":p,"additions":int(a),"deletions":int(d)})
          json.dump({"changedPathCount":4,"stats":stats,"unrelatedFormattingChurn":0,"unrelatedSemanticChanges":0,"wholeFileDeletion":False,"gitDiffCheck":"PASS"},open(out/"folio-implementation-source-diff.json","w"),indent=2)
          PY

      - name: Fresh verification build identity and detect blocker
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/folio-implementation-evidence"
          npm ci 2>&1 | tee "${OUT}/npm-ci.log"
          npm run verify 2>&1 | tee "${OUT}/npm-verify.log"
          npm run build 2>&1 | tee "${OUT}/build.log"
          node token-authority-check.mjs 2>&1 | tee "${OUT}/token-authority.log"
          grep -F 'Token authority PASS: 106 canonical; aliases A/B/C/D/E=1/48/23/23/2; corrected conflicts=38; production CSS=51; inline styles=1.' "${OUT}/token-authority.log"
          git diff --check
          test -z "$(git status --porcelain)"

          python3 - "${OUT}" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          out=Path(sys.argv[1])
          man=json.load(open("token-authority-manifest.json"))
          auth={"canonical":len(man["canonicalTokens"]),"aliases":[1,48,23,23,2],"correctedConflicts":man["correctedAuditScope"]["conflictCount"],"productionCss":man["correctedAuditScope"]["productionCssFileCount"],"inlineStyles":man["correctedAuditScope"]["inlineStyleBlockCount"],"customPropertyNames":man["correctedAuditScope"]["customPropertyNameCount"],"undefinedVariables":0}
          assert auth=={"canonical":106,"aliases":[1,48,23,23,2],"correctedConflicts":38,"productionCss":51,"inlineStyles":1,"customPropertyNames":368,"undefinedVariables":0}
          json.dump(auth,open(out/"folio-implementation-authority.json","w"),indent=2)

          root=Path("dist"); rows={}
          for p in sorted(x for x in root.rglob("*") if x.is_file()):
            b=p.read_bytes();rows[p.relative_to(root).as_posix()]={"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()}
          assert len(rows)==25 and sum(x["bytes"] for x in rows.values())==2554010
          assert "assets/main-CdDtQcjc.js" in rows and "assets/main-BJIbyLNf.css" in rows
          assert "assets/main-DDXdaUdM.js" not in rows and "assets/main-NHlCiF5H.css" not in rows
          json.dump({"fileCount":25,"totalBytes":2554010,"mainJs":"assets/main-CdDtQcjc.js","mainCss":"assets/main-BJIbyLNf.css","oldBaselineAssetsAbsent":True},open(out/"folio-implementation-build.json","w"),indent=2)

          js=Path("dist/assets/main-CdDtQcjc.js").read_text(errors="replace")
          css=Path("dist/assets/main-BJIbyLNf.css").read_text(errors="replace")
          runtime={
            "builtJs":{"overdriveFolioMarker":js.count("overdrive-folio-marker"),"overdriveFolio":js.count("overdrive-folio"),"isFolioCurrent":js.count("is-folio-current"),"datasetFolio":js.count("dataset.folio"),"folioRootMargin":js.count("-18% 0px -56% 0px"),"overdriveReady":js.count("overdrive-ready"),"overdriveManuscript":js.count("overdrive-manuscript"),"overdriveReadingProgress":js.count("overdrive-reading-progress")},
            "builtCss":{"folioOpacity":css.count("--folio-opacity"),"overdriveFolioMarker":css.count("overdrive-folio-marker"),"isFolioCurrent":css.count("is-folio-current"),"odFolioOpen":css.count("od-folio-open"),"folioMask":css.count(".overdrive-folio-marker{display:none!important}")}
          }
          assert all(runtime["builtJs"][k]==0 for k in ["overdriveFolioMarker","overdriveFolio","isFolioCurrent","datasetFolio","folioRootMargin"])
          assert runtime["builtJs"]["overdriveReady"]>0 and runtime["builtJs"]["overdriveManuscript"]>0 and runtime["builtJs"]["overdriveReadingProgress"]>0
          json.dump(runtime,open(out/"folio-implementation-runtime-absence.json","w"),indent=2)

          blocker={
            "verificationGate":"BUILT FOLIO ABSENCE",
            "expectedBuiltCss":{"folioOpacity":0,"overdriveFolioMarker":0,"isFolioCurrent":0,"odFolioOpen":0,"folioMask":0},
            "actualBuiltCss":runtime["builtCss"],
            "blocking":runtime["builtCss"]["overdriveFolioMarker"]!=0 or runtime["builtCss"]["folioMask"]!=0 or runtime["builtCss"]["folioOpacity"]!=0 or runtime["builtCss"]["isFolioCurrent"]!=0 or runtime["builtCss"]["odFolioOpen"]!=0,
            "classification":"D — IMPLEMENTATION BLOCKED BY VERIFICATION FAILURE"
          }
          assert blocker["blocking"] is True
          json.dump(blocker,open(out/"folio-implementation-blocker.json","w"),indent=2)
          PY

      - name: Prove blocker source is unchanged fifth production path
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/folio-implementation-evidence"
          BASE_BLOB="$(git rev-parse "${BASE_SHA}:homepage-sections-v1.css")"
          IMPL_BLOB="$(git rev-parse "${IMPLEMENTATION_SHA}:homepage-sections-v1.css")"
          test "${BASE_BLOB}" = "ef073fbb20c95292c40d6ca9f0775c1f2a4f8866"
          test "${IMPL_BLOB}" = "ef073fbb20c95292c40d6ca9f0775c1f2a4f8866"
          grep -nFx 'main > section.home-chapter > .overdrive-folio-marker{display:none!important}' homepage-sections-v1.css > "${OUT}/folio-blocker-source-line.txt"
          grep -F 'homepage-sections-v1.css?v=20260829-home1' index.html >/dev/null

          jq -n \
            --arg path "homepage-sections-v1.css" \
            --arg baseBlob "${BASE_BLOB}" --arg implementationBlob "${IMPL_BLOB}" \
            --arg rule 'main > section.home-chapter > .overdrive-folio-marker{display:none!important}' \
            '{path:$path,authorizedPath:false,fifthProductionPath:true,baselineBlob:$baseBlob,implementationBlob:$implementationBlob,unchangedFromBaseline:true,productionReferencedFromIndex:true,exactResidualRule:$rule,contractExpansionRequiredToRemove:true,contractExpansionForbidden:true}' \
            > "${OUT}/folio-implementation-blocker-source.json"

      - name: Terminal refs and blocked summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/folio-implementation-evidence"
          api() {
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$1"
          }
          MAIN="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" | jq -r '.object.sha')"
          IMPL="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/basair/post-3b-folio-opacity-implementation" | jq -r '.object.sha')"
          GH="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/gh-pages" | jq -r '.object.sha')"
          test "${MAIN}" = "${BASE_SHA}"
          test "${IMPL}" = "${IMPLEMENTATION_SHA}"
          test "${GH}" = "${GH_SHA}"

          jq -n --arg main "${MAIN}" --arg impl "${IMPL}" --arg gh "${GH}" \
            '{main:$main,implementation:$impl,ghPages:$gh,mainMoved:false,ghPagesMoved:false,noPromotion:true,noDeployment:true,noPagesSettingsMutation:true,noFirebaseMutation:true,noBackendMutation:true}' \
            > "${OUT}/folio-implementation-terminal-refs.json"

          jq -n \
            --arg classification "D — IMPLEMENTATION BLOCKED BY VERIFICATION FAILURE" \
            --arg blocker "Built CSS retains one overdrive-folio-marker mask from unchanged, production-referenced fifth path homepage-sections-v1.css; removing it would require forbidden scope expansion." \
            --arg next "FOLIO OPACITY M4 CONTRACT RE-AUTHORIZATION / FIFTH-PATH CHARACTERIZATION" \
            '{classification:$classification,implementationExactlyComplete:false,implementationSha:"5bc4e216a568a57b217187b4030f8208ad87fe31",implementationTree:"d5cd6ee2a3f3bcb7fe226ba6dcfa314796c26d65",exactFourPathCommit:true,sourceVerificationPassed:true,tokenAuthorityPassed:true,buildIdentityPassed:true,builtFolioAbsencePassed:false,exactBlocker:$blocker,blockedPath:"homepage-sections-v1.css",blockedPathAuthorized:false,nextPossibleGate:$next,promotionAuthorized:false,deploymentAuthorized:false,doNotPromote:true,doNotDeploy:true}' \
            > "${OUT}/folio-implementation-summary.json"

          jq -n '{mutatingDispatchCount:0,noNetworkMutationWasNeededForThisBlockedReview:true,noFirebaseMutation:true,noBackendMutation:true}' > "${OUT}/folio-implementation-network-boundary.json"
          jq -n '{status:"NOT RUN — STOP CONDITION triggered at built Folio absence gate",reason:"Contract requires immediate stop on unexpected Folio residue."}' > "${OUT}/folio-implementation-equivalence.json"
          jq -n '{status:"NOT REACHED — STOP CONDITION",reason:"Built CSS Folio residue discovered before protected-behavior/browser gate."}' > "${OUT}/folio-implementation-protected-behavior.json"
          jq -n '{status:"NOT REACHED — STOP CONDITION",reason:"Generated delta comparison beyond build identity was not continued after unexpected Folio residue."}' > "${OUT}/folio-implementation-generated-delta.json"

      - name: Upload blocked implementation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-3b-folio-opacity-implementation-blocked-evidence
          path: ${{ runner.temp }}/folio-implementation-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Fail closed on verified Folio residue
        run: |
          echo "D — IMPLEMENTATION BLOCKED BY VERIFICATION FAILURE"
          echo "Unchanged fifth production path homepage-sections-v1.css retains the built Folio marker mask."
          echo "No scope expansion is authorized."
          exit 1
