      - name: Terminal authority check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/folio-implementation-evidence"
          api() {
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$1"
          }
          MAIN="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" | jq -r '.object.sha')"
          IMPL="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/basair/post-3b-folio-opacity-implementation" | jq -r '.object.sha')"
          GH="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/gh-pages" | jq -r '.object.sha')"
          MG="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${MAIN}")"
          GG="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${GH}")"
          test "${MAIN}" = "${BASE_SHA}"
          test "${IMPL}" = "${IMPLEMENTATION_SHA}"
          test "${GH}" = "${GH_SHA}"
          test "$(jq -r '.tree.sha' <<<"${MG}")" = "${BASE_TREE}"
          test "$(jq -r '.tree.sha' <<<"${GG}")" = "${GH_TREE}"
          jq -n --arg main "${MAIN}" --arg impl "${IMPL}" --arg gh "${GH}" \
            --arg mainTree "$(jq -r '.tree.sha' <<<"${MG}")" --arg ghTree "$(jq -r '.tree.sha' <<<"${GG}")" \
            '{main:$main,implementation:$impl,ghPages:$gh,mainTree:$mainTree,ghPagesTree:$ghTree,mainMoved:false,ghPagesMoved:false,noPromotion:true,noDeployment:true,noPagesSettingsMutation:true,noFirebaseMutation:true,noBackendMutation:true}' \
            > "${OUT}/folio-implementation-terminal-refs.json"

      - name: Verify required evidence set
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/folio-implementation-evidence"
          for F in \
            folio-implementation-preflight.json \
            folio-implementation-commit.json \
            folio-implementation-source-diff.json \
            folio-implementation-js-result.json \
            folio-implementation-css-result.json \
            folio-implementation-hotfix-result.json \
            folio-implementation-manifest-result.json \
            folio-implementation-authority.json \
            folio-implementation-build.json \
            folio-implementation-generated-delta.json \
            folio-implementation-protected-behavior.json \
            folio-implementation-equivalence.json \
            folio-implementation-runtime-absence.json \
            folio-implementation-network-boundary.json \
            folio-implementation-terminal-refs.json \
            folio-implementation-summary.json \
            token-authority.log \
            npm-verify.log \
            build.log \
            folio-implementation-source.patch
          do
            test -s "${OUT}/${F}"
          done
          jq -e '.classification=="A — M4 IMPLEMENTATION EXACTLY COMPLETE"' "${OUT}/folio-implementation-summary.json" >/dev/null
          jq -e '.caseCount==4 and .geometry=="EXACT" and .screenshots=="PIXEL IDENTICAL"' "${OUT}/folio-implementation-equivalence.json" >/dev/null

      - name: Upload implementation evidence
        uses: actions/upload-artifact@v4
        with:
          name: post-3b-folio-opacity-implementation-evidence
          path: ${{ runner.temp }}/folio-implementation-evidence
          if-no-files-found: error
          retention-days: 90
