          const envBrowser=await launch();
          const browserEnvironment={chromiumVersion:envBrowser.version(),playwrightVersion:'1.55.0',runnerOS:fs.readFileSync(path.join(OUT,'os.txt'),'utf8').trim(),runnerImageOS:fs.readFileSync(path.join(OUT,'runner-image-os.txt'),'utf8').trim(),runnerImageVersion:fs.readFileSync(path.join(OUT,'runner-image-version.txt'),'utf8').trim(),deviceScaleFactor:1,colorScheme:'light',reducedMotion:'reduce',locale:'en-US',timezone:'UTC',fontInventorySha256:H(fs.readFileSync(path.join(OUT,'fonts.txt'))),browserLaunchArgs:ARGS,headless:true,gpuSoftwareFlags:ARGS.filter(x=>/gpu|gl|software|swiftshader/i.test(x)),normalizationStyleSha256:H(Buffer.from(NORMALIZATION))};
          await envBrowser.close();
          fs.writeFileSync(path.join(OUT,'folio-quiet-window-browser-environment.json'),JSON.stringify(browserEnvironment,null,2));
          fs.writeFileSync(path.join(OUT,'folio-quiet-window-network-policy.json'),JSON.stringify({installedBeforeNavigation:true,sameOriginSafeReads:['GET','HEAD','OPTIONS'],externalReads:'BLOCK',telemetry:'BLOCK',mutatingRequests:'BLOCK',networkRecords},null,2));
          
          
          
          const phases={};
          for(const key of ORDER){
            const v=VIEWPORTS[key];
            phases[v.n]={
              samePage:await samePagePhase('M5',v),
              freshContext:await freshContextPhase('M5',v,key==='mobile'?10:5),
              freshProcess:await freshProcessPhase('M5',v,key==='mobile'?5:3)
            };
          }
          const phaseList=Object.values(phases).flatMap(x=>[x.samePage,x.freshContext,x.freshProcess]);
          const everyPhasePass=phaseList.every(x=>x.pass===true);
          const allComparisons=phaseList.flatMap(x=>x.comparisons||[]);
          const exactPixelPass=allComparisons.length>0&&allComparisons.every(x=>x.pixelIdentical&&x.diffPixels===0&&x.maxChannelDelta===0&&x.diffRatio===0);
          const byViewport={};
          for(const [vp,x] of Object.entries(phases)){
            const samples=[...x.samePage.samples,...x.freshContext.samples,...x.freshProcess.samples];
            const uniq=k=>[...new Set(samples.map(s=>s.hashes[k]))];
            byViewport[vp]={
              accepted:samples.length,
              pngHashes:[...new Set(samples.map(s=>s.pngHash))],
              domHashes:uniq('domSha256'),
              geometryHashes:uniq('geometrySha256'),
              resourceHashes:uniq('resourceSetSha256'),
              fontHashes:uniq('fontStateSha256'),
              imageHashes:uniq('imageStateSha256'),
              renderHashes:uniq('renderStateSha256'),
              exactAcrossRegimes:[...new Set(samples.map(s=>s.pngHash))].length===1&&uniq('domSha256').length===1&&uniq('geometrySha256').length===1&&uniq('resourceSetSha256').length===1&&uniq('fontStateSha256').length===1&&uniq('imageStateSha256').length===1&&uniq('renderStateSha256').length===1
            };
          }
          const crossRegimePass=Object.values(byViewport).every(x=>x.exactAcrossRegimes);
          const pageErrors=runtimeRecords.flatMap(x=>x.pageErrors.map(message=>({variant:x.variant,viewport:x.viewport,label:x.label,message})));
          const rawConsoleErrors=runtimeRecords.flatMap(x=>x.consoleErrors.map(message=>({variant:x.variant,viewport:x.viewport,label:x.label,message,blockedExternalCount:x.blockedExternalCount,blockedTelemetryCount:x.blockedTelemetryCount,failedLocal:x.failedLocal})));
          const unexplainedConsoleErrors=rawConsoleErrors.filter(x=>!((x.blockedExternalCount+x.blockedTelemetryCount)>0&&x.failedLocal.length===0&&/Failed to load resource|ERR_FAILED|ERR_BLOCKED_BY_CLIENT/i.test(x.message)));
          const localRequestFailures=runtimeRecords.flatMap(x=>x.failedLocal.map(url=>({variant:x.variant,viewport:x.viewport,label:x.label,url})));
          const unsafeDispatches=networkRecords.reduce((n,x)=>n+x.blockedUnsafeCount,0);
          const runtimePass=pageErrors.length===0&&unexplainedConsoleErrors.length===0&&localRequestFailures.length===0&&unsafeDispatches===0;
          const selfPass=everyPhasePass&&exactPixelPass&&crossRegimePass&&runtimePass;
          
          fs.writeFileSync(path.join(OUT,'folio-post-promotion-main-self-stability.json'),JSON.stringify({
            pass:selfPass,
            viewports:phases,
            viewportIdentity:byViewport,
            allComparisonCount:allComparisons.length,
            allDiffPixelsZero:allComparisons.every(x=>x.diffPixels===0),
            allMaxChannelDeltaZero:allComparisons.every(x=>x.maxChannelDelta===0),
            allDiffRatioZero:allComparisons.every(x=>x.diffRatio===0),
            quietWindow:{pendingLocal:'0 continuously for 1000ms on accepted captures',mutationDelta:0,layoutShiftDelta:'0 or UNSUPPORTED',geometry:'stable',fonts:'loaded/stable',resourceSet:'stable',imageState:'stable',focus:'normalized',selection:'empty',pointer:'normalized',scroll:'0,0'}
          },null,2));
          
          fs.writeFileSync(path.join(OUT,'folio-post-promotion-dom-geometry.json'),JSON.stringify({
            pass:crossRegimePass&&phaseList.every(p=>(p.samples||[]).every(s=>s.hashes.domSha256&&s.hashes.geometrySha256)),
            viewportIdentity:byViewport,
            geometrySamples:allGeometryHashes,
            dom:'STABLE',
            geometry:'EXACT / STABLE',
            scrollLayout:'STABLE'
          },null,2));
          
          fs.writeFileSync(path.join(OUT,'folio-post-promotion-console-network.json'),JSON.stringify({
            pass:runtimePass,
            pageErrors,
            rawConsoleErrors,
            unexplainedConsoleErrors,
            localRequestFailures,
            externalBlockedRequests:networkRecords.reduce((n,x)=>n+x.blockedExternalCount,0),
            telemetryBlockedRequests:networkRecords.reduce((n,x)=>n+x.blockedTelemetryCount,0),
            unsafeDispatches,
            mutationAttempts:unsafeDispatches,
            intentionallyBlockedExternalReadsAreNotClassifiedAsProductRegressions:true
          },null,2));
          
          fs.writeFileSync(path.join(OUT,'folio-post-promotion-network-policy.json'),JSON.stringify({
            installedBeforeNavigation:true,
            sameOriginSafeReads:['GET','HEAD','OPTIONS'],
            externalRequests:'BLOCK',
            telemetry:'BLOCK',
            unsafeMutatingRequests:'BLOCK',
            mutatingDispatchCount:unsafeDispatches,
            records:networkRecords
          },null,2));
          
          fs.writeFileSync(path.join(OUT,'folio-post-promotion-accepted-captures.json'),JSON.stringify({
            count:acceptedRawCaptures.length,
            files:acceptedRawCaptures,
            pixelComparisons:allComparisons.length,
            comparisonSummary:allComparisons.map(x=>({key:x.key,diffPixels:x.diffPixels,maxChannelDelta:x.maxChannelDelta,diffRatio:x.diffRatio,pixelIdentical:x.pixelIdentical}))
          },null,2));
          fs.copyFileSync(path.join(OUT,'folio-quiet-window-browser-environment.json'),path.join(OUT,'folio-post-promotion-browser-environment.json'));
          fs.writeFileSync(path.join(OUT,'folio-post-promotion-browser-raw-hashes.json'),JSON.stringify({
            resourceHashes:allResourceHashes,
            fontHashes:allFontHashes,
            imageHashes:allImageHashes,
            geometryHashes:allGeometryHashes,
            renderHashes:allRenderHashes,
            mutationSamples:allMutationSamples,
            layoutShiftSamples:allLayoutSamples,
            pendingRequestSamples:allPendingSamples,
            pixelComparisons:allComparisons
          },null,2));
          
          if(!selfPass) throw new Error('PROMOTED_MAIN_SELF_STABILITY_FAILURE');
          
          JS
          OUT="$OUT" M4="$GITHUB_WORKSPACE" M5="$GITHUB_WORKSPACE" node .postpromo-quiet.mjs
          rm -f .postpromo-quiet.mjs
          test -z "$(git status --porcelain)"

      - name: Terminal authorities summary and deployment boundary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/postpromo"; mkdir -p "$OUT"
          api(){ curl --fail --silent --show-error --location -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "$1"; }
          MAIN="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main"|jq -r '.object.sha')"
          M5="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/basair/post-3b-folio-opacity-m5-implementation"|jq -r '.object.sha')"
          M4="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/basair/post-3b-folio-opacity-implementation"|jq -r '.object.sha')"
          GH="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/gh-pages"|jq -r '.object.sha')"
          MAIN_G="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${MAIN}")"
          GH_G="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${GH}")"
          test "$MAIN" = "$MAIN_SHA"
          test "$M5" = "$M5_SHA"
          test "$M4" = "$M4_SHA"
          test "$GH" = "$GH_SHA"
          test "$(jq -r '.tree.sha'<<<"$MAIN_G")" = "$MAIN_TREE"
          test "$(jq -r '.tree.sha'<<<"$GH_G")" = "$GH_TREE"

          ISSUES="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100")"
          TOTAL="$(jq '[.[]|select((has("pull_request")|not))]|length'<<<"$ISSUES")"
          TYPEA="$(jq '[.[]|select((has("pull_request")|not))|select((((.title//"")+" "+(.body//""))|test("type[- ]?a|production defect|critical production";"i")))]'<<<"$ISSUES")"
          jq -n --argjson total "$TOTAL" --argjson blockers "$TYPEA" '{totalOpenIssues:$total,blockingMatches:$blockers,currentTypeAProductionDefect:(if ($blockers|length)==0 then "NONE PROVEN" else "PROVEN" end)}' > "$OUT/folio-post-promotion-type-a.json"

          RUNS="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${MAIN_SHA}&per_page=100")"
          jq '{runCount:.total_count,runs:[.workflow_runs[]|{id,name,event,status,conclusion,head_branch,head_sha,html_url}],deploymentLikeRunCount:([.workflow_runs[]|select((.name//"")|test("deploy|pages|firebase|publish";"i"))]|length)}' <<<"$RUNS" > "$OUT/folio-post-promotion-associated-runs.json"

          jq -n --arg main "$MAIN" --arg m5 "$M5" --arg m4 "$M4" --arg gh "$GH" \
            '{main:$main,m5:$m5,m4:$m4,ghPages:$gh,mainMovedDuringVerification:false,m5Moved:false,historicalM4Rewritten:false,ghPagesMoved:false,noDeployment:true,noPagesSettingsMutation:true,noFirebaseMutation:true,noBackendMutation:true}' \
            > "$OUT/folio-post-promotion-terminal-refs.json"

          jq -n --arg gh "$GH" --arg ght "$GH_TREE" --argjson runCount "$(jq '.runCount' "$OUT/folio-post-promotion-associated-runs.json")" --argjson deploymentLike "$(jq '.deploymentLikeRunCount' "$OUT/folio-post-promotion-associated-runs.json")" \
            '{ghPages:$gh,ghPagesTree:$ght,associatedMainRunCount:$runCount,deploymentLikeAssociatedRunCount:$deploymentLike,ghPagesUnchanged:true,pagesSettingsMutationByThisGate:false,firebaseMutationByThisGate:false,backendMutationByThisGate:false,intentionalDeploymentTriggered:false,deployment:"NOT PERFORMED"}' \
            > "$OUT/folio-post-promotion-deployment-state.json"

          if [ -s "$OUT/folio-post-promotion-main-self-stability.json" ] && jq -e '.pass==true' "$OUT/folio-post-promotion-main-self-stability.json" >/dev/null \
             && jq -e '.pass==true' "$OUT/folio-post-promotion-dom-geometry.json" >/dev/null \
             && jq -e '.pass==true' "$OUT/folio-post-promotion-console-network.json" >/dev/null \
             && jq -e '.blockingMatches|length==0' "$OUT/folio-post-promotion-type-a.json" >/dev/null \
             && jq -e '.deploymentLikeRunCount==0' "$OUT/folio-post-promotion-associated-runs.json" >/dev/null; then
            jq -n \
              --arg outcome "A — POST-PROMOTION MAIN VERIFIED" \
              --arg main "$MAIN" --arg tree "$MAIN_TREE" --arg m5 "$M5" --arg old "$OLD_MAIN" --arg m4 "$M4" --arg gh "$GH" \
              --slurpfile token "$OUT/folio-post-promotion-token-authority.json" \
              --slurpfile build "$OUT/folio-post-promotion-build.json" \
              '{outcome:$outcome,status:"READY FOR FINAL CLOSURE REVIEW",currentMain:$main,currentMainTree:$tree,m5Branch:$m5,mainEqualsM5:true,mainTreeEqualsM5Tree:true,oldMain:$old,promotedCommits:1,fastForwardHistory:"PASS",changedPathHistory:5,tokenAuthority:$token[0],build:$build[0],sourceFolioResidues:0,builtFolioResidues:0,protectedBehavior:"PASS",promotedMainSelfStability:"PASS",dom:"STABLE",geometry:"EXACT / STABLE",consoleNetwork:"PASS",currentTypeAProductionDefect:"NONE PROVEN",historicalM4:$m4,ghPages:$gh,deployment:"NOT PERFORMED",pagesSettings:"UNCHANGED BY THIS GATE",firebaseBackend:"UNCHANGED",verification:"COMPLETE",deploymentAuthorized:false,nextGate:"TO BE DETERMINED ONLY AFTER INDEPENDENT CLOSURE OF THIS VERIFICATION"}' \
              > "$OUT/folio-post-promotion-summary.json"
          else
            jq -n --arg outcome "BLOCKED — VERIFICATION CONDITION FAILED" --arg main "$MAIN" --arg m5 "$M5" --arg m4 "$M4" --arg gh "$GH" \
              '{outcome:$outcome,main:$main,m5:$m5,m4:$m4,ghPages:$gh,deployment:"NO",productionRepairPerformed:false}' > "$OUT/folio-post-promotion-summary.json"
            exit 1
          fi

          for F in \
            folio-post-promotion-preflight.json \
            folio-post-promotion-authorities.json \
            folio-post-promotion-main-identity.json \
            folio-post-promotion-topology.json \
            folio-post-promotion-five-path-history.json \
            folio-post-promotion-main-m5-tree-identity.json \
            folio-post-promotion-token-authority.json \
            folio-post-promotion-build.json \
            folio-post-promotion-source-folio-absence.json \
            folio-post-promotion-built-folio-absence.json \
            folio-post-promotion-protected-behavior.json \
            folio-post-promotion-browser-environment.json \
            folio-post-promotion-network-policy.json \
            folio-post-promotion-main-self-stability.json \
            folio-post-promotion-dom-geometry.json \
            folio-post-promotion-console-network.json \
            folio-post-promotion-type-a.json \
            folio-post-promotion-associated-runs.json \
            folio-post-promotion-deployment-state.json \
            folio-post-promotion-summary.json \
            folio-post-promotion-terminal-refs.json
          do test -s "$OUT/$F"; done

      - name: Upload post-promotion verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-3b-folio-opacity-post-promotion-main-verification
          path: ${{ runner.temp }}/postpromo
          if-no-files-found: error
          retention-days: 90
