name: Folio Post-Promotion Main Verification

on:
  push:
    branches:
      - 'basair/post-3b-folio-opacity-post-promotion-main-verification-20261010'

permissions:
  contents: read

env:
  MAIN_SHA: 2fd0973b2ff68f0ba960ff2aa83d3520d9c3c243
  MAIN_TREE: 09aa7bd7325e7c078cc817f0790402a5667a3644
  M5_SHA: 2fd0973b2ff68f0ba960ff2aa83d3520d9c3c243
  M5_TREE: 09aa7bd7325e7c078cc817f0790402a5667a3644
  M4_SHA: 5bc4e216a568a57b217187b4030f8208ad87fe31
  M4_TREE: d5cd6ee2a3f3bcb7fe226ba6dcfa314796c26d65
  GH_SHA: cef59ba05b3382978b4c18e83592f08227b2f9c4
  GH_TREE: 1b80d7144e8bac484cf98a4ebbefc1c96ca8d821
  OLD_MAIN: 006ba05c7361451865660450695c48428a3ed8d0

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact promoted main read-only
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MAIN_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fresh authorities topology history issues and automation state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/postpromo"; mkdir -p "$OUT"
          api(){ curl --fail --silent --show-error --location -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "$1"; }

          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test -z "$(git status --porcelain)"

          MAIN="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main"|jq -r '.object.sha')"
          M5="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/basair/post-3b-folio-opacity-m5-implementation"|jq -r '.object.sha')"
          M4="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/basair/post-3b-folio-opacity-implementation"|jq -r '.object.sha')"
          GH="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/gh-pages"|jq -r '.object.sha')"
          MAIN_G="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${MAIN}")"
          M5_G="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${M5}")"
          M4_G="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${M4}")"
          GH_G="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${GH}")"

          test "$MAIN" = "$MAIN_SHA"
          test "$M5" = "$M5_SHA"
          test "$M4" = "$M4_SHA"
          test "$GH" = "$GH_SHA"
          test "$(jq -r '.tree.sha'<<<"$MAIN_G")" = "$MAIN_TREE"
          test "$(jq -r '.tree.sha'<<<"$M5_G")" = "$M5_TREE"
          test "$(jq -r '.tree.sha'<<<"$M4_G")" = "$M4_TREE"
          test "$(jq -r '.tree.sha'<<<"$GH_G")" = "$GH_TREE"
          test "$(jq '.parents|length'<<<"$MAIN_G")" = 1
          test "$(jq -r '.parents[0].sha'<<<"$MAIN_G")" = "$OLD_MAIN"
          test "$(jq -r '.message'<<<"$MAIN_G")" = "Post-3B: remove dormant Folio subsystem completely"

          test "$(git merge-base "$OLD_MAIN" "$MAIN_SHA")" = "$OLD_MAIN"
          test "$(git rev-list --count "$OLD_MAIN..$MAIN_SHA")" = 1
          test "$(git rev-list --count "$MAIN_SHA..$OLD_MAIN")" = 0
          test "$(git rev-parse "$MAIN_SHA^{tree}")" = "$MAIN_TREE"
          test "$(git rev-parse "$M5_SHA^{tree}")" = "$M5_TREE"

          git diff --numstat "$OLD_MAIN" "$MAIN_SHA" -- | sort > "$OUT/actual-numstat.txt"
          cat > "$OUT/expected-numstat.txt" <<'EOF'
          0	1	homepage-sections-v1.css
          0	1	visual-layout-hotfix-v2.css
          0	25	overdrive-v1.js
          0	45	overdrive-v1.css
          3	5	token-authority-manifest.json
          EOF
          sort -o "$OUT/expected-numstat.txt" "$OUT/expected-numstat.txt"
          diff -u "$OUT/expected-numstat.txt" "$OUT/actual-numstat.txt"
          test "$(git diff --name-only "$OLD_MAIN" "$MAIN_SHA" -- | wc -l)" = 5
          test -z "$(git diff --name-status "$OLD_MAIN" "$MAIN_SHA" -- | awk '$1!="M"{print}')"

          jq -n --arg main "$MAIN" --arg m5 "$M5" --arg m4 "$M4" --arg gh "$GH" \
            --arg mt "$(jq -r '.tree.sha'<<<"$MAIN_G")" --arg m5t "$(jq -r '.tree.sha'<<<"$M5_G")" \
            --arg m4t "$(jq -r '.tree.sha'<<<"$M4_G")" --arg ght "$(jq -r '.tree.sha'<<<"$GH_G")" \
            '{main:$main,m5:$m5,m4:$m4,ghPages:$gh,mainTree:$mt,m5Tree:$m5t,m4Tree:$m4t,ghPagesTree:$ght,allExpected:true}' \
            > "$OUT/folio-post-promotion-authorities.json"

          jq -n --arg sha "$MAIN" --arg tree "$(jq -r '.tree.sha'<<<"$MAIN_G")" --arg parent "$(jq -r '.parents[0].sha'<<<"$MAIN_G")" --arg message "$(jq -r '.message'<<<"$MAIN_G")" \
            '{sha:$sha,tree:$tree,parentCount:1,parent:$parent,message:$message,mergeCommit:false,mainEqualsM5:true,mainTreeEqualsM5Tree:true}' \
            > "$OUT/folio-post-promotion-main-identity.json"

          jq -n --arg old "$OLD_MAIN" --arg current "$MAIN_SHA" \
            '{oldMain:$old,currentMain:$current,status:"ahead",aheadBy:1,behindBy:0,totalCommits:1,mergeBase:$old,directParentFastForward:"PASS",historyRewrite:false,mergeCommit:false}' \
            > "$OUT/folio-post-promotion-topology.json"

          jq -Rn '[inputs|split("\t")|{additions:(.[0]|tonumber),deletions:(.[1]|tonumber),path:.[2]}]' < "$OUT/actual-numstat.txt" > "$OUT/rows.json"
          jq -n --slurpfile rows "$OUT/rows.json" '{pathCount:5,rows:$rows[0],sixthPath:null,wholeFileDeletion:false,rename:false,unexpectedSourceChange:false}' > "$OUT/folio-post-promotion-five-path-history.json"

          jq -n --arg mainTree "$MAIN_TREE" --arg m5Tree "$M5_TREE" \
            '{mainTree:$mainTree,m5Tree:$m5Tree,mainTreeEqualsM5Tree:($mainTree==$m5Tree),wholeTreeIdentity:true}' \
            > "$OUT/folio-post-promotion-main-m5-tree-identity.json"

          ISSUES="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100")"
          TOTAL="$(jq '[.[]|select((has("pull_request")|not))]|length'<<<"$ISSUES")"
          TYPEA="$(jq '[.[]|select((has("pull_request")|not))|select((((.title//"")+" "+(.body//""))|test("type[- ]?a|production defect|critical production";"i")))]'<<<"$ISSUES")"
          test "$(jq length<<<"$TYPEA")" = 0
          jq -n --argjson total "$TOTAL" --argjson blockers "$TYPEA" '{totalOpenIssues:$total,blockingMatches:$blockers,currentTypeAProductionDefect:"NONE PROVEN"}' > "$OUT/folio-post-promotion-type-a.json"

          RUNS="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${MAIN_SHA}&per_page=100")"
          DEPLOYLIKE="$(jq '[.workflow_runs[]|select((.name//"")|test("deploy|pages|firebase|publish";"i"))]|length'<<<"$RUNS")"
          test "$DEPLOYLIKE" = 0
          jq '{runCount:.total_count,runs:[.workflow_runs[]|{id,name,event,status,conclusion,head_branch,head_sha,html_url}],deploymentLikeRunCount:([.workflow_runs[]|select((.name//"")|test("deploy|pages|firebase|publish";"i"))]|length)}' <<<"$RUNS" > "$OUT/folio-post-promotion-associated-runs.json"

          jq -n --arg main "$MAIN" --arg tree "$MAIN_TREE" --arg m5 "$M5" --arg m4 "$M4" --arg gh "$GH" \
            '{freshCheckoutHead:$main,freshCheckoutTree:$tree,m5:$m5,m4:$m4,ghPages:$gh,workingTreeClean:true,authorityDrift:false,typeABlocker:false,associatedDeploymentRun:false,preflight:"PASS"}' \
            > "$OUT/folio-post-promotion-preflight.json"

      - name: Fresh source verification token authority build identity and Folio absence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/postpromo"
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          npm ci >"$OUT/npm-ci.log" 2>&1
          npm run verify >"$OUT/npm-verify.log" 2>&1
          node token-authority-check.mjs >"$OUT/token-authority.log" 2>&1
          git diff --check
          grep -F 'Token authority PASS: 106 canonical; aliases A/B/C/D/E=1/48/23/23/2; corrected conflicts=38; production CSS=51; inline styles=1.' "$OUT/token-authority.log"

          node --input-type=module - "$OUT" <<'NODE'
          import fs from 'node:fs';
          const out=process.argv[2];
          const m=JSON.parse(fs.readFileSync('token-authority-manifest.json','utf8'));
          const a=m.aliasSurfaceSummary?.classificationCounts||{};
          const c=m.correctedAuditScope||{};
          const authority={
            canonical:Object.keys(m.canonicalTokens||{}).length,
            aliases:{A:a.A,B:a.B,C:a.C,D:a.D,E:a.E},
            correctedConflicts:c.conflictCount,
            productionCss:c.productionCssFileCount,
            inlineStyles:c.inlineStyleBlockCount,
            customPropertyNames:c.customPropertyNameCount,
            undefinedVariables:0,
            folioOpacityAbsent:!JSON.stringify(m).includes('"--folio-opacity"'),
            layoutSectionCompactProtected:JSON.stringify(m).includes('"--layout-section-compact"')
          };
          const expect=authority.canonical===106&&authority.aliases.A===1&&authority.aliases.B===48&&authority.aliases.C===23&&authority.aliases.D===23&&authority.aliases.E===2&&authority.correctedConflicts===38&&authority.productionCss===51&&authority.inlineStyles===1&&authority.customPropertyNames===368&&authority.folioOpacityAbsent&&authority.layoutSectionCompactProtected;
          authority.pass=expect;
          fs.writeFileSync(out+'/folio-post-promotion-token-authority.json',JSON.stringify(authority,null,2));
          if(!expect)process.exit(1);
          NODE

          npm run build >"$OUT/npm-build.log" 2>&1
          python3 - "$OUT" <<'PY'
          import sys,json
          from pathlib import Path
          out=Path(sys.argv[1]); root=Path('dist')
          files=[p for p in root.rglob('*') if p.is_file()]
          total=sum(p.stat().st_size for p in files)
          rel=sorted(p.relative_to(root).as_posix() for p in files)
          js=[x for x in rel if x.startswith('assets/main-') and x.endswith('.js')]
          css=[x for x in rel if x.startswith('assets/main-') and x.endswith('.css')]
          data={'files':len(files),'bytes':total,'mainJs':js[0] if len(js)==1 else js,'mainCss':css[0] if len(css)==1 else css}
          data['pass']=data=={'files':25,'bytes':2553937,'mainJs':'assets/main-B4PdnOC4.js','mainCss':'assets/main-B-cTtzqp.css'}
          (out/'folio-post-promotion-build.json').write_text(json.dumps(data,indent=2))
          assert data['pass'],data
          PY

          python3 - "$OUT" <<'PY'
          import sys,json,re
          from pathlib import Path
          out=Path(sys.argv[1])
          prod=['homepage-sections-v1.css','overdrive-v1.css','overdrive-v1.js','token-authority-manifest.json','visual-layout-hotfix-v2.css']
          text='\n'.join(Path(p).read_text(errors='ignore') for p in prod)
          checks={
            'initFolioMarkers':len(re.findall(r'initFolioMarkers',text)),
            'folioOpacity':len(re.findall(r'--folio-opacity',text)),
            'overdriveFolioMarker':len(re.findall(r'overdrive-folio-marker',text)),
            'isFolioCurrent':len(re.findall(r'is-folio-current',text)),
            'odFolioOpen':len(re.findall(r'od-folio-open',text)),
            'datasetFolio':len(re.findall(r'dataset\.folio',text))
          }
          checks['reachableFolioMarkerCreationPath']=0 if checks['initFolioMarkers']==0 and checks['overdriveFolioMarker']==0 and checks['datasetFolio']==0 else 1
          data={'characterizedProductionPaths':prod,'counts':checks,'sourceFolioSubsystemResidues':sum(checks.values()),'pass':all(v==0 for v in checks.values())}
          (out/'folio-post-promotion-source-folio-absence.json').write_text(json.dumps(data,indent=2))
          assert data['pass'],data
          PY

          python3 - "$OUT" <<'PY'
          import sys,json,re
          from pathlib import Path
          out=Path(sys.argv[1]); b=json.loads((out/'folio-post-promotion-build.json').read_text())
          js=(Path('dist')/b['mainJs']).read_text(errors='ignore'); css=(Path('dist')/b['mainCss']).read_text(errors='ignore')
          checks={
            'jsOverdriveFolioMarker':js.count('overdrive-folio-marker'),
            'jsIsFolioCurrent':js.count('is-folio-current'),
            'jsDatasetFolio':len(re.findall(r'dataset\.folio',js)),
            'jsObserverRootMarginSignature':len(re.findall(r'rootMargin.{0,120}folio|folio.{0,120}rootMargin',js,re.I|re.S)),
            'cssFolioOpacity':css.count('--folio-opacity'),
            'cssOverdriveFolioMarker':css.count('overdrive-folio-marker'),
            'cssIsFolioCurrent':css.count('is-folio-current'),
            'cssOdFolioOpen':css.count('od-folio-open'),
            'cssFolioMask':len(re.findall(r'folio.{0,80}mask|mask.{0,80}folio',css,re.I|re.S))
          }
          data={'counts':checks,'builtFolioResidues':sum(checks.values()),'pass':all(v==0 for v in checks.values())}
          (out/'folio-post-promotion-built-folio-absence.json').write_text(json.dumps(data,indent=2))
          assert data['pass'],data
          PY

          node --input-type=module - "$OUT" <<'NODE'
          import fs from 'node:fs';
          const out=process.argv[2], js=fs.readFileSync('overdrive-v1.js','utf8'), css=fs.readFileSync('overdrive-v1.css','utf8'), home=fs.readFileSync('homepage-sections-v1.css','utf8'), hot=fs.readFileSync('visual-layout-hotfix-v2.css','utf8'), manifest=fs.readFileSync('token-authority-manifest.json','utf8');
          const checks={
            initManuscriptHero:js.includes('initManuscriptHero'),
            initReadingProgress:js.includes('initReadingProgress'),
            initOverdrive:js.includes('initOverdrive'),
            DOMContentLoaded:js.includes('DOMContentLoaded'),
            overdriveReady:js.includes('overdrive-ready'),
            overdriveManuscript:js.includes('overdrive-manuscript')&&css.includes('overdrive-manuscript'),
            overdriveReadingProgress:js.includes('overdrive-reading-progress')&&css.includes('overdrive-reading-progress'),
            nonFolioOverdriveCss:css.length>1000&&!css.includes('overdrive-folio-marker'),
            unrelatedHomepageCss:home.length>1000,
            unrelatedVisualLayoutHotfixes:hot.length>1000,
            unrelatedTokenAuthorityRecords:manifest.length>10000,
            layoutSectionCompact:hot.includes('--layout-section-compact')&&manifest.includes('--layout-section-compact')
          };
          const pass=Object.values(checks).every(Boolean);
          fs.writeFileSync(out+'/folio-post-promotion-protected-behavior.json',JSON.stringify({checks,pass},null,2));
          if(!pass)process.exit(1);
          NODE
          test -z "$(git status --porcelain)"

      - name: Strict promoted-main quiet-window self-stability
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/postpromo"
          npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7.0.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          git checkout -- package.json package-lock.json 2>/dev/null || true
          rm -f node_modules/.package-lock.json 2>/dev/null || true
          uname -a >"$OUT/os.txt"
          printf '%s\n' "${ImageOS:-unknown}" >"$OUT/runner-image-os.txt"
          printf '%s\n' "${ImageVersion:-unknown}" >"$OUT/runner-image-version.txt"
          (fc-list || true) | sort >"$OUT/fonts.txt"
          python3 -m http.server 4675 --directory "$GITHUB_WORKSPACE/dist" >/tmp/main-postpromo.log 2>&1 &
          sleep 2
          cat > .postpromo-quiet.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { PNG } from 'pngjs';
          
          const OUT=process.env.OUT;
          const ROOT={M4:process.env.M4,M5:process.env.M5};
          const ORIGIN={M4:'http://127.0.0.1:4674',M5:'http://127.0.0.1:4675'};
          const VIEWPORTS={
            mobile:{n:'390x844',w:390,h:844},
            desktop:{n:'1440x1000',w:1440,h:1000},
            below760:{n:'759x900',w:759,h:900},
            above760:{n:'761x900',w:761,h:900}
          };
          const ORDER=['desktop','mobile','below760','above760'];
          const ARGS=['--disable-background-networking','--disable-default-apps','--disable-sync','--no-first-run'];
          const NORMALIZATION='*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;caret-color:transparent!important}video{visibility:hidden!important}#splash-screen{display:none!important;opacity:0!important;visibility:hidden!important}';
          const EXPECTED_CHROMIUM='140.0.7339.16';
          const H=b=>crypto.createHash('sha256').update(b).digest('hex');
          const J=o=>JSON.stringify(o);
          const hashObj=o=>H(Buffer.from(J(o)));
          const contextOptions=v=>({viewport:{width:v.w,height:v.h},deviceScaleFactor:1,colorScheme:'light',reducedMotion:'reduce',locale:'en-US',timezoneId:'UTC'});
          fs.mkdirSync(path.join(OUT,'pixel-evidence'),{recursive:true});
          
          const allResourceManifests=[],allResourceHashes=[],allFontHashes=[],allImageHashes=[],allGeometryHashes=[],allRenderHashes=[];
          const allMutationSamples=[],allLayoutSamples=[],allPendingSamples=[];
          const acceptedRawCaptures=[];
          const allSelfDiffs=[],allSelfDiffElements=[],allSelfDiffColors=[];
          const networkRecords=[],runtimeRecords=[];
          
          function rect(r){return{x:+r.x.toFixed(3),y:+r.y.toFixed(3),width:+r.width.toFixed(3),height:+r.height.toFixed(3),top:+r.top.toFixed(3),right:+r.right.toFixed(3),bottom:+r.bottom.toFixed(3),left:+r.left.toFixed(3)}}
          function normalizeUrl(u,origin){try{const x=new URL(u);if(x.origin===origin)return 'LOCAL'+x.pathname+x.search;return x.origin+x.pathname+x.search}catch{return u}}
          function selector(e){if(!e)return null;return e.tagName.toLowerCase()+(e.id?'#'+e.id:'')+(typeof e.className==='string'&&e.className.trim()?'.'+e.className.trim().split(/\s+/).slice(0,5).join('.'):'')}
          
          function pdiff(a,b){
            const A=PNG.sync.read(a),B=PNG.sync.read(b);
            if(A.width!==B.width||A.height!==B.height)throw new Error('PNG size mismatch');
            let n=0,max=0,minX=A.width,minY=A.height,maxX=-1,maxY=-1;
            const mask=new PNG({width:A.width,height:A.height}),heat=new PNG({width:A.width,height:A.height}),pairs=new Map();
            for(let y=0;y<A.height;y++)for(let x=0;x<A.width;x++){
              const i=(y*A.width+x)*4;let hit=false;
              for(let c=0;c<4;c++){const d=Math.abs(A.data[i+c]-B.data[i+c]);if(d){hit=true;max=Math.max(max,d)}}
              if(hit){
                n++;minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);
                mask.data[i]=mask.data[i+1]=mask.data[i+2]=mask.data[i+3]=255;
                heat.data[i]=255;heat.data[i+1]=0;heat.data[i+2]=0;heat.data[i+3]=255;
                const k=[...A.data.slice(i,i+4)].join(',')+' -> '+[...B.data.slice(i,i+4)].join(',');
                pairs.set(k,(pairs.get(k)||0)+1);
              }else{mask.data[i+3]=255;heat.data[i+3]=55}
            }
            return{diffPixels:n,maxChannelDelta:max,diffRatio:n/(A.width*A.height),boundingBox:n?{minX,minY,maxX,maxY,width:maxX-minX+1,height:maxY-minY+1}:null,pixelIdentical:n===0,A,B,mask:PNG.sync.write(mask),heat:PNG.sync.write(heat),pairs:[...pairs.entries()].sort((a,b)=>b[1]-a[1]).slice(0,40).map(([pair,count])=>({pair,count}))};
          }
          function crop(P,b){if(!b)return null;const q=8,x=Math.max(0,b.minX-q),y=Math.max(0,b.minY-q),w=Math.min(P.width-x,b.width+2*q),h=Math.min(P.height-y,b.height+2*q),C=new PNG({width:w,height:h});PNG.bitblt(P,C,x,y,w,h,0,0);return PNG.sync.write(C)}
          function saveDiff(key,a,b,d){
            if(d.pixelIdentical)return;
            const q=path.join(OUT,'pixel-evidence');
            fs.writeFileSync(path.join(q,key+'-A.png'),a.png);fs.writeFileSync(path.join(q,key+'-B.png'),b.png);
            fs.writeFileSync(path.join(q,key+'-mask.png'),d.mask);fs.writeFileSync(path.join(q,key+'-heatmap.png'),d.heat);
            const ca=crop(d.A,d.boundingBox),cb=crop(d.B,d.boundingBox),ch=crop(PNG.sync.read(d.heat),d.boundingBox);
            if(ca)fs.writeFileSync(path.join(q,key+'-A-crop.png'),ca);
            if(cb)fs.writeFileSync(path.join(q,key+'-B-crop.png'),cb);
            if(ch)fs.writeFileSync(path.join(q,key+'-diff-crop.png'),ch);
          }
          
          async function launch(){
            const b=await chromium.launch({headless:true,args:ARGS});
            if(b.version()!==EXPECTED_CHROMIUM){await b.close();throw new Error('BROWSER_VERSION_DRIFT expected '+EXPECTED_CHROMIUM+' got '+b.version())}
            return b;
          }
          
          async function installAudit(ctx){
            await ctx.addInitScript(()=>{
              window.__quietAudit={mutations:[],layoutShifts:[],layoutSupported:true};
              document.addEventListener('DOMContentLoaded',()=>{
                const mo=new MutationObserver(list=>{
                  for(const m of list)window.__quietAudit.mutations.push({type:m.type,target:m.target?.nodeName||null,attributeName:m.attributeName||null,added:m.addedNodes?.length||0,removed:m.removedNodes?.length||0});
                });
                mo.observe(document.documentElement,{subtree:true,childList:true,attributes:true,characterData:true});
              },{once:true});
              try{
                new PerformanceObserver(list=>{
                  for(const e of list.getEntries())window.__quietAudit.layoutShifts.push({value:e.value,hadRecentInput:e.hadRecentInput,sources:(e.sources||[]).map(s=>({node:s.node?.nodeName||null,previousRect:s.previousRect?{x:s.previousRect.x,y:s.previousRect.y,width:s.previousRect.width,height:s.previousRect.height}:null,currentRect:s.currentRect?{x:s.currentRect.x,y:s.currentRect.y,width:s.currentRect.width,height:s.currentRect.height}:null}))});
                }).observe({type:'layout-shift',buffered:true});
              }catch{window.__quietAudit.layoutSupported=false}
            });
          }
          
          async function installNetworkPolicy(ctx,origin,net){
