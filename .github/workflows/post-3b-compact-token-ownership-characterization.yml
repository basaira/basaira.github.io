name: Post-3B Compact Token Ownership Characterization

on:
  push:
    branches:
      - 'basair/post-3b-compact-token-ownership-characterization'

permissions:
  contents: read
  actions: read

env:
  MAIN_SHA: f66f41a1e4bef0cf3af4f63240727a482bdda7c5
  MAIN_TREE: 26f1b18a0696b7f78963011a5d6b23474d70d9e6
  LIVE_GH_SHA: 7aa30485b1c03763a8f3e0618c81f49724a8e95b
  LIVE_GH_TREE: 7788867bf3aa1e0c716cb3c6255431274710706c

jobs:
  characterize:
    name: compact-token-ownership-read-only-characterization
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout evidence tooling
        uses: actions/checkout@v4
        with:
          ref: basair/post-3b-compact-token-ownership-characterization
          path: evidence
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: f66f41a1e4bef0cf3af4f63240727a482bdda7c5
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Freeze authorities
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/compact-characterization"
          mkdir -p "${OUT}"

          read_ref() {
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/$1" | jq -r '.object.sha'
          }

          MAIN="$(read_ref main)"
          FINAL="$(read_ref basair/phase-3b-5-hero-delight-animate-exact-concat)"
          GH="$(read_ref gh-pages)"
          MAIN_GIT="$(curl --fail --silent --show-error --location -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${MAIN}")"
          GH_GIT="$(curl --fail --silent --show-error --location -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${GH}")"
          MAIN_REMOTE_TREE="$(jq -r '.tree.sha' <<<"${MAIN_GIT}")"
          GH_REMOTE_TREE="$(jq -r '.tree.sha' <<<"${GH_GIT}")"

          jq -n \
            --arg main "${MAIN}" --arg final "${FINAL}" --arg gh "${GH}" \
            --arg mainTree "${MAIN_REMOTE_TREE}" --arg ghTree "${GH_REMOTE_TREE}" \
            --arg localHead "$(git -C source rev-parse HEAD)" --arg localTree "$(git -C source rev-parse HEAD^{tree})" \
            '{main:$main,final:$final,gh_pages:$gh,main_tree:$mainTree,gh_pages_tree:$ghTree,local_head:$localHead,local_tree:$localTree}' \
            | tee "${OUT}/frozen-authorities.json"

          test "${MAIN}" = "${MAIN_SHA}"
          test "${FINAL}" = "${MAIN_SHA}"
          test "${GH}" = "${LIVE_GH_SHA}"
          test "${MAIN_REMOTE_TREE}" = "${MAIN_TREE}"
          test "${GH_REMOTE_TREE}" = "${LIVE_GH_TREE}"
          test "$(git -C source rev-parse HEAD)" = "${MAIN_SHA}"
          test "$(git -C source rev-parse HEAD^{tree})" = "${MAIN_TREE}"

      - name: Fresh baseline verification and build
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/compact-characterization"
          (
            cd source
            node scripts/verify-css-consolidation-preflight.mjs --expected-css-count=51 2>&1 | tee "${OUT}/baseline-css-preflight.txt"
            npm ci 2>&1 | tee "${OUT}/baseline-npm-ci.txt"
            npm run verify 2>&1 | tee "${OUT}/baseline-npm-verify.txt"
            npm run build 2>&1 | tee "${OUT}/baseline-npm-build.txt"
            node token-authority-check.mjs 2>&1 | tee "${OUT}/baseline-token-authority.txt"
            git diff --check
            git diff --exit-code
            test -z "$(git status --porcelain)"
          )
          mv source/dist "${RUNNER_TEMP}/baseline-dist"

      - name: Static ownership and current manifest analysis
        shell: bash
        run: |
          set -euo pipefail
          node evidence/scripts/evidence/compact-token-characterization.mjs static source "${RUNNER_TEMP}/compact-characterization/compact-token-static-analysis.json"

      - name: Prepare remove-earlier-owner simulation only
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/compact-characterization"
          rsync -a --exclude node_modules --exclude dist source/ "${RUNNER_TEMP}/candidate/"
          ln -s "${GITHUB_WORKSPACE}/source/node_modules" "${RUNNER_TEMP}/candidate/node_modules"

          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'candidate'/'tokens-public-compat.css'
          text=p.read_text()
          needle='  --layout-section-compact: var(--space-layout-section-compact);\n'
          count=text.count(needle)
          if count != 1:
              raise SystemExit(f'expected exactly one removable early declaration, found {count}')
          p.write_text(text.replace(needle,'',1))
          PY

          diff -u source/tokens-public-compat.css "${RUNNER_TEMP}/candidate/tokens-public-compat.css" | tee "${OUT}/simulation-only.diff" || true

          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'compact-characterization'/'simulation-only.diff'
          lines=p.read_text().splitlines()
          removed=[x for x in lines if x.startswith('-') and not x.startswith('---')]
          added=[x for x in lines if x.startswith('+') and not x.startswith('+++')]
          expected=['-  --layout-section-compact: var(--space-layout-section-compact);']
          if removed != expected or added:
              raise SystemExit(f'unexpected simulation diff: removed={removed}, added={added}')
          PY

          (
            cd "${RUNNER_TEMP}/candidate"
            npm run build 2>&1 | tee "${OUT}/candidate-npm-build.txt"
          )
          mv "${RUNNER_TEMP}/candidate/dist" "${RUNNER_TEMP}/candidate-dist"

      - name: Install disposable Chromium
        shell: bash
        run: |
          set -euo pipefail
          PW="${RUNNER_TEMP}/compact-pw"
          mkdir -p "${PW}"
          cp evidence/scripts/evidence/compact-token-characterization.mjs "${PW}/characterize.mjs"
          cd "${PW}"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start baseline and candidate source and dist servers
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/compact-characterization"
          (cd source && npm run dev -- --host 127.0.0.1 --port 4173 --strictPort >"${OUT}/baseline-dev.log" 2>&1) &
          echo $! >"${RUNNER_TEMP}/baseline-dev.pid"
          (cd "${RUNNER_TEMP}/candidate" && npm run dev -- --host 127.0.0.1 --port 4174 --strictPort >"${OUT}/candidate-dev.log" 2>&1) &
          echo $! >"${RUNNER_TEMP}/candidate-dev.pid"
          python3 -m http.server 4175 --bind 127.0.0.1 --directory "${RUNNER_TEMP}/baseline-dist" >"${OUT}/baseline-dist-server.log" 2>&1 &
          echo $! >"${RUNNER_TEMP}/baseline-dist.pid"
          python3 -m http.server 4176 --bind 127.0.0.1 --directory "${RUNNER_TEMP}/candidate-dist" >"${OUT}/candidate-dist-server.log" 2>&1 &
          echo $! >"${RUNNER_TEMP}/candidate-dist.pid"

          for port in 4173 4174 4175 4176; do
            ok=0
            for i in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:${port}/" >/dev/null; then ok=1; break; fi
              sleep 1
            done
            test "${ok}" = 1
          done

      - name: CSSOM provenance scan on all production routes
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/compact-pw"
          node characterize.mjs provenance "${RUNNER_TEMP}/compact-characterization/compact-token-runtime-ownership.json"

      - name: Responsive remove-earlier-owner simulation matrix
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/compact-pw"
          node characterize.mjs responsive "${RUNNER_TEMP}/compact-characterization/compact-token-responsive-matrix.json" "${RUNNER_TEMP}/compact-characterization/screenshots"

      - name: Produce characterization disposition
        shell: bash
        run: |
          set -euo pipefail
          node evidence/scripts/evidence/compact-token-characterization.mjs summary "${RUNNER_TEMP}/compact-characterization"

      - name: Project exact contract evidence files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, hashlib, subprocess, pathlib, os
          O=pathlib.Path(os.environ['RUNNER_TEMP'])/'compact-characterization'
          S=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'source'
          C=pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate'
          T='--layout-section-compact'; K='--space-layout-section-compact'
          E='tokens-public-compat.css'; L='visual-layout-hotfix-v2.css'
          def J(name,obj): (O/name).write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n')
          def R(name): return json.loads((O/name).read_text())
          def H(p): return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          files=subprocess.check_output(['git','-C',str(S),'ls-files'],text=True).splitlines()
          X={}
          for f in files:
            if pathlib.Path(f).suffix.lower() not in {'.css','.html','.js','.mjs','.ts','.json','.md','.yml','.yaml'}: continue
            try: X[f]=(S/f).read_text()
            except UnicodeDecodeError: pass
          def hits(term):
            out=[]
            for f,t in X.items():
              for i,line in enumerate(t.splitlines(),1):
                if term in line: out.append({'path':f,'line':i,'text':line.strip()})
            return out
          A=R('compact-token-static-analysis.json'); RT=R('compact-token-runtime-ownership.json'); M=R('compact-token-responsive-matrix.json')
          raw={q:hits(q) for q in [T,K,E,L]}
          D=[x for x in hits(T) if re.search(re.escape(T)+r'\s*:',x['text'])]
          U=[x for x in hits(T) if re.search(r'var\(\s*'+re.escape(T)+r'(?:\s*[,)]|\s)',x['text'])]
          KD=[x for x in hits(K) if re.search(re.escape(K)+r'\s*:',x['text'])]
          KU=[x for x in hits(K) if re.search(r'var\(\s*'+re.escape(K)+r'(?:\s*[,)]|\s)',x['text'])]
          currentBlobs={f:subprocess.check_output(['git','-C',str(S),'rev-parse','HEAD:'+f],text=True).strip() for f in [E,L]}
          historicalBlobs={f:subprocess.check_output(['git','-C',str(S),'rev-parse','e72fc5b2bfa073806e514cd7a05fdab6315a1df7:'+f],text=True).strip() for f in [E,L]}
          inventory={'token':T,'canonicalToken':K,'declarations':D,'consumers':U,'canonicalDeclarations':KD,'canonicalConsumers':KU,'rawMentions':raw,'jsMjsTsReferences':[x for q in raw.values() for x in q if pathlib.Path(x['path']).suffix.lower() in {'.js','.mjs','.ts'}],'testVerifierReferences':[x for q in raw.values() for x in q if re.search(r'(scripts/|verify|check|test)',x['path'],re.I)],'documentationEvidenceReferences':[x for q in raw.values() for x in q if pathlib.Path(x['path']).suffix.lower() in {'.md','.json'} or 'evidence' in x['path'].lower()],'ownerBlobShas':currentBlobs,'historicalOwnerBlobShas':historicalBlobs,'ownerBlobsUnchangedFromPhase3B4':currentBlobs==historicalBlobs,'manifest':A['manifest']}
          J('compact-token-static-inventory.json',inventory)
          patterns=['getPropertyValue','setProperty','getComputedStyle','document.styleSheets','cssRules','CSSStyleSheet','insertRule','deleteRule','querySelector']
          mechanism={p:[] for p in patterns}; specific=[]; filenames=[]
          for f,t in X.items():
            if pathlib.Path(f).suffix.lower() not in {'.html','.js','.mjs','.ts'} or f.startswith('scripts/'): continue
            for i,line in enumerate(t.splitlines(),1):
              for p in patterns:
                if p in line: mechanism[p].append({'path':f,'line':i,'text':line.strip()})
              if T in line or K in line: specific.append({'path':f,'line':i,'text':line.strip()})
              if E in line or L in line: filenames.append({'path':f,'line':i,'text':line.strip()})
          J('compact-token-runtime-scan.json',{'mechanismHits':mechanism,'tokenSpecificRuntimeReferences':specific,'runtimeStylesheetFilenameReferences':filenames,'unexplainedDependency':bool(specific or filenames)})
          J('compact-token-route-ownership.json',{'routes':A['routeOwnership'],'routesOwningBoth':A['routesOwningBoth']})
          J('compact-token-source-variant.json',{'head':subprocess.check_output(['git','-C',str(S),'rev-parse','HEAD'],text=True).strip(),'tree':subprocess.check_output(['git','-C',str(S),'rev-parse','HEAD^{tree}'],text=True).strip(),'earlySha256':H(S/E),'lateSha256':H(S/L),'earlyDeclarationPresent':T in (S/E).read_text(),'lateDeclarationPresent':T in (S/L).read_text()})
          J('compact-token-candidate-variant.json',{'earlySha256':H(C/E),'lateSha256':H(C/L),'earlyDeclarationPresent':T in (C/E).read_text(),'lateDeclarationPresent':T in (C/L).read_text(),'lateByteIdentical':(S/L).read_bytes()==(C/L).read_bytes(),'diff':(O/'simulation-only.diff').read_text()})
          ownerMap={(x['variant'],x['route']):x['owners'] for x in RT['rows'] if x['route'] in RT['owningRoutes']}
          prov=[]
          for p in M['pairs']:
            prov.append({'route':p['route'],'width':p['width'],'lang':p['lang'],'baseline':{'raw':p['baseline']['tokenRaw'],'canonical':p['baseline']['canonicalRaw'],'px':p['baseline']['tokenPx'],'owners':ownerMap.get(('baseline',p['route']),[]),'winningDeclaration':L},'candidate':{'raw':p['candidate']['tokenRaw'],'canonical':p['candidate']['canonicalRaw'],'px':p['candidate']['tokenPx'],'owners':ownerMap.get(('candidate',p['route']),[]),'winningDeclaration':L},'equal':p['checks']['tokenRawEqual'] and p['checks']['tokenResolvedPxEqual']})
          J('compact-token-computed-provenance.json',{'states':prov})
          J('compact-token-geometry-comparison.json',{'tolerancePx':0.05,'properties':['x','y','width','height','padding-top','padding-bottom','margin-top','margin-bottom','gap','row-gap','column-gap','grid-template-columns','transform'],'pairs':[{'route':p['route'],'width':p['width'],'lang':p['lang'],'pass':p['checks']['geometryEqual'],'maxDelta':p['maxGeometryDelta'],'changedCount':p['changedGeometryCount'],'baseline':p['baseline']['structuralSelectors'],'candidate':p['candidate']['structuralSelectors']} for p in M['pairs']]})
          J('compact-token-browser-matrix.json',{'routes':M['routes'],'widths':M['widths'],'langs':M['langs'],'stateCount':M['stateCount'],'allPass':M['allPass'],'pairs':M['pairs'],'blockedExternalRequests':M.get('blockedRequests',[])})
          hist={'phase3B4Run':34989128726,'artifact':10405126530,'historical':{'declarations':2,'cssConsumers':0,'runtimeConsumers':0,'earlierRemovalPreserves':True,'laterRemovalChanges':True,'bothRemovalClears':True,'widths':[1440,1200,1121,1120,1119,768,767,766,390]},'fresh':{'declarations':len(D),'consumers':len(U),'earlierRemovalPreserves':M['allPass'],'ownerBlobsUnchanged':currentBlobs==historicalBlobs}}
          hist['agrees']=hist['fresh']['declarations']==2 and hist['fresh']['consumers']==0 and hist['fresh']['earlierRemovalPreserves'] and hist['fresh']['ownerBlobsUnchanged']
          J('compact-token-historical-reconciliation.json',hist)
          Q=R('compact-token-characterization-summary.json')
          pre=(O/'baseline-css-preflight.txt').read_text(); tc=(O/'baseline-token-authority.txt').read_text()
          runtimeScan=R('compact-token-runtime-scan.json')
          expectedWidths=[390,766,767,768,1119,1120,1121,1200,1440]
          ok=(len(D)==2 and sorted({x['path'] for x in D})==sorted([E,L]) and len(U)==0 and not runtimeScan['unexplainedDependency'] and currentBlobs==historicalBlobs and A['routesOwningBoth']==['/'] and M['widths']==expectedWidths and M['stateCount']==len(M['routes'])*len(expectedWidths)*len(M['langs']) and M['allPass'] and hist['agrees'] and 'productionCss=51; canonical=106' in pre and 'aliases A/B/C/D/E=1/49/23/23/2; corrected conflicts=40; production CSS=51; inline styles=1' in tc)
          required=['compact-token-static-inventory.json','compact-token-runtime-scan.json','compact-token-route-ownership.json','compact-token-source-variant.json','compact-token-candidate-variant.json','compact-token-computed-provenance.json','compact-token-geometry-comparison.json','compact-token-browser-matrix.json','compact-token-historical-reconciliation.json','compact-token-characterization-summary.json']
          Q.update({'manifestTruth':A['manifest'],'contractComplete':ok,'requiredEvidenceFiles':required,'disposition':('B \u2014 SAFE MUTATION DESIGN: REMOVE EARLIER OWNER ONLY' if ok else 'C \u2014 DEFER / BLOCK'),'characterization':('READY FOR FINAL CLOSURE REVIEW' if ok else 'BLOCKED / DEFERRED'),'implementation':'NOT AUTHORIZED','nextPossibleGate':('COMPACT TOKEN OWNERSHIP IMPLEMENTATION AUTHORIZATION REVIEW' if ok else None)})
          J('compact-token-characterization-summary.json',Q)
          if not ok or any(not (O/f).exists() for f in required): raise SystemExit('contract evidence assertion failure')
          print(json.dumps({'PASS':True,'widths':M['widths'],'states':M['stateCount'],'disposition':Q['disposition']},indent=2))
          PY

      - name: Terminal authority check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/compact-characterization"
          read_ref() {
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/$1" | jq -r '.object.sha'
          }
          MAIN="$(read_ref main)"
          FINAL="$(read_ref basair/phase-3b-5-hero-delight-animate-exact-concat)"
          GH="$(read_ref gh-pages)"
          jq -n --arg main "${MAIN}" --arg final "${FINAL}" --arg gh "${GH}" '{main:$main,final:$final,gh_pages:$gh}' | tee "${OUT}/terminal-authorities.json"
          test "${MAIN}" = "${MAIN_SHA}"
          test "${FINAL}" = "${MAIN_SHA}"
          test "${GH}" = "${LIVE_GH_SHA}"

      - name: Stop local servers
        if: always()
        shell: bash
        run: |
          for f in baseline-dev candidate-dev baseline-dist candidate-dist; do
            if [ -f "${RUNNER_TEMP}/${f}.pid" ]; then
              kill "$(cat "${RUNNER_TEMP}/${f}.pid")" 2>/dev/null || true
            fi
          done

      - name: Upload characterization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-3b-compact-token-ownership-characterization
          path: ${{ runner.temp }}/compact-characterization/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
