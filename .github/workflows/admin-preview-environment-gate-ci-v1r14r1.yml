name: BASAIR V1R14-R1 Environment Gate Repair — Read-Only CI
on:
  push:
    branches:
      - basair/admin-preview-environment-gate-repair-v1r14r1
permissions:
  contents: read
jobs:
  v1r14-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22.16.0 and npm 10.9.2
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Verify frozen V1R13 lineage and five exact source files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse a39bf71c3c653c19e98759dcb9bd7cee5f3f3881^{tree})" = 0af829fa339495934a66e0a54a44a9169433f3cc
          test "$(git rev-parse fe93498beadf3d4f6efe65acc63559741e0f7006^{tree})" = 90caf98980935a1c98010a33fbb39510bd3e28d4
          test "$(git rev-parse 8e540f90bf1e63098374d7d34e4142ed8298f797^{tree})" = e614720f959465e607c1668ee32396cd02bf437c
          test "$(git rev-parse 2fd0973b2ff68f0ba960ff2aa83d3520d9c3c243^{tree})" = 09aa7bd7325e7c078cc817f0790402a5667a3644
          test "$(git rev-parse cef59ba05b3382978b4c18e83592f08227b2f9c4^{commit})" = cef59ba05b3382978b4c18e83592f08227b2f9c4
          git merge-base --is-ancestor a39bf71c3c653c19e98759dcb9bd7cee5f3f3881 HEAD
          test "$(git diff --name-only a39bf71c3c653c19e98759dcb9bd7cee5f3f3881 HEAD | wc -l)" -eq 4
          while IFS= read -r file; do
            case "$file" in
              scripts/admin-preview-guards-v1r14.mjs|tests/admin-preview-guards-v1r14.mjs|.github/workflows/admin-preview-environment-gate-ci-v1r14r1.yml|docs/admin-preview-environment-gate-repair-v1r14r1.md) ;;
              *) echo "UNAUTHORIZED_V1R14_R1_CHANGE $file"; exit 1 ;;
            esac
          done < <(git diff --name-only a39bf71c3c653c19e98759dcb9bd7cee5f3f3881 HEAD)
          git diff --exit-code a39bf71c3c653c19e98759dcb9bd7cee5f3f3881 HEAD -- package.json package-lock.json admin.js admin.html firebase.json .firebaserc firestore.rules
          node --check scripts/admin-preview-guards-v1r14.mjs
          node tests/admin-preview-guards-v1r14.mjs
          node tests/admin-vite-security-contract-v1r13.mjs
          node tests/admin-preview-manual-contract-v1r12r2.mjs
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Reproducible build and fail-closed vulnerability audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = v22.16.0
          test "$(npm -v)" = 10.9.2
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = 62a543b624975ff938f77490ffcedd17a5771176af5a63e9e20809429013525a
          npm ci
          npm ls vite
          npm audit --json > "$RUNNER_TEMP/v1r14r1-audit.json" || true
          node -e 'const a=require(process.env.RUNNER_TEMP+"/v1r14r1-audit.json");console.log("V1R14_AUDIT="+JSON.stringify(a.metadata?.vulnerabilities));if(a.metadata?.vulnerabilities?.total!==0)process.exit(1)'
          npm run verify
          BASAIR_NPM_VERSION="$(npm --version)" node tests/admin-only-asset-closure-v1r10r1.mjs
          BASAIR_NPM_VERSION="$(npm --version)" node scripts/admin-dedicated-hosting-candidate-v1r11.mjs
          node tests/admin-dedicated-hosting-contract-v1r11.mjs
          node tests/admin-preview-target-guard-v1r12.mjs
          test -z "$(git status --porcelain)"
      - name: Separate tooling audit and real LOCAL Chromium frame security
        shell: bash
        run: |
          set -euo pipefail
          export BASAIR_TEST_TOOLS="$RUNNER_TEMP/v1r14-playwright"
          npm install --prefix "$BASAIR_TEST_TOOLS" --save-exact --no-audit playwright@1.55.1
          npm audit --prefix "$BASAIR_TEST_TOOLS" --json > "$RUNNER_TEMP/v1r14r1-tool-audit.json" || true
          node -e 'const a=require(process.env.RUNNER_TEMP+"/v1r14r1-tool-audit.json");console.log("V1R14_TOOL_AUDIT="+JSON.stringify(a.metadata?.vulnerabilities));if(a.metadata?.vulnerabilities?.total!==0)process.exit(1)'
          "$BASAIR_TEST_TOOLS/node_modules/.bin/playwright" install --with-deps chromium
          BASAIR_ADMIN_ONLY_DIR="$RUNNER_TEMP/basair-v1r11-candidate/admin-only" node tests/admin-http-frame-proof-v1r10r1.mjs
          test -z "$(git status --porcelain)"
          echo V1R14_R1_READ_ONLY_NO_CLOUD_CREDENTIALS_NO_DEPLOYMENT=PASS
      - name: Report final source identity
        if: always()
        run: |
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          git diff --name-only a39bf71c3c653c19e98759dcb9bd7cee5f3f3881 HEAD
      - name: Store evidence JSON only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basair-v1r14r1-readonly-qualification
          path: |
            ${{ runner.temp }}/v1r14r1-audit.json
            ${{ runner.temp }}/v1r14r1-tool-audit.json
            ${{ runner.temp }}/v1r10r1-asset-manifest.json
            ${{ runner.temp }}/v1r11-candidate-summary.json
            ${{ runner.temp }}/v1r12-preview-preflight.json
            ${{ runner.temp }}/v1r10r1-http-frame-proof.json
          retention-days: 7
          if-no-files-found: warn
