name: Phase 3B-2C Form-State Characterization

on:
  push:
    branches:
      - basair/phase-3b-2c-form-state-characterization-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout evidence infrastructure
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify authoritative source and source gates
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=6de74b2271b937823d63ac33909cc36fe8e73662
          SOURCE_TREE=d99acf85fabd717ddac495e63092f4f0728a9b3c
          SOURCE_BRANCH=basair/phase-3b-2c-form-state-characterization
          CLOSED_BRANCH=basair/phase-3b-1-acquisition-precision-polish-merge
          IMPLEMENTATION_PARENT=37e2e6e85d695efcc346d7f35619f6a76eb9aac3
          git fetch --all --prune
          test "$(git rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/$CLOSED_BRANCH)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test "$(git rev-parse "$SOURCE_SHA^1")" = "$IMPLEMENTATION_PARENT"
          test "$(git merge-base "origin/$SOURCE_BRANCH" "origin/$CLOSED_BRANCH")" = "$SOURCE_SHA"
          rm -rf /tmp/basair-3b2c-source /tmp/basair-3b2c-synth /tmp/phase3b2c-out /tmp/phase3b2c-harness
          git worktree add --detach /tmp/basair-3b2c-source "$SOURCE_SHA"
          cd /tmp/basair-3b2c-source
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(git rev-parse HEAD^1)" = "$IMPLEMENTATION_PARENT"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$SOURCE_BRANCH)"
          test -z "$(git status --porcelain)"
          echo SOURCE_IDENTITY_PASS_HEAD=$(git rev-parse HEAD)
          echo SOURCE_IDENTITY_PASS_TREE=$(git rev-parse HEAD^{tree})
          echo SOURCE_IDENTITY_PASS_PARENT=$(git rev-parse HEAD^1)
          echo SOURCE_MERGE_BASE_PASS=$(git merge-base HEAD "origin/$CLOSED_BRANCH")
          echo SOURCE_LOCAL_REMOTE_EQUAL_PASS
          node scripts/verify-css-consolidation-preflight.mjs --expected-css-count=54
          echo SOURCE_PREFLIGHT_PASS
          npm ci
          echo SOURCE_NPM_CI_PASS
          npm run verify
          echo SOURCE_VERIFY_PASS
          npm run build
          echo SOURCE_BUILD_PASS
          git diff --check
          echo SOURCE_DIFF_CHECK_PASS
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo SOURCE_TRACKED_CLEAN_PASS
          git clean -fdX
          test -z "$(git status --porcelain)"
          echo SOURCE_CLEAN_FOR_CHARACTERIZATION_PASS

      - name: Install and patch isolated harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase3b2c-harness
          cd /tmp/phase3b2c-harness
          npm init -y >/dev/null
          npm install --no-audit --no-fund puppeteer-core@24.16.0 postcss@8.5.6 postcss-selector-parser@7.1.0
          cp "$GITHUB_WORKSPACE/scripts/evidence/phase-3b2c-characterize.mjs" ./characterize.mjs
          python3 <<'PY'
          from pathlib import Path
          p=Path('/tmp/phase3b2c-harness/characterize.mjs')
          s=p.read_text()

          old="const browser=await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox','--disable-setuid-sandbox']});"
          new="const browser=await puppeteer.launch({headless:true,executablePath,protocolTimeout:600000,args:['--no-sandbox','--disable-setuid-sandbox']});"
          assert old in s
          s=s.replace(old,new,1)

          old_freeze="async function freeze(p){ await p.addStyleTag({content:'*,*::before,*::after{transition-duration:0s!important;transition-delay:0s!important;animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important;}'}); }"
          new_freeze="""async function freeze(p){
            await p.evaluate(()=>{
              if(document.getElementById('__phase3b2c_freeze')) return;
              const style=document.createElement('style');
              style.id='__phase3b2c_freeze';
              style.textContent='*,*::before,*::after{transition-duration:0s!important;transition-delay:0s!important;animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important;}';
              document.documentElement.appendChild(style);
            });
          }"""
          assert old_freeze in s
          s=s.replace(old_freeze,new_freeze,1)

          marker='async function applyState(p,state){'
          reset=r'''async function resetState(p){
            try{await p.mouse.up();}catch{}
            try{await p.mouse.move(1,1);}catch{}
            await p.evaluate(()=>{
              const f=document.querySelector('.overdrive-form'); if(!f)return;
              f.removeAttribute('data-overdrive-submit-state');
              for(const field of f.querySelectorAll('.overdrive-field'))field.classList.remove('is-focused','is-valid','is-invalid');
              for(const el of f.querySelectorAll('input,textarea,select,[type="submit"]')){
                el.removeAttribute('aria-invalid');el.removeAttribute('aria-disabled');el.removeAttribute('aria-busy');el.classList.remove('is-loading');
                if('disabled' in el)el.disabled=false;
                if(el.matches('select'))el.selectedIndex=0;
                else if(el.matches('input[type="checkbox"],input[type="radio"]'))el.checked=false;
                else if(!el.matches('[type="submit"],[type="button"],[type="hidden"]'))el.value='';
              }
              document.activeElement?.blur?.();
              document.querySelector('#success-message')?.classList.add('hidden');
              document.querySelector('#error-message')?.classList.add('hidden');
              document.querySelector('#form-status')?.classList.remove('show','success','error');
              document.querySelector('#post-submit')?.classList.remove('show');
            });
          }
          async function pointFor(p,selector){
            return p.evaluate((selector)=>{
              const el=document.querySelector(selector); if(!el)return null;
              const r=el.getBoundingClientRect();
              if(!r.width&&!r.height)return null;
              return {x:r.left+r.width/2,y:r.top+r.height/2};
            },selector);
          }
          async function tabTo(p,selector){
            await p.evaluate(()=>document.activeElement?.blur?.());
            for(let i=0;i<160;i++){
              await p.keyboard.press('Tab');
              const hit=await p.evaluate((selector)=>document.activeElement?.matches?.(selector)===true,selector);
              if(hit)return true;
            }
            return false;
          }
          '''
          assert marker in s
          s=s.replace(marker,reset+marker,1)

          cap_old="hasForcedColorsCss:[...document.styleSheets].some(ss=>{try{return [...ss.cssRules].some(r=>String(r.conditionText||'').includes('forced-colors'));}catch{return false;}})"
          cap_new="capabilities:{pointerFine:matchMedia('(pointer: fine)').matches,pointerCoarse:matchMedia('(pointer: coarse)').matches,hoverHover:matchMedia('(hover: hover)').matches,hoverNone:matchMedia('(hover: none)').matches},hasForcedColorsCss:[...document.styleSheets].some(ss=>{try{return [...ss.cssRules].some(r=>String(r.conditionText||'').includes('forced-colors'));}catch{return false;}})"
          assert cap_old in s
          s=s.replace(cap_old,cap_new,1)

          vars_old="const email=f.querySelector('input[type=\"email\"]'); const text=f.querySelector('input:not([type=\"hidden\"]):not([type=\"submit\"]),textarea');\n    const select=f.querySelector('select'); const submit=f.querySelector('[type=\"submit\"]');"
          vars_new="const email=f.querySelector('input[type=\"email\"]'); const tel=f.querySelector('input[type=\"tel\"],input[inputmode=\"tel\"]'); const text=f.querySelector('input:not([type=\"hidden\"]):not([type=\"submit\"]),textarea'); const textarea=f.querySelector('textarea');\n    const select=f.querySelector('select'); const submit=f.querySelector('[type=\"submit\"]');"
          assert vars_old in s
          s=s.replace(vars_old,vars_new,1)

          focus_old="if(state==='focus-control'){control?.focus(); first?.classList.add('is-focused');}\n    if(state==='focus-select'){select?.focus(); select?.closest('.overdrive-field')?.classList.add('is-focused');}\n    if(state==='partial'){setValue(text,'A');}\n    if(state==='valid'){setValue(text,'Basair Test'); first?.classList.add('is-valid');}"
          focus_new="""if(state==='focus-control'){control?.focus(); first?.classList.add('is-focused');}
    if(state==='focus-select'){select?.focus(); select?.closest('.overdrive-field')?.classList.add('is-focused');}
    if(state==='focus-textarea'){textarea?.focus(); textarea?.closest('.overdrive-field')?.classList.add('is-focused');}
    if(state==='partial'){setValue(text,'A');}
    if(state==='filled-textarea'){setValue(textarea,'Characterization text'); textarea?.closest('.overdrive-field')?.classList.add('is-valid');}
    if(state==='filled-email'){setValue(email,'test@example.test'); email?.closest('.overdrive-field')?.classList.add('is-valid');}
    if(state==='filled-tel'){setValue(tel,'+201000000000'); tel?.closest('.overdrive-field')?.classList.add('is-valid');}
    if(state==='select-changed'&&select){select.selectedIndex=Math.min(1,select.options.length-1);select.dispatchEvent(new Event('change',{bubbles:true}));select.closest('.overdrive-field')?.classList.add('is-valid');}
    if(state==='contact-combo'){setValue(email,'test@example.test');setValue(tel,'+201000000000');if(select){select.selectedIndex=Math.min(1,select.options.length-1);select.dispatchEvent(new Event('change',{bubbles:true}));}email?.closest('.overdrive-field')?.classList.add('is-valid');tel?.closest('.overdrive-field')?.classList.add('is-valid');}
    if(state==='valid'){setValue(text,'Basair Test'); first?.classList.add('is-valid');}"""
          assert focus_old in s
          s=s.replace(focus_old,focus_new,1)

          busy_old="if(state==='busy'){f.dataset.overdriveSubmitState='submitting';submit?.classList.add('is-loading');submit?.setAttribute('aria-busy','true');}\n    if(state==='success')"
          busy_new="if(state==='busy'){f.dataset.overdriveSubmitState='submitting';submit?.setAttribute('aria-busy','true');}\n    if(state==='loading'){f.dataset.overdriveSubmitState='submitting';submit?.classList.add('is-loading');}\n    if(state==='success')"
          assert busy_old in s
          s=s.replace(busy_old,busy_new,1)

          hover_old="""  if(state==='hover-submit'){await freeze(p); const el=await p.$('.overdrive-form [type=\"submit\"]'); if(el) await el.hover();}
  if(state==='hover-control'){await freeze(p); const el=await p.$('.overdrive-form input:not([type=\"hidden\"]),.overdrive-form textarea,.overdrive-form select'); if(el) await el.hover();}
  if(state==='active-submit'){await freeze(p); const el=await p.$('.overdrive-form [type=\"submit\"]'); if(el){const b=await el.boundingBox();if(b){await p.mouse.move(b.x+b.width/2,b.y+b.height/2);await p.mouse.down();}}}
"""
          hover_new="""  if(state==='focus-visible-control') await tabTo(p,'.overdrive-form input:not([type=\"hidden\"]),.overdrive-form textarea,.overdrive-form select');
  if(state==='focus-visible-submit') await tabTo(p,'.overdrive-form [type=\"submit\"]');
  if(state==='hover-submit'){await freeze(p); const pt=await pointFor(p,'.overdrive-form [type=\"submit\"]'); if(pt) await p.mouse.move(pt.x,pt.y);}
  if(state==='hover-control'){await freeze(p); const pt=await pointFor(p,'.overdrive-form input:not([type=\"hidden\"]),.overdrive-form textarea,.overdrive-form select'); if(pt) await p.mouse.move(pt.x,pt.y);}
  if(state==='active-submit'){await freeze(p); const pt=await pointFor(p,'.overdrive-form [type=\"submit\"]'); if(pt){await p.mouse.move(pt.x,pt.y);await p.mouse.down();}}
"""
          assert hover_old in s
          s=s.replace(hover_old,hover_new,1)

          old_loop="""for(const state of states){
      if(state!=='idle'){await sa.p.reload({waitUntil:'domcontentloaded'});await sb.p.reload({waitUntil:'domcontentloaded'});}"""
          new_loop="""for(const state of states){
      console.log(`PROGRESS ${r.route} ${vp.name} ${state}`);
      if(state!=='idle'){await resetState(sa.p);await resetState(sb.p);}"""
          assert old_loop in s
          s=s.replace(old_loop,new_loop,1)

          states_old="const states=['idle','focus-control','partial','valid','invalid-required','disabled','aria-disabled','busy','success','error','hover-submit','active-submit','hover-control'];\n    if(invA?.selects?.length) states.push('focus-select');\n    if(invA?.inputs?.some(x=>x.type==='email')) states.push('malformed');"
          states_new="""const states=['idle','focus-control','focus-visible-control','partial','valid','invalid-required','disabled','aria-disabled','busy','loading','success','error','hover-submit','active-submit','focus-visible-submit','hover-control'];
    if(invA?.selects?.length) states.push('focus-select','select-changed');
    if(invA?.textareas?.length) states.push('focus-textarea','filled-textarea');
    if(invA?.inputs?.some(x=>x.type==='email')) states.push('malformed','filled-email');
    if(invA?.inputs?.some(x=>x.type==='tel'||x.name==='whatsapp'||x.name==='phone')) states.push('filled-tel');
    if(invA?.inputs?.some(x=>x.type==='email')&&invA?.inputs?.some(x=>x.type==='tel'||x.name==='whatsapp'||x.name==='phone')) states.push('contact-combo');"""
          assert states_old in s
          s=s.replace(states_old,states_new,1)

          val_old="if(['valid','invalid-required','malformed','busy','success','error','disabled','aria-disabled'].includes(state))browserResult.validationStates++;"
          val_new="if(['valid','invalid-required','malformed','busy','loading','success','error','disabled','aria-disabled','filled-email','filled-tel','contact-combo'].includes(state))browserResult.validationStates++;"
          assert val_old in s
          s=s.replace(val_old,val_new,1)

          old='const browserResult={routeCount:routes.length,'
          new="const browserRoutes=routes.filter((_,i)=>i % Number(process.env.SHARD_COUNT||1) === Number(process.env.SHARD_INDEX||0));\nconsole.log(`SHARD ${process.env.SHARD_INDEX||0}/${process.env.SHARD_COUNT||1} routes=${browserRoutes.map(r=>r.route).join(',')}`);\nconst browserResult={routeCount:browserRoutes.length,"
          assert old in s
          s=s.replace(old,new,1)
          idx=s.index('const browserResult=')
          tail=s[idx:]
          assert 'for(const r of routes){' in tail
          tail=tail.replace('for(const r of routes){','for(const r of browserRoutes){',1)
          s=s[:idx]+tail
          p.write_text(s)
          PY
          grep -F 'protocolTimeout:600000' characterize.mjs
          grep -F '__phase3b2c_freeze' characterize.mjs
          grep -F 'focus-visible-submit' characterize.mjs
          grep -F 'contact-combo' characterize.mjs
          grep -F 'pointerCoarse' characterize.mjs
          grep -F 'browserRoutes=routes.filter' characterize.mjs
          grep -F 'for(const r of browserRoutes)' characterize.mjs
          grep -F 'PROGRESS ${r.route} ${vp.name} ${state}' characterize.mjs
          if grep -F 'await el.hover()' characterize.mjs; then exit 1; fi
          if grep -F 'await el.boundingBox()' characterize.mjs; then exit 1; fi
          if grep -F 'await p.addStyleTag' characterize.mjs; then exit 1; fi

      - name: Run source vs synthetic exact-concat characterization shard
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 8
        run: |
          set -euo pipefail
          mkdir -p /tmp/basair-3b2c-synth /tmp/phase3b2c-out
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/basair-3b2c-source >/tmp/source-server.log 2>&1 &
          SOURCE_SERVER=$!
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/basair-3b2c-synth >/tmp/synth-server.log 2>&1 &
          SYNTH_SERVER=$!
          trap 'kill $SOURCE_SERVER $SYNTH_SERVER 2>/dev/null || true' EXIT
          sleep 1
          cd /tmp/phase3b2c-harness
          SOURCE_DIR=/tmp/basair-3b2c-source \
          SYNTH_DIR=/tmp/basair-3b2c-synth \
          OUT_DIR=/tmp/phase3b2c-out \
          SOURCE_SHA=6de74b2271b937823d63ac33909cc36fe8e73662 \
          SOURCE_TREE=d99acf85fabd717ddac495e63092f4f0728a9b3c \
          SHARD_INDEX="$SHARD_INDEX" \
          SHARD_COUNT="$SHARD_COUNT" \
          node characterize.mjs | tee /tmp/phase3b2c-out/console-summary.json
          echo CHARACTERIZATION_SHARD_PASS=$SHARD_INDEX
          cd /tmp/basair-3b2c-source
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo SOURCE_REMAINS_TRACKED_CLEAN_PASS

      - name: Upload characterization evidence shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3b2c-form-characterization-shard-${{ matrix.shard }}
          path: /tmp/phase3b2c-out/
          if-no-files-found: error
          retention-days: 30
