name: Phase 3B-0 Temp Harness History Inspect
on:
  push:
    branches: ["basair/phase-3b-0-consolidation-preflight"]
    paths: [".github/workflows/phase-3b0-temp-inspect.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate historical Phase 2.5 browser harness
        shell: bash
        run: |
          set -euo pipefail
          echo '=== commits touching workflows with puppeteer/browser strings ==='
          git log --all --format='%H %s' -S'puppeteer-core' -- .github/workflows || true
          git log --all --format='%H %s' -S'phase-2.5-browser' -- .github/workflows || true
          echo '=== phase-2.5 first-parent history ==='
          git log --format='%H %s' --all --ancestry-path 1504baad33b2123056877c1e92f4e2d558c00d51..02bc781aec31c0de199c92b88205cc02ad6dc603 | head -30
          echo '=== candidate workflow names in historical commits ==='
          for c in $(git log --format='%H' --all --ancestry-path 1504baad33b2123056877c1e92f4e2d558c00d51..02bc781aec31c0de199c92b88205cc02ad6dc603); do
            git ls-tree -r --name-only "$c" .github/workflows 2>/dev/null | sed "s#^#$c #" || true
          done | sort -u | tail -80
