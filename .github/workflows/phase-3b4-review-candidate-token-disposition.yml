name: Phase 3B-4 Review-Candidate Token Disposition

on:
  push:
    branches:
      - basair/phase-3b-4-review-candidate-token-disposition-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: e72fc5b2bfa073806e514cd7a05fdab6315a1df7
      BASE_TREE: 805265ffc0d24238490948c48830e329d6cba644
      BASE_PARENT: a4671e5f4aa6ecc56fbf1b0b619e26fcb105f22f
      SOURCE_BRANCH: basair/phase-3b-4-review-candidate-token-disposition
      EVIDENCE_BRANCH: basair/phase-3b-4-review-candidate-token-disposition-evidence

    steps:
      - name: Checkout evidence harness
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-4-review-candidate-token-disposition-evidence
          fetch-depth: 0
          path: evidence

      - name: Checkout authoritative source
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-4-review-candidate-token-disposition
          fetch-depth: 0
          path: source

      - name: Verify source identity and evidence isolation
        shell: bash
        run: |
          set -euo pipefail
          git -C source fetch origin "$SOURCE_BRANCH" "$EVIDENCE_BRANCH"
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$BASE_TREE"
          test "$(git -C source rev-parse HEAD^1)" = "$BASE_PARENT"
          test "$(git -C source merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$BASE_SHA"
          test -z "$(git -C source status --porcelain)"
          printf '%s\n' \
            .github/workflows/phase-3b4-review-candidate-token-disposition.yml \
            scripts/evidence/phase-3b4-review-candidate-token-disposition.mjs \
            scripts/evidence/phase-3b4-browser-token-disposition.mjs \
            | sort > /tmp/allowed-evidence-paths
          git -C evidence diff --name-only "$BASE_SHA"..HEAD | sort > /tmp/actual-evidence-paths
          diff -u /tmp/allowed-evidence-paths /tmp/actual-evidence-paths
          echo BRANCH_IDENTITY_PASS
          echo SOURCE_HEAD=$(git -C source rev-parse HEAD)
          echo SOURCE_TREE=$(git -C source rev-parse HEAD^{tree})
          echo SOURCE_PARENT=$(git -C source rev-parse HEAD^1)
          echo SOURCE_MERGE_BASE=$(git -C source merge-base HEAD "$BASE_SHA")
          echo EVIDENCE_HEAD=$(git -C evidence rev-parse HEAD)

      - name: Authoritative source gate
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          node scripts/verify-css-consolidation-preflight.mjs --expected-css-count=52
          echo SOURCE_PREFLIGHT_52_PASS
          npm ci
          echo SOURCE_NPM_CI_PASS
          npm run verify
          echo SOURCE_NPM_VERIFY_PASS
          npm run build
          echo SOURCE_NPM_BUILD_PASS
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
          node token-authority-check.mjs
          echo SOURCE_DIFF_CHECK_PASS
          echo SOURCE_DIFF_EXIT_PASS
          echo SOURCE_STATUS_CLEAN_PASS

      - name: Run exact-current static token inventory
        shell: bash
        run: |
          set -euo pipefail
          HARNESS_DIR="${RUNNER_TEMP}/phase3b4-static"
          OUT_DIR="${RUNNER_TEMP}/phase3b4-out"
          rm -rf "$HARNESS_DIR" "$OUT_DIR"
          mkdir -p "$HARNESS_DIR" "$OUT_DIR"
          cd "$HARNESS_DIR"
          npm init -y >/dev/null
          npm install --no-package-lock postcss postcss-selector-parser >/dev/null
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b4-review-candidate-token-disposition.mjs" characterize.mjs
          BASE_SHA="$BASE_SHA" node characterize.mjs --source="${GITHUB_WORKSPACE}/source" --out="$OUT_DIR/static-inventory.json"
          python3 -m json.tool "$OUT_DIR/static-inventory.json" >/dev/null
          echo STATIC_ARTIFACT_VALID_JSON_PASS

      - name: Run browser runtime and synthetic disposition matrix
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -y >/dev/null
            sudo apt-get install -y xvfb >/dev/null
          fi
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          HARNESS_DIR="${RUNNER_TEMP}/phase3b4-browser"
          OUT_DIR="${RUNNER_TEMP}/phase3b4-out"
          rm -rf "$HARNESS_DIR"
          mkdir -p "$HARNESS_DIR"
          cd "$HARNESS_DIR"
          npm init -y >/dev/null
          npm install --no-package-lock puppeteer-core >/dev/null
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b4-browser-token-disposition.mjs" browser.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('browser.mjs')
          s=p.read_text()
          cors="contentType:'text/javascript',headers:{'access-control-allow-origin':'*'},body:"
          anchor="contentType:'text/javascript',body:"
          if s.count(anchor)!=2: raise SystemExit(f'FIREBASE_STUB_CORS_ANCHOR_FAIL count={s.count(anchor)}')
          s=s.replace(anchor,cors)
          old="await page.mouse.down();await sleep(100);records.push({state:'active-press',raw:await rawButton(page)});await page.mouse.up();await sleep(180);records.push({state:'press-reset',raw:await rawButton(page)});"
          new="await page.mouse.down();await sleep(100);records.push({state:'active-press',raw:await rawButton(page)});await page.mouse.move(1,1);await page.mouse.up();await sleep(180);records.push({state:'press-reset',raw:await rawButton(page)});"
          if s.count(old)!=1: raise SystemExit(f'CTA_PRESS_RESET_PATCH_ANCHOR_FAIL count={s.count(old)}')
          s=s.replace(old,new,1)
          old_touch="await client.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await sleep(180);records.push({state:'coarse-touch-reset',raw:await rawButton(coarse)});"
          new_touch="await client.send('Input.dispatchTouchEvent',{type:'touchCancel',touchPoints:[]});await sleep(180);records.push({state:'coarse-touch-reset',raw:await rawButton(coarse)});"
          if s.count(old_touch)!=1: raise SystemExit(f'COARSE_TOUCH_CANCEL_PATCH_ANCHOR_FAIL count={s.count(old_touch)}')
          s=s.replace(old_touch,new_touch,1)
          old_draw="async function drawerMatrix(browser,base){const page=await browser.newPage();const mon=await configurePage(page,{viewport:{width:390,height:844},touch:true});await page.goto(base+'/',{waitUntil:'domcontentloaded',timeout:30000});await waitPublicReady(page);const out=[];out.push({state:'ltr-closed',snap:await drawerSnapshot(page)});await page.click('#mobile-menu-btn');await sleep(500);out.push({state:'ltr-open-settled',snap:await drawerSnapshot(page)});const closeSel=await page.$('#mobile-menu-close')?'#mobile-menu-close':'#mobile-menu-btn';await page.click(closeSel);await sleep(500);out.push({state:'ltr-closed-settled',snap:await drawerSnapshot(page)});await switchArabic(page);out.push({state:'rtl-closed',snap:await drawerSnapshot(page)});await page.click('#mobile-menu-btn');await sleep(500);out.push({state:'rtl-open-settled',snap:await drawerSnapshot(page)});await page.click(closeSel);await sleep(500);out.push({state:'rtl-closed-settled',snap:await drawerSnapshot(page)});"
          new_draw="async function drawerMatrix(browser,base){const page=await browser.newPage();const mon=await configurePage(page,{viewport:{width:390,height:844},touch:true});await page.goto(base+'/',{waitUntil:'domcontentloaded',timeout:30000});await waitPublicReady(page);const out=[];const toggle=async()=>page.evaluate(()=>document.querySelector('#mobile-menu-btn')?.click());out.push({state:'ltr-closed',snap:await drawerSnapshot(page)});await toggle();await sleep(500);out.push({state:'ltr-open-settled',snap:await drawerSnapshot(page)});await toggle();await sleep(500);out.push({state:'ltr-closed-settled',snap:await drawerSnapshot(page)});await switchArabic(page);out.push({state:'rtl-closed',snap:await drawerSnapshot(page)});await toggle();await sleep(500);out.push({state:'rtl-open-settled',snap:await drawerSnapshot(page)});await toggle();await sleep(500);out.push({state:'rtl-closed-settled',snap:await drawerSnapshot(page)});"
          if s.count(old_draw)!=1: raise SystemExit(f'DRAWER_TOGGLE_PATCH_ANCHOR_FAIL count={s.count(old_draw)}')
          s=s.replace(old_draw,new_draw,1)
          old_reduced="out.push({state:'reduced-ltr-closed',snap:await drawerSnapshot(reduced)});await reduced.click('#mobile-menu-btn');await sleep(80);out.push({state:'reduced-ltr-open',snap:await drawerSnapshot(reduced)});"
          new_reduced="out.push({state:'reduced-ltr-closed',snap:await drawerSnapshot(reduced)});await reduced.evaluate(()=>document.querySelector('#mobile-menu-btn')?.click());await sleep(80);out.push({state:'reduced-ltr-open',snap:await drawerSnapshot(reduced)});"
          if s.count(old_reduced)!=1: raise SystemExit(f'DRAWER_REDUCED_PATCH_ANCHOR_FAIL count={s.count(old_reduced)}')
          s=s.replace(old_reduced,new_reduced,1)
          old_lang="async function switchArabic(page){const candidates=await page.$$('[data-lang=\"ar\"]');if(!candidates.length)throw new Error('Arabic language control not found');await page.evaluate(()=>{const e=[...document.querySelectorAll('[data-lang=\"ar\"]')].find(x=>x.tagName==='BUTTON'||x.tagName==='A')||document.querySelector('[data-lang=\"ar\"]');e.click();});await page.waitForFunction(()=>document.documentElement.dir==='rtl'&&document.body.classList.contains('route-ar'),{timeout:8000});await sleep(300);}"
          new_lang="async function switchArabic(page){await page.waitForFunction(()=>typeof window.setLang==='function',{timeout:8000});await page.evaluate(async()=>{await window.setLang('ar');});await page.waitForFunction(()=>document.documentElement.dir==='rtl'&&document.documentElement.lang==='ar'&&document.body.classList.contains('route-ar'),{timeout:8000});await sleep(300);}"
          if s.count(old_lang)!=1: raise SystemExit(f'PRODUCTION_SETLANG_PATCH_ANCHOR_FAIL count={s.count(old_lang)}')
          s=s.replace(old_lang,new_lang,1)
          p.write_text(s)
          print('FIREBASE_MODULE_STUB_CORS_PATCH_PASS')
          print('CTA_PRESS_RESET_NO_ACTIVATION_PATCH_PASS')
          print('COARSE_TOUCH_CANCEL_PATCH_PASS')
          print('DRAWER_PRODUCTION_EVENT_TRIGGER_PATCH_PASS')
          print('PRODUCTION_SETLANG_RTL_PATCH_PASS')
          PY
          BASE_SHA="$BASE_SHA" CHROME_BIN="$CHROME_BIN" xvfb-run -a node browser.mjs \
            --source="${GITHUB_WORKSPACE}/source" \
            --static="$OUT_DIR/static-inventory.json" \
            --out="$OUT_DIR/runtime-evidence.json" \
            --chrome="$CHROME_BIN"
          python3 -m json.tool "$OUT_DIR/runtime-evidence.json" >/dev/null
          echo RUNTIME_ARTIFACT_VALID_JSON_PASS

      - name: Final source immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$BASE_TREE"
          test -z "$(git -C source status --porcelain)"
          test -z "$(git -C source diff --name-only "$BASE_SHA"..HEAD)"
          echo FINAL_SOURCE_IMMUTABILITY_PASS

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase-3b4-review-candidate-token-disposition
          path: ${{ runner.temp }}/phase3b4-out
          if-no-files-found: error
