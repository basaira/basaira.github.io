name: Phase 2.5 Browser Characterization
on:
  push:
    branches: ["basair/phase-2.5-browser-characterization"]
permissions:
  contents: write
jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact closed Phase 2 source
        uses: actions/checkout@v4
        with:
          ref: 1504baad33b2123056877c1e92f4e2d558c00d51
          fetch-depth: 0
      - name: Prove authoritative starting state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1504baad33b2123056877c1e92f4e2d558c00d51"
          test "$(git rev-parse HEAD^{tree})" = "1d987040d0158387d0425d6e6ed00fe2a68ec617"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse 6e46539a02db342838d7c113a45ff558192658e5^{tree})" = "8c18f5050f4ffa33c2317823e540766a4b2bc9ff"
          echo "START_HEAD=$(git rev-parse HEAD)"
          echo "START_TREE=$(git rev-parse HEAD^{tree})"
          echo "WORKTREE=CLEAN"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify untouched Phase 2 production tree
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify
          npm run build
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Prepare historical Phase 0 worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/basair-phase0 6e46539a02db342838d7c113a45ff558192658e5
          cd /tmp/basair-phase0
          test "$(git rev-parse HEAD)" = "6e46539a02db342838d7c113a45ff558192658e5"
          test "$(git rev-parse HEAD^{tree})" = "8c18f5050f4ffa33c2317823e540766a4b2bc9ff"
          test -z "$(git status --porcelain)"
          npm ci
          npm run build
      - name: Prove real browser and install isolated automation harness
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER_BIN" ]; then
            echo "NO_REAL_BROWSER_ENGINE" >&2
            exit 78
          fi
          echo "BROWSER_BIN=$BROWSER_BIN" >> "$GITHUB_ENV"
          "$BROWSER_BIN" --version
          mkdir -p /tmp/basair-browser-tooling
          cd /tmp/basair-browser-tooling
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
          node -p "require('puppeteer-core/package.json').version"
      - name: Serve both production builds
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/dist" >/tmp/phase2-server.log 2>&1 &
          echo $! >/tmp/phase2-server.pid
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/basair-phase0/dist >/tmp/phase0-server.log 2>&1 &
          echo $! >/tmp/phase0-server.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && curl -fsS http://127.0.0.1:4174/ >/dev/null && exit 0
            sleep 1
          done
          echo "Servers did not become ready" >&2
          exit 1
      - name: Run 48-state real-browser characterization and Phase 0 comparison
        shell: bash
        env:
          PHASE2_BASE_URL: http://127.0.0.1:4173
          PHASE0_BASE_URL: http://127.0.0.1:4174
          PHASE0_ROOT: /tmp/basair-phase0
        run: |
          set -euo pipefail
          cat >/tmp/basair-browser-tooling/characterize.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import os from 'node:os';
          import {execFileSync, execSync} from 'node:child_process';
          import puppeteer from 'puppeteer-core';

          const ROOT=process.env.GITHUB_WORKSPACE;
          const PH0=process.env.PHASE0_ROOT;
          const BROWSER=process.env.BROWSER_BIN;
          const FINAL_URL=process.env.PHASE2_BASE_URL;
          const BASE_URL=process.env.PHASE0_BASE_URL;
          const SOURCE_COMMIT='1504baad33b2123056877c1e92f4e2d558c00d51';
          const SOURCE_TREE='1d987040d0158387d0425d6e6ed00fe2a68ec617';
          const COMP_COMMIT='6e46539a02db342838d7c113a45ff558192658e5';
          const COMP_TREE='8c18f5050f4ffa33c2317823e540766a4b2bc9ff';
          const routes=['/','/en/','/en/quran-kids/','/en/quran-adults/','/en/arabic/','/ru/','/ru/quran/','/ru/arabic/','/uz/','/uz/quran/','/uz/arabic/','/admin.html'];
          const viewports=[
            {name:'mobile',width:390,height:844,deviceScaleFactor:1},
            {name:'tablet',width:768,height:1024,deviceScaleFactor:1},
            {name:'desktop',width:1440,height:900,deviceScaleFactor:1},
            {name:'wide',width:1920,height:1080,deviceScaleFactor:1}
          ];
          const manifest=JSON.parse(fs.readFileSync(path.join(ROOT,'token-authority-manifest.json'),'utf8'));
          const canonical=Object.keys(manifest.canonicalTokens);
          const aliasEntries=Object.entries(manifest.aliases);
          const conflicts=[...manifest.correctedAuditScope.conflictTokens];
          const classCounts=aliasEntries.reduce((a,[,m])=>{a[m.surfaceClassification]=(a[m.surfaceClassification]||0)+1;return a;},{});
          if(canonical.length!==106||aliasEntries.length!==98||JSON.stringify(classCounts)!==JSON.stringify({B:49,D:23,C:23,A:1,E:2})||conflicts.length!==40) throw new Error(`Source drift: canonical=${canonical.length} aliases=${aliasEntries.length} classes=${JSON.stringify(classCounts)} conflicts=${conflicts.length}`);
          if(manifest.correctedAuditScope.productionCssFileCount!==55||manifest.correctedAuditScope.inlineStyleBlockCount!==1) throw new Error('Corrected audit scope drift');
          const eAliases=aliasEntries.filter(([,m])=>m.surfaceClassification==='E').map(([n])=>n).sort();
          const aAliases=aliasEntries.filter(([,m])=>m.surfaceClassification==='A').map(([n])=>n).sort();
          if(JSON.stringify(eAliases)!==JSON.stringify(['--line','--muted'])||JSON.stringify(aAliases)!==JSON.stringify(['--gold'])) throw new Error('Critical alias source drift');

          const normalize=v=>String(v??'').trim().replace(/\s+/g,' ').toLowerCase();
          const routeSlug=r=>r==='/'?'root':r.replace(/^\//,'').replace(/\/$/,'').replaceAll('/','-').replace('.html','')||'root';
          const screenshotRoot='/tmp/phase-2.5-screenshots';
          fs.mkdirSync(screenshotRoot,{recursive:true});
          const browserVersion=execFileSync(BROWSER,['--version'],{encoding:'utf8'}).trim();
          const nodeVersion=process.version;
          const osText=fs.readFileSync('/etc/os-release','utf8').split('\n').filter(x=>x.startsWith('PRETTY_NAME=')).join('').replace(/^PRETTY_NAME=/,'').replaceAll('"','') || `${os.type()} ${os.release()}`;
          const automationTool=`puppeteer-core ${JSON.parse(fs.readFileSync('/tmp/basair-browser-tooling/node_modules/puppeteer-core/package.json','utf8')).version}`;
          const browser=await puppeteer.launch({executablePath:BROWSER,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--font-render-hinting=none']});

          const data={
            metadata:{sourceCommit:SOURCE_COMMIT,sourceTree:SOURCE_TREE,comparisonCommit:COMP_COMMIT,comparisonTree:COMP_TREE,browser:'Chromium-family',browserVersion,automationTool,nodeVersion,os:osText,reducedMotion:'reduce',colorScheme:'light',deviceScaleFactor:1,generatedAt:new Date().toISOString()},
            coverage:{routes,viewports,totalStatesExpected:48,totalStatesCompleted:0,failures:[]},
            sourceAuthorityGraph:{
              public:{entry:'index.css',authority:'tokens.css',bridge:'tokens-public-compat.css'},
              acquisition:{entry:'acquisition.css',authority:'tokens.css',bridge:'tokens-acquisition-compat.css'},
              admin:{entry:'admin-ui-fixes-v1.css',authority:'tokens.css',bridge:'tokens-admin-compat.css'}
            },
            surfaceDetection:[],rootTokenObservations:[],aliasObservations:[],criticalOwnershipAssertions:[],conflictTokenCharacterization:[],representativeElementFingerprints:[],baselineComparison:[],runtimeSmoke:[],screenshots:[],limitations:[]
          };

          const expectedAlias=(cls,surface)=>cls==='A'||(cls==='B'&&surface==='PUBLIC')||(cls==='C'&&surface==='ACQUISITION')||(cls==='D'&&surface==='ADMIN')||(cls==='E'&&(surface==='ACQUISITION'||surface==='ADMIN'));

          async function settle(page){
            await page.evaluate(async()=>{if(document.fonts?.ready){await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]);}}).catch(()=>{});
            await new Promise(r=>setTimeout(r,250));
          }

          async function stateSamples(page,tokens){
            const handles=await page.$$('a,button,input,select,textarea,[tabindex]');
            const out=[];
            let used=0;
            for(const h of handles){
              if(used>=20) break;
              const visible=await h.evaluate(el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden';}).catch(()=>false);
              if(!visible) continue;
              used++;
              const before=await h.evaluate((el,ts)=>Object.fromEntries(ts.map(t=>[t,getComputedStyle(el).getPropertyValue(t).trim()])),tokens).catch(()=>null);
              if(!before) continue;
              const descriptor=await h.evaluate(el=>{const sec=el.closest('section,main,header,nav,form,article');const cls=[...el.classList].slice(0,4).join('.');return `${el.tagName.toLowerCase()}${el.id?'#'+el.id:''}${cls?'.'+cls:''}${sec&&sec!==el?` @ ${sec.tagName.toLowerCase()}${sec.id?'#'+sec.id:''}`:''}`;}).catch(()=>null);
              const samples=[];
              try{await h.hover();await new Promise(r=>setTimeout(r,30));const hv=await h.evaluate((el,ts)=>Object.fromEntries(ts.map(t=>[t,getComputedStyle(el).getPropertyValue(t).trim()])),tokens);samples.push(['hover',hv]);}catch{}
              try{await h.focus();await new Promise(r=>setTimeout(r,20));const fv=await h.evaluate((el,ts)=>Object.fromEntries(ts.map(t=>[t,getComputedStyle(el).getPropertyValue(t).trim()])),tokens);samples.push(['focus',fv]);}catch{}
              for(const [state,vals] of samples){for(const t of tokens){if(normalize(vals[t])!==normalize(before[t])&&(vals[t]||before[t])) out.push({token:t,state,descriptor,before:before[t],after:vals[t]});}}
              await page.mouse.move(1,1).catch(()=>{});await h.evaluate(el=>el.blur?.()).catch(()=>{});
            }
            return out;
          }

          async function characterize(baseUrl,route,vp,label,{mode='css',screenshot=false}={}){
            const page=await browser.newPage();
            await page.setViewport(vp);
            await page.emulateMediaFeatures([{name:'prefers-reduced-motion',value:'reduce'},{name:'prefers-color-scheme',value:'light'}]);
            const consoleErrors=[],pageErrors=[],failed=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text().slice(0,800));});
            page.on('pageerror',e=>pageErrors.push(String(e).slice(0,800)));
            page.on('requestfailed',r=>failed.push({url:r.url(),type:r.resourceType(),failure:r.failure()?.errorText||'failed'}));
            if(mode==='css') await page.setJavaScriptEnabled(false);
            const url=baseUrl+route.replace(/^\//,'');
            let response;
            try{response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:15000});await settle(page);}catch(e){await page.close();throw e;}
            if(mode==='runtime'){await new Promise(r=>setTimeout(r,850));}
            const obs=await page.evaluate(({canonical,aliasEntries,conflicts})=>{
              const norm=v=>String(v??'').trim().replace(/\s+/g,' ').toLowerCase();
              const descriptor=el=>{if(!el)return null;const sec=el.closest?.('section,main,header,nav,form,article');const cls=el.classList?[...el.classList].slice(0,4).join('.'):'';return `${el.tagName.toLowerCase()}${el.id?'#'+el.id:''}${cls?'.'+cls:''}${sec&&sec!==el?` @ ${sec.tagName.toLowerCase()}${sec.id?'#'+sec.id:''}`:''}`;};
              const visible=el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden';};
              const rootStyle=getComputedStyle(document.documentElement);
              const rootTokens=Object.fromEntries(canonical.map(n=>{const raw=rootStyle.getPropertyValue(n).trim();return[n,{raw,normalized:norm(raw),present:raw!==''}]}));
              const aliases=Object.fromEntries(aliasEntries.map(([n])=>{const raw=rootStyle.getPropertyValue(n).trim();return[n,{raw,normalized:norm(raw),present:raw!==''}]}));
              const marker={public:rootStyle.getPropertyValue('--basair-canvas').trim(),acquisition:rootStyle.getPropertyValue('--quranic').trim(),admin:rootStyle.getPropertyValue('--admin-bg').trim()};
              const surface=marker.admin?'ADMIN':marker.acquisition?'ACQUISITION':marker.public?'PUBLIC':'UNKNOWN';
              const bridge=surface==='PUBLIC'?'tokens-public-compat.css':surface==='ACQUISITION'?'tokens-acquisition-compat.css':surface==='ADMIN'?'tokens-admin-compat.css':null;
              const styleSheets=[...document.styleSheets].map((s,i)=>{let rulesAccessible=true,ruleCount=null;try{ruleCount=s.cssRules.length}catch{rulesAccessible=false}return{index:i,href:s.href||null,inline:!s.href,ownerTag:s.ownerNode?.tagName||null,rulesAccessible,ruleCount};});
              const all=[document.documentElement,...document.querySelectorAll('*')].filter((el,i)=>i===0||visible(el));
              const conflictMap={};
              for(const token of conflicts){
                const vals=new Map();
                for(const el of all){const raw=getComputedStyle(el).getPropertyValue(token).trim();if(!raw)continue;const n=norm(raw);if(!vals.has(n))vals.set(n,{computedValue:raw,normalized:n,count:0,representatives:[],inlineOwn:false});const rec=vals.get(n);rec.count++;if(rec.representatives.length<3)rec.representatives.push(descriptor(el));if(el.style?.getPropertyValue(token))rec.inlineOwn=true;}
                conflictMap[token]=[...vals.values()];
              }
              const fingerprint=el=>{if(!el)return null;const s=getComputedStyle(el),r=el.getBoundingClientRect();return{descriptor:descriptor(el),tag:el.tagName.toLowerCase(),styles:{color:s.color,backgroundColor:s.backgroundColor,borderColor:s.borderColor,borderWidth:s.borderWidth,borderRadius:s.borderRadius,boxShadow:s.boxShadow,fontFamily:s.fontFamily,fontSize:s.fontSize,fontWeight:s.fontWeight,lineHeight:s.lineHeight,letterSpacing:s.letterSpacing,padding:s.padding,margin:s.margin,gap:s.gap,display:s.display,position:s.position,width:s.width,maxWidth:s.maxWidth},geometry:{x:r.x,y:r.y,width:r.width,height:r.height}};};
              const visibles=[...document.querySelectorAll('body *')].filter(visible);
              const first=q=>[...document.querySelectorAll(q)].find(visible)||null;
              const heading=first('h1,h2,h3');
              const para=[...document.querySelectorAll('p')].find(el=>visible(el)&&(el.textContent||'').trim().length>20)||null;
              const ctas=[...document.querySelectorAll('a[href],button,input[type="submit"]')].filter(visible);
              const candidates=visibles.filter(el=>['ARTICLE','FORM','DIV','SECTION'].includes(el.tagName)).map(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();const bg=s.backgroundColor!=='rgba(0, 0, 0, 0)'&&s.backgroundColor!=='transparent';const bordered=parseFloat(s.borderTopWidth)>0;const shadow=s.boxShadow!=='none';return{el,score:(bg?3:0)+(bordered?2:0)+(shadow?2:0)+(r.width*r.height>15000?1:0)}}).filter(x=>x.score>=3).sort((a,b)=>b.score-a.score);
              const input=first('input:not([type="hidden"]),select,textarea');
              const muted=visibles.find(el=>{const t=(el.textContent||'').trim();if(!t||t.length>180)return false;const s=getComputedStyle(el);return parseFloat(s.fontSize)<=14.5||parseFloat(s.opacity)<.9;})||null;
              const divider=visibles.find(el=>{const s=getComputedStyle(el);return parseFloat(s.borderTopWidth)>0||parseFloat(s.borderBottomWidth)>0;})||null;
              const reps={body:fingerprint(document.body),primaryHeading:fingerprint(heading),bodySupportText:fingerprint(para),primaryCTA:fingerprint(ctas[0]||null),secondaryCTA:fingerprint(ctas[1]||null),mainCardPanel:fingerprint(candidates[0]?.el||null),formControl:fingerprint(input),mutedHelper:fingerprint(muted),representativeBorder:fingerprint(divider),navigationHeader:fingerprint(first('header,nav')),sectionContainer:fingerprint(first('main,section'))};
              return{surface,bridge,marker,rootTokens,aliases,conflictMap,reps,styleSheets,inlineStyleBlockCount:document.querySelectorAll('style').length,authorityPresent:!!rootStyle.getPropertyValue('--color-brand-green').trim(),readyState:document.readyState,bodyTextLength:(document.body?.innerText||'').length};
            },{canonical,aliasEntries,conflicts});
            let stateChanges=[];
            if(mode==='css') stateChanges=await stateSamples(page,conflicts);
            let shot=null;
            if(screenshot){const dir=path.join(screenshotRoot,label,vp.name);fs.mkdirSync(dir,{recursive:true});const file=path.join(dir,`${routeSlug(route)}.png`);await page.screenshot({path:file,fullPage:false});const sha256=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');shot={logicalName:`${label}:${route}:${vp.name}`,sha256,location:`GitHub Actions artifact phase-2.5-screenshots/${label}/${vp.name}/${path.basename(file)}`};}
            const result={route,viewport:vp.name,status:response?.status()||null,...obs,stateChanges,consoleErrors,pageErrors,failedResources:failed};
            await page.close();
            return{result,shot};
          }

          const finalCss=new Map(),baseCss=new Map();
          for(const route of routes){for(const vp of viewports){
            const key=`${route}|${vp.name}`;
            try{
              const f=await characterize(FINAL_URL,route,vp,'final',{mode:'css'});finalCss.set(key,f.result);
              const b=await characterize(BASE_URL,route,vp,'phase0',{mode:'css'});baseCss.set(key,b.result);
              data.coverage.totalStatesCompleted++;
            }catch(e){data.coverage.failures.push({route,viewport:vp.name,mode:'css',error:String(e)});}
          }}

          for(const [key,s] of finalCss){
            const [route,viewport]=key.split('|');
            data.surfaceDetection.push({route,viewport,surface:s.surface,bridge:s.bridge,authorityPresent:s.authorityPresent,inlineStyleBlockCount:s.inlineStyleBlockCount,builtBrowserStylesheets:s.styleSheets,sourceGraph:data.sourceAuthorityGraph[s.surface?.toLowerCase()]||null});
            data.rootTokenObservations.push({route,viewport,tokens:s.rootTokens});
            const aliases={};for(const [name,meta] of aliasEntries){const o=s.aliases[name];aliases[name]={...o,classification:meta.surfaceClassification,expectedOnSurface:expectedAlias(meta.surfaceClassification,s.surface)};}data.aliasObservations.push({route,viewport,surface:s.surface,aliases});
            for(const token of conflicts){for(const v of s.conflictMap[token]||[]){data.conflictTokenCharacterization.push({token,route,viewport,computedValue:v.computedValue,normalized:v.normalized,count:v.count,representatives:v.representatives,likelyScope:v.inlineOwn?'inline':v.representatives.some(x=>x?.startsWith('html'))?'root':v.representatives.some(x=>x?.includes(' @ section'))?'section':'component',state:'rest'});}}
            for(const ch of s.stateChanges){data.conflictTokenCharacterization.push({token:ch.token,route,viewport,computedValue:ch.after,normalized:normalize(ch.after),count:1,representatives:[ch.descriptor],likelyScope:'state',state:ch.state,restValue:ch.before});}
            data.representativeElementFingerprints.push({route,viewport,surface:s.surface,categories:s.reps});
          }

          const pushAssert=(name,pass,evidence)=>data.criticalOwnershipAssertions.push({name,pass,evidence});
          for(const [key,s] of finalCss){
            const [route,viewport]=key.split('|');
            const rv=n=>s.aliases[n]?.normalized||'';const cv=n=>s.rootTokens[n]?.normalized||'';
            pushAssert(`global --gold ${route} ${viewport}`,rv('--gold')===cv('--color-accent-gold')&&!!rv('--gold'),{surface:s.surface,gold:rv('--gold'),canonical:cv('--color-accent-gold')});
            if(s.surface==='ACQUISITION'){
              pushAssert(`acquisition --muted ${route} ${viewport}`,rv('--muted')===cv('--color-acquisition-text-muted')&&rv('--muted')===normalize('#526860'),{muted:rv('--muted'),canonical:cv('--color-acquisition-text-muted')});
              pushAssert(`acquisition --line ${route} ${viewport}`,rv('--line')===cv('--color-border-subtle'),{line:rv('--line'),canonical:cv('--color-border-subtle')});
            }
            if(s.surface==='ADMIN'){
              pushAssert(`admin --muted ${route} ${viewport}`,rv('--muted')===normalize('rgba(255,255,255,.62)')||rv('--muted')===normalize('rgba(255, 255, 255, 0.62)'),{muted:rv('--muted')});
              pushAssert(`admin --line ${route} ${viewport}`,rv('--line')===normalize('rgba(255,255,255,.12)')||rv('--line')===normalize('rgba(255, 255, 255, 0.12)'),{line:rv('--line')});
              pushAssert(`admin not acquisition aliases ${route} ${viewport}`,rv('--muted')!==normalize('#526860')&&rv('--line')!==cv('--color-border-subtle'),{muted:rv('--muted'),line:rv('--line'),acqMuted:'#526860',acqLine:cv('--color-border-subtle')});
            }
            if(s.surface==='PUBLIC'){
              pushAssert(`public deep green distinction ${route} ${viewport}`,rv('--basair-green-deep')===cv('--color-public-evergreen-surface')&&cv('--color-public-evergreen-surface')===normalize('#073B31')&&rv('--basair-green-hover')===cv('--color-brand-green-deep')&&cv('--color-brand-green-deep')===normalize('#044637')&&rv('--basair-green-deep')!==rv('--basair-green-hover'),{deep:rv('--basair-green-deep'),hover:rv('--basair-green-hover')});
            }
            for(const [name,meta] of aliasEntries){const expect=expectedAlias(meta.surfaceClassification,s.surface),actual=s.aliases[name]?.present===true;if(expect!==actual) pushAssert(`alias presence ${name} ${route} ${viewport}`,false,{surface:s.surface,classification:meta.surfaceClassification,expected:expect,actual});}
          }

          const fpProps=['color','backgroundColor','borderColor','borderWidth','borderRadius','boxShadow','fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','padding','margin','gap','display','position','width','maxWidth'];
          let unexplained=0;
          for(const [key,f] of finalCss){const b=baseCss.get(key);if(!b)continue;const [route,viewport]=key.split('|');const cats={};for(const cat of Object.keys(f.reps)){const a=f.reps[cat],z=b.reps[cat];if(!a&&!z){cats[cat]={classification:'EXACTLY EQUIVALENT',note:'N/A in both trees'};continue;}if(!a||!z){cats[cat]={classification:'UNEXPLAINED COMPUTED-STYLE DELTA',phase2:a,phase0:z};unexplained++;continue;}const styleDiff={};for(const p of fpProps)if(a.styles[p]!==z.styles[p])styleDiff[p]={phase2:a.styles[p],phase0:z.styles[p]};const geomDiff={};for(const p of ['x','y','width','height'])if(Math.abs((a.geometry[p]||0)-(z.geometry[p]||0))>.51)geomDiff[p]={phase2:a.geometry[p],phase0:z.geometry[p]};if(Object.keys(styleDiff).length||Object.keys(geomDiff).length){cats[cat]={classification:'UNEXPLAINED COMPUTED-STYLE DELTA',descriptorPhase2:a.descriptor,descriptorPhase0:z.descriptor,styleDiff,geometryDiff:geomDiff};unexplained++;}else cats[cat]={classification:'EXACTLY EQUIVALENT',descriptor:a.descriptor};}data.baselineComparison.push({route,viewport,categories:cats});}

          const conflictAnalysis={};
          for(const token of conflicts){const rows=data.conflictTokenCharacterization.filter(x=>x.token===token);const rest=rows.filter(x=>x.state==='rest');const values=new Set(rest.map(x=>x.normalized));const stateChange=rows.some(x=>x.likelyScope==='state'&&normalize(x.restValue)!==x.normalized);let breakpointChange=false;for(const route of routes){const sigs=new Set(viewports.map(v=>rest.filter(x=>x.route===route&&x.viewport===v.name).map(x=>x.normalized).sort().join('|')).filter(Boolean));if(sigs.size>1)breakpointChange=true;}const contextual=values.size>1||stateChange||breakpointChange;conflictAnalysis[token]={observedValues:[...values],stateChange,breakpointChange,contextual,classification:contextual?'MUST NOT GLOBALLY CONSOLIDATE':values.size===1?'APPEARS SAFE CANDIDATE FOR LATER REVIEW':'NOT OBSERVED / DO NOT CONSOLIDATE WITHOUT EVIDENCE'};}
          data.conflictAnalysis=conflictAnalysis;

          for(const route of routes){for(const vp of viewports){
            try{
              const f=await characterize(FINAL_URL,route,vp,'final',{mode:'runtime',screenshot:true});if(f.shot)data.screenshots.push(f.shot);data.runtimeSmoke.push({tree:'phase2',route,viewport:vp.name,status:f.result.status,surface:f.result.surface,readyState:f.result.readyState,bodyTextLength:f.result.bodyTextLength,consoleErrors:f.result.consoleErrors,pageErrors:f.result.pageErrors,failedResources:f.result.failedResources});
              const b=await characterize(BASE_URL,route,vp,'phase0',{mode:'runtime',screenshot:true});if(b.shot)data.screenshots.push(b.shot);
            }catch(e){data.coverage.failures.push({route,viewport:vp.name,mode:'runtime/screenshot',error:String(e)});}
          }}

          const failedAssertions=data.criticalOwnershipAssertions.filter(x=>!x.pass);
          const actualSurfaces=new Set(data.surfaceDetection.map(x=>x.surface));
          if(!actualSurfaces.has('PUBLIC')||!actualSurfaces.has('ACQUISITION')||!actualSurfaces.has('ADMIN')) data.coverage.failures.push({mode:'surface-detection',error:`Detected ${[...actualSurfaces].join(',')}`});
          data.limitations.push('Authenticated Admin interior was not browser-characterized because no safe authorized credentials were available; the unauthenticated Admin document, inline ownership, root tokens, and reachable styles were characterized.');
          data.limitations.push('Screenshots are supporting evidence only; computed styles are authoritative. External font/Firebase/network noise is recorded separately and was not used as a CSS mismatch by itself.');

          const safe=Object.entries(conflictAnalysis).filter(([,v])=>v.classification.startsWith('APPEARS')).map(([k])=>k);
          const must=Object.entries(conflictAnalysis).filter(([,v])=>v.classification.startsWith('MUST')).map(([k])=>k);
          const unobserved=Object.entries(conflictAnalysis).filter(([,v])=>v.classification.startsWith('NOT OBSERVED')).map(([k])=>k);
          const breakpoint=Object.entries(conflictAnalysis).filter(([,v])=>v.breakpointChange).map(([k])=>k);
          const stateful=Object.entries(conflictAnalysis).filter(([,v])=>v.stateChange).map(([k])=>k);
          const allAssertionsPass=failedAssertions.length===0;
          const completeCoverage=data.coverage.totalStatesCompleted===48&&data.coverage.failures.length===0;
          const verdict=unexplained>0?'HOLD':(!completeCoverage||!allAssertionsPass?'NOT COMPLETE':'COMPLETE');
          data.verdict={status:verdict,unexplainedComputedStyleDeltas:unexplained,failedOwnershipAssertions:failedAssertions.length};

          const md=[];
          md.push('# BASAIR — PHASE 2.5 Browser Characterization');
          md.push('');
          md.push(`- Source: \`${SOURCE_COMMIT}\` / tree \`${SOURCE_TREE}\``);
          md.push(`- Comparison: \`${COMP_COMMIT}\` / tree \`${COMP_TREE}\``);
          md.push(`- Browser: **${browserVersion}**`);
          md.push(`- Automation: **${automationTool}**; Node **${nodeVersion}**; OS **${osText}**.`);
          md.push(`- Coverage: **${data.coverage.totalStatesCompleted}/48** CSS-characterization states; ${data.coverage.failures.length} recorded failures.`);
          md.push(`- Token contract: **106 canonical**, aliases **A/B/C/D/E = 1/49/23/23/2**, corrected conflicts **40**, production CSS **55**, inline style blocks **1**.`);
          md.push('');
          md.push('## What the browser computed');
          md.push(`All three surface families were detected from loaded compatibility markers: ${[...actualSurfaces].join(', ')}. Canonical authority was checked in every completed state. Critical ownership assertions: **${data.criticalOwnershipAssertions.length-failedAssertions.length}/${data.criticalOwnershipAssertions.length} passed**.`);
          md.push('');
          md.push('### Surface isolation');
          md.push(`Admin isolation from Acquisition aliases: **${failedAssertions.some(x=>x.name.startsWith('admin '))?'FAIL':'PASS'}**. Acquisition \`--muted\` was checked against \`#526860\`; Admin \`--muted\` against \`rgba(255,255,255,.62)\`; Admin \`--line\` against \`rgba(255,255,255,.12)\`. The public \`--basair-green-deep\` → \`#073B31\` and \`--basair-green-hover\` → \`#044637\` chains were checked independently.`);
          md.push('');
          md.push('## 40 conflict tokens');
          md.push(`- Contextual / MUST NOT be globally consolidated from current evidence (${must.length}): ${must.map(x=>`\`${x}\``).join(', ')||'none'}.`);
          md.push(`- Appears safe for later consolidation review (${safe.length}): ${safe.map(x=>`\`${x}\``).join(', ')||'none'}.`);
          md.push(`- Not observed in a rendered resting/state sample (${unobserved.length}): ${unobserved.map(x=>`\`${x}\``).join(', ')||'none'}; these are **not** safe to consolidate merely because unobserved.`);
          md.push(`- Breakpoint-changing tokens (${breakpoint.length}): ${breakpoint.map(x=>`\`${x}\``).join(', ')||'none'}.`);
          md.push(`- State-changing tokens actively observed via hover/focus samples (${stateful.length}): ${stateful.map(x=>`\`${x}\``).join(', ')||'none'}.`);
          md.push('');
          md.push('## Phase 0 → final Phase 2');
          md.push(`Representative computed-style fingerprints were compared for every completed route/viewport pair. Unexplained category-5 differences: **${unexplained}**. Identical computed results are classified as **EXACTLY EQUIVALENT**. Admin legacy ownership restoration is separately proven by the critical assertions and matches the Phase-0 historical values.`);
          md.push('');
          md.push('## Screenshots and runtime smoke');
          md.push(`Captured ${data.screenshots.length} viewport screenshots (Phase 2 + matching Phase 0) into a temporary GitHub Actions artifact; each filename/logical state and SHA-256 is recorded in the JSON. Runtime smoke was executed with JavaScript enabled on all Phase-2 route/viewport states; network/console failures are preserved as evidence rather than silenced.`);
          md.push('');
          md.push('## Limitations');
          for(const x of data.limitations)md.push(`- ${x}`);
          if(data.coverage.failures.length){md.push('- Coverage failures:');for(const x of data.coverage.failures)md.push(`  - ${x.route||''} ${x.viewport||''} ${x.mode}: ${x.error}`);}
          md.push('');
          md.push('## Constraints for Phase 3 / CSS consolidation');
          md.push('- Preserve surface-scoped compatibility bridges and never globalize `--line` or `--muted`.');
          md.push('- Preserve the two distinct dark-green semantic chains; color similarity is not semantic equivalence.');
          md.push('- Do not globally consolidate any token marked contextual, breakpoint-changing, or state-changing by this evidence.');
          md.push('- Treat unobserved conflicts as unresolved, not dead or equivalent.');
          md.push('- Keep `track-buttons-v6.css` protected until a deliberate replacement has equivalent browser characterization.');
          md.push('- Authenticated Admin interior needs separate authorized characterization before consolidation that can affect it.');
          md.push('- Re-run the same 12×4 browser matrix after each destructive cascade/ownership migration.');
          md.push('');
          if(verdict==='COMPLETE')md.push('PHASE 2.5 = COMPLETE\n\nREADY FOR CSS CONSOLIDATION PLANNING\n\nCSS CONSOLIDATION NOT STARTED');
          else if(verdict==='HOLD')md.push('PHASE 2.5 = HOLD\n\nUNEXPLAINED COMPUTED-STYLE DELTA — DO NOT CONSOLIDATE');
          else md.push('PHASE 2.5 = NOT COMPLETE\n\nINCOMPLETE BROWSER EVIDENCE — DO NOT CONSOLIDATE');

          fs.writeFileSync(path.join(ROOT,'phase-2.5-browser-characterization.json'),JSON.stringify(data,null,2)+'\n');
          fs.writeFileSync(path.join(ROOT,'PHASE_2_5_BROWSER_CHARACTERIZATION.md'),md.join('\n')+'\n');
          await browser.close();
          console.log(JSON.stringify({verdict,coverage:data.coverage,failedAssertions:failedAssertions.length,unexplained,safeCandidates:safe.length,mustNotGlobal:must.length,unobserved:unobserved.length,breakpointChanging:breakpoint.length,stateChanging:stateful.length,screenshots:data.screenshots.length},null,2));
          EOF
          cd /tmp/basair-browser-tooling
          node characterize.mjs
      - name: Upload temporary screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-2.5-screenshots
          path: /tmp/phase-2.5-screenshots
          if-no-files-found: error
          retention-days: 14
      - name: Publish audit artifacts only
        shell: bash
        run: |
          set -euo pipefail
          BASE=1504baad33b2123056877c1e92f4e2d558c00d51
          cp PHASE_2_5_BROWSER_CHARACTERIZATION.md /tmp/PHASE_2_5_BROWSER_CHARACTERIZATION.md
          cp phase-2.5-browser-characterization.json /tmp/phase-2.5-browser-characterization.json
          git fetch origin basair/phase-2.5-browser-characterization
          git switch --track -c phase25-publish origin/basair/phase-2.5-browser-characterization
          cp /tmp/PHASE_2_5_BROWSER_CHARACTERIZATION.md .
          cp /tmp/phase-2.5-browser-characterization.json .
          rm -f .github/workflows/phase-2-5-browser-characterization.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only "$BASE")
          printf 'FINAL_NET_CHANGED_FILES_FROM_PHASE2:\n%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq 'PHASE_2_5_BROWSER_CHARACTERIZATION.md'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'phase-2.5-browser-characterization.json'
          test "$(git hash-object track-buttons-v6.css)" = "$(git rev-parse "$BASE:track-buttons-v6.css")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Phase 2.5: characterize browser cascade and computed styles'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:basair/phase-2.5-browser-characterization
