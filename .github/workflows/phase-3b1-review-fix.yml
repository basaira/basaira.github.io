name: Phase 3B-1 Authorized Review Fix

on:
  push:
    branches:
      - basair/phase-3b-1-verification-evidence

permissions:
  contents: write

jobs:
  apply-review-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact manifest metadata fix and fast-forward target branch
        shell: bash
        run: |
          set -euo pipefail
          TARGET_BRANCH=basair/phase-3b-1-acquisition-precision-polish-merge
          EXPECTED_PARENT=37e2e6e85d695efcc346d7f35619f6a76eb9aac3
          FILE=token-authority-manifest.json

          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_PARENT"
          git checkout -B phase-3b1-review-fix "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          git show "HEAD:$FILE" > /tmp/manifest-before.json

          python3 <<'PY'
          from pathlib import Path
          p = Path('token-authority-manifest.json')
          before = Path('/tmp/manifest-before.json').read_text()
          current = p.read_text()
          assert current == before, 'worktree manifest differs from exact parent'
          old = '    "productionCssFileCount": 55,'
          new = '    "productionCssFileCount": 54,'
          assert before.count(old) == 1, f'expected exactly one old scalar, found {before.count(old)}'
          expected = before.replace(old, new, 1)
          p.write_text(expected)
          after = p.read_text()
          assert after == expected, 'unexpected manifest rewrite'
          assert after.count(new) == 1, 'new scalar occurrence mismatch'
          assert after.replace(new, old, 1) == before, 'change is not exactly 55 -> 54'
          PY

          test "$(git diff --name-only)" = "$FILE"
          test "$(git diff --numstat -- "$FILE")" = $'1\t1\ttoken-authority-manifest.json'
          git diff --check
          echo REVIEW_FIX_PATCH_BEGIN
          git diff -- "$FILE"
          echo REVIEW_FIX_PATCH_END

          git add "$FILE"
          test "$(git diff --cached --name-only)" = "$FILE"
          git diff --cached --check
          git config user.name "basair-phase-review"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Phase 3B-1 review: update production CSS audit count"

          NEW_HEAD=$(git rev-parse HEAD)
          NEW_TREE=$(git rev-parse HEAD^{tree})
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$FILE"
          test "$(git diff-tree --no-commit-id --numstat -r HEAD -- "$FILE")" = $'1\t1\ttoken-authority-manifest.json'

          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$EXPECTED_PARENT"
          git push origin "HEAD:$TARGET_BRANCH"

          echo "REVIEW_FIX_HEAD=$NEW_HEAD"
          echo "REVIEW_FIX_TREE=$NEW_TREE"
          echo "REVIEW_FIX_PARENT=$EXPECTED_PARENT"
          echo "REVIEW_FIX_PATH=$FILE"
