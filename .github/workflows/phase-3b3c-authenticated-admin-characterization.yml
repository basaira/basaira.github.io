name: Phase 3B-3C Authenticated Admin Characterization

on:
  push:
    branches:
      - basair/phase-3b-3c-authenticated-admin-characterization-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_SHA: a4671e5f4aa6ecc56fbf1b0b619e26fcb105f22f
      BASE_TREE: 9ad6d3078f73d6cc88bb1f02c6f8f3d76fea9037
      BASE_PARENT: 6de74b2271b937823d63ac33909cc36fe8e73662
      SOURCE_BRANCH: basair/phase-3b-3c-authenticated-admin-characterization
      EVIDENCE_BRANCH: basair/phase-3b-3c-authenticated-admin-characterization-evidence

    steps:
      - name: Checkout evidence harness
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-3c-authenticated-admin-characterization-evidence
          fetch-depth: 0
          path: evidence

      - name: Checkout authoritative characterization source
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-3c-authenticated-admin-characterization
          fetch-depth: 0
          path: source

      - name: Verify branch identity and evidence isolation
        shell: bash
        run: |
          set -euo pipefail
          git -C source fetch origin "$SOURCE_BRANCH" "$EVIDENCE_BRANCH"
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$BASE_TREE"
          test "$(git -C source rev-parse HEAD^1)" = "$BASE_PARENT"
          test "$(git -C source merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$BASE_SHA"
          test -z "$(git -C source status --porcelain)"
          printf '%s\n' \
            .github/workflows/phase-3b3c-authenticated-admin-characterization.yml \
            scripts/evidence/phase-3b3c-authenticated-admin-characterize.mjs \
            | sort > /tmp/allowed-evidence-paths
          git -C evidence diff --name-only "$BASE_SHA"..HEAD | sort > /tmp/actual-evidence-paths
          diff -u /tmp/allowed-evidence-paths /tmp/actual-evidence-paths
          echo BRANCH_IDENTITY_PASS
          echo SOURCE_HEAD=$(git -C source rev-parse HEAD)
          echo SOURCE_TREE=$(git -C source rev-parse HEAD^{tree})
          echo SOURCE_PARENT=$(git -C source rev-parse HEAD^1)
          echo MERGE_BASE=$(git -C source merge-base HEAD "$BASE_SHA")
          echo REMOTE_SOURCE_HEAD=$(git -C source rev-parse origin/$SOURCE_BRANCH)
          echo EVIDENCE_HEAD=$(git -C evidence rev-parse HEAD)
          echo EVIDENCE_ISOLATION_PASS

      - name: Authoritative source verification gate
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          node scripts/verify-css-consolidation-preflight.mjs --expected-css-count=53
          echo SOURCE_PREFLIGHT_53_PASS
          npm ci
          echo SOURCE_NPM_CI_PASS
          npm run verify
          echo SOURCE_NPM_VERIFY_PASS
          npm run build
          echo SOURCE_NPM_BUILD_PASS
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
          node token-authority-check.mjs
          echo SOURCE_DIFF_CHECK_PASS
          echo SOURCE_DIFF_EXIT_PASS
          echo SOURCE_TRACKED_CLEAN_PASS

      - name: Install and synchronize evidence-only browser harness
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          command -v Xvfb
          HARNESS_DIR="${RUNNER_TEMP}/phase3b3c-harness"
          rm -rf "$HARNESS_DIR"
          mkdir -p "$HARNESS_DIR"
          cd "$HARNESS_DIR"
          npm init -y >/dev/null
          npm install --no-package-lock puppeteer-core postcss postcss-selector-parser
          cp "${GITHUB_WORKSPACE}/evidence/scripts/evidence/phase-3b3c-authenticated-admin-characterize.mjs" "$HARNESS_DIR/characterize.mjs"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'phase3b3c-harness'/'characterize.mjs'
          text=p.read_text()

          patches=[]
          patches.append((
            'async function setSection(pair,tab){await syncClick(pair,`.nav-btn[data-tab="${tab}"]`);await Promise.all([pair.a.waitForSelector(`#tab-${tab}.active`,{timeout:3000}),pair.b.waitForSelector(`#tab-${tab}.active`,{timeout:3000})]);}',
            'async function setSection(pair,tab){const waitIdle=(p)=>p.waitForFunction(()=>!document.documentElement.classList.contains("basair-admin-tab-transition"),{timeout:8000});await Promise.all([waitIdle(pair.a),waitIdle(pair.b)]);await syncClick(pair,`.nav-btn[data-tab="${tab}"]`);await Promise.all([pair.a.waitForSelector(`#tab-${tab}.active`,{timeout:8000}),pair.b.waitForSelector(`#tab-${tab}.active`,{timeout:8000})]);await Promise.all([waitIdle(pair.a),waitIdle(pair.b)]);}'
          ))
          patches.append((
            "page.on('response',(r)=>{try{const u=new URL(r.url());if(u.origin===base&&r.status()>=400)monitor.sameOriginFailures.push({url:u.pathname,status:r.status()});}catch{}});",
            "page.on('response',(r)=>{try{const u=new URL(r.url());if(u.origin===base&&r.status()>=400&&u.pathname!=='/favicon.ico')monitor.sameOriginFailures.push({url:u.pathname,status:r.status()});}catch{}});"
          ))
          patches.append((
            "page.on('requestfailed',(r)=>monitor.requestFailures.push({url:r.url(),error:r.failure()?.errorText||''}));",
            "page.on('requestfailed',(r)=>{try{const u=new URL(r.url());if(u.pathname==='/favicon.ico')return;}catch{}monitor.requestFailures.push({url:r.url(),error:r.failure()?.errorText||''});});"
          ))
          patches.append((
            'async function newPair(cfg,viewport,reduced=false){const c1=await browser.createBrowserContext(),c2=await browser.createBrowserContext();',
            'async function newPair(cfg,viewport,reduced=false,runner=browser){const c1=await runner.createBrowserContext(),c2=await runner.createBrowserContext();'
          ))
          patches.append((
            'const groups={auth:[],empty:[],populated:[],responsive:[],reduced:[]},totals={comparisons:0,computed:0,geometry:0,custom:0,state:0,accessibility:0,resourceFailures:0,unresolved:0};',
            "const groups={auth:[],empty:[],populated:[],responsive:[],reduced:[],forced:[],fine:[]},fineTotals={comparisons:0,computed:0,geometry:0,custom:0,state:0,accessibility:0,resourceFailures:0,unresolved:0},totals={comparisons:0,computed:0,geometry:0,custom:0,state:0,accessibility:0,resourceFailures:0,unresolved:0};let finePointerProbe={mode:'two independent headed Chrome processes under Xvfb',display:process.env.DISPLAY||null,browserVersion:null,sourceCapability:null,syntheticCapability:null,focusVisible:null,activeState:null};"
          ))
          patches.append((
            'capability:sa.capabilities,selectorsMeasured:selectors,',
            'sourceRootCustom:sa.rootCustom,syntheticRootCustom:sb.rootCustom,sourceCapability:sa.capabilities,syntheticCapability:sb.capabilities,capability:sa.capabilities,selectorsMeasured:selectors,'
          ))
          patches.append((
            'groups[group].push(rec);totals.comparisons++;totals.computed+=d.computed.length;totals.geometry+=d.geometry.length;totals.custom+=d.custom.length;totals.state+=d.state.length;totals.accessibility+=d.accessibility.length;totals.resourceFailures+=resourceFailures;totals.unresolved+=unresolved;return rec;',
            "groups[group].push(rec);const bucket=group==='fine'?fineTotals:totals;bucket.comparisons++;bucket.computed+=d.computed.length;bucket.geometry+=d.geometry.length;bucket.custom+=d.custom.length;bucket.state+=d.state.length;bucket.accessibility+=d.accessibility.length;bucket.resourceFailures+=resourceFailures;bucket.unresolved+=unresolved;return rec;"
          ))
          patches.append((
            'forcedColorsHandled:forcedColorsApplicable?groups.reduced.length>0:true',
            'forcedColorsHandled:forcedColorsApplicable?(groups.forced.length>0&&groups.forced.every((x)=>x.unresolvedDeltaCount===0)):true'
          ))
          patches.append((
            'reduced:groups.reduced.reduce((n,x)=>n+x.unresolvedDeltaCount,0),accessibility:totals.accessibility',
            'reduced:groups.reduced.reduce((n,x)=>n+x.unresolvedDeltaCount,0),forcedColors:groups.forced.reduce((n,x)=>n+x.unresolvedDeltaCount,0),accessibility:totals.accessibility'
          ))
          patches.append((
            "await syncEval(pair,()=>{document.querySelector('.nav-btn.active')?.focus();});await Promise.all([pair.a.keyboard.press('ArrowDown'),pair.b.keyboard.press('ArrowDown')]);await measure('populated',`${viewport.name}:keyboard-tab-navigation`,pair,",
            "await syncEval(pair,()=>{document.querySelector('.nav-btn.active')?.focus();});await Promise.all([pair.a.keyboard.press('ArrowDown'),pair.b.keyboard.press('ArrowDown')]);await Promise.all([pair.a.waitForFunction(()=>!document.documentElement.classList.contains('basair-admin-tab-transition'),{timeout:8000}),pair.b.waitForFunction(()=>!document.documentElement.classList.contains('basair-admin-tab-transition'),{timeout:8000})]);await waitSettled([pair.a,pair.b],420);await measure('populated',`${viewport.name}:keyboard-tab-navigation`,pair,"
          ))
          patches.append((
            'contextualLineMutedPreserved:staticCharacterization.protectedTokenContext.inlineLine&&staticCharacterization.protectedTokenContext.inlineMuted,exactConcatByteProven:',
            'contextualLineMutedPreserved:staticCharacterization.protectedTokenContext.inlineLine&&staticCharacterization.protectedTokenContext.inlineMuted,rawContextualLineMutedRecorded:rawContextualEvidence.recorded,rawContextualLineMutedEquivalent:rawContextualEvidence.equivalent,finePointerCapabilityMeasured:finePointerEvidence.capabilityMeasured,finePointerHoverEquivalent:finePointerEvidence.equivalent,exactConcatByteProven:'
          ))
          patches.append((
            'synthetic,breakpointWidths,responsiveWidths,forcedColorsApplicable,matrix:{groupCounts:Object.fromEntries(Object.entries(groups).map(([k,v])=>[k,v.length])),totalSynchronizedComparisons:totals.comparisons}',
            "synthetic,rawContextualEvidence,finePointerEvidence,breakpointWidths,responsiveWidths,forcedColorsApplicable,matrix:{groupCounts:Object.fromEntries(Object.entries(groups).filter(([k])=>k!=='fine').map(([k,v])=>[k,v.length])),totalSynchronizedComparisons:totals.comparisons}"
          ))
          for old,new in patches:
              if text.count(old)!=1:
                  raise SystemExit(f'harness patch anchor count={text.count(old)} for {old[:100]!r}')
              text=text.replace(old,new,1)

          forced_loop='''\nif(forcedColorsApplicable){for(const viewport of[VP.wide,VP.mobile]){const pair=await newPair({authMode:'admin',roleActive:true,fixture:'populated'},viewport,false);await waitDashboard(pair);for(const p of[pair.a,pair.b]){const session=await p.createCDPSession();await session.send('Emulation.setEmulatedMedia',{media:'screen',features:[{name:'forced-colors',value:'active'}]});}await waitSettled([pair.a,pair.b],420);await measure('forced',`${viewport.name}:forced-overview`,pair,{authMode:'admin',fixture:'populated',viewport,section:'overview',state:'forced-colors'});await setSection(pair,'requests');await measure('forced',`${viewport.name}:forced-requests`,pair,{authMode:'admin',fixture:'populated',viewport,section:'requests',state:'forced-colors'});await closePair(pair);}}\n'''
          anchor='await browser.close();'
          if text.count(anchor)!=1:
              raise SystemExit('browser-close anchor changed unexpectedly')
          text=text.replace(anchor,forced_loop+anchor,1)

          fine_loop='''await browser.close();\nconst fineBrowserSource=await puppeteer.launch({headless:false,executablePath,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']});\nconst fineBrowserSynthetic=await puppeteer.launch({headless:false,executablePath,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']});\nfinePointerProbe.browserVersion={source:await fineBrowserSource.version(),synthetic:await fineBrowserSynthetic.version()};\n{const cfg={authMode:'admin',roleActive:true,fixture:'populated'},viewport=VP.wide,c1=await fineBrowserSource.createBrowserContext(),c2=await fineBrowserSynthetic.createBrowserContext(),a=await c1.newPage(),b=await c2.newPage(),ma=await configurePage(a,sourceServer.base,cfg,viewport,false),mb=await configurePage(b,synthServer.base,cfg,viewport,false);await Promise.all([a.goto(`${sourceServer.base}/${ENTRY}?evidence=1`,{waitUntil:'domcontentloaded',timeout:30000}),b.goto(`${synthServer.base}/${ENTRY}?evidence=1`,{waitUntil:'domcontentloaded',timeout:30000})]);const pair={a,b,c1,c2,ma,mb};await waitDashboard(pair);const readCaps=(p)=>p.evaluate(()=>({pointerFine:matchMedia('(pointer:fine)').matches,hoverHover:matchMedia('(hover:hover)').matches,pointerCoarse:matchMedia('(pointer:coarse)').matches,hoverNone:matchMedia('(hover:none)').matches}));const[sc,tc]=await Promise.all([readCaps(pair.a),readCaps(pair.b)]);finePointerProbe.sourceCapability=sc;finePointerProbe.syntheticCapability=tc;const fineCapOk=sc.pointerFine===true&&sc.hoverHover===true&&tc.pointerFine===true&&tc.hoverHover===true;if(fineCapOk){await measure('fine','fine:authenticated-populated-overview',pair,{authMode:'admin',fixture:'populated',viewport:VP.wide,section:'overview',state:'fine-pointer-base'});await setSection(pair,'requests');await measure('fine','fine:requests-section',pair,{authMode:'admin',fixture:'populated',viewport:VP.wide,section:'requests',state:'fine-pointer-requests'});await setSection(pair,'overview');await syncHover(pair,'.nav-btn[data-tab="requests"]');await measure('fine','fine:nav-hover',pair,{authMode:'admin',fixture:'populated',viewport:VP.wide,section:'overview',state:'fine-pointer-nav-hover'});await syncHover(pair,'#refresh-all-btn');await measure('fine','fine:button-hover',pair,{authMode:'admin',fixture:'populated',viewport:VP.wide,section:'overview',state:'fine-pointer-button-hover'});const[ba,bb]=await Promise.all([pair.a.$('#refresh-all-btn'),pair.b.$('#refresh-all-btn')]),[ra,rb]=await Promise.all([ba.boundingBox(),bb.boundingBox()]);await Promise.all([pair.a.mouse.move(ra.x+ra.width/2,ra.y+ra.height/2),pair.b.mouse.move(rb.x+rb.width/2,rb.y+rb.height/2)]);await Promise.all([pair.a.mouse.down(),pair.b.mouse.down()]);await sleep(120);const activeFacts=await Promise.all([pair.a.evaluate(()=>Boolean(document.querySelector('#refresh-all-btn')?.matches(':active'))),pair.b.evaluate(()=>Boolean(document.querySelector('#refresh-all-btn')?.matches(':active')))]);finePointerProbe.activeState={source:activeFacts[0],synthetic:activeFacts[1]};await measure('fine','fine:button-active',pair,{authMode:'admin',fixture:'populated',viewport:VP.wide,section:'overview',state:'fine-pointer-active',settleMs:0});await Promise.all([pair.a.mouse.up(),pair.b.mouse.up()]);await syncEval(pair,()=>{document.querySelector('.nav-btn.active')?.focus();});await Promise.all([pair.a.keyboard.press('ArrowDown'),pair.b.keyboard.press('ArrowDown')]);await Promise.all([pair.a.waitForFunction(()=>!document.documentElement.classList.contains('basair-admin-tab-transition'),{timeout:8000}),pair.b.waitForFunction(()=>!document.documentElement.classList.contains('basair-admin-tab-transition'),{timeout:8000})]);await waitSettled([pair.a,pair.b],420);const focusFacts=await Promise.all([pair.a.evaluate(()=>({tab:document.activeElement?.dataset?.tab||null,focusVisible:Boolean(document.activeElement?.matches?.(':focus-visible'))})),pair.b.evaluate(()=>({tab:document.activeElement?.dataset?.tab||null,focusVisible:Boolean(document.activeElement?.matches?.(':focus-visible'))}))]);finePointerProbe.focusVisible={source:focusFacts[0],synthetic:focusFacts[1]};await measure('fine','fine:focus-visible',pair,{authMode:'admin',fixture:'populated',viewport:VP.wide,section:'requests',state:'fine-pointer-focus-visible'});}await closePair(pair);}\nawait Promise.all([fineBrowserSource.close(),fineBrowserSynthetic.close()]);'''
          close_anchor='await browser.close();await Promise.all([new Promise((r)=>sourceServer.server.close(r)),new Promise((r)=>synthServer.server.close(r))]);'
          if text.count(close_anchor)!=1:
              raise SystemExit('headless-close/server-close anchor changed unexpectedly')
          text=text.replace(close_anchor,fine_loop+'await Promise.all([new Promise((r)=>sourceServer.server.close(r)),new Promise((r)=>synthServer.server.close(r))]);',1)

          evidence_prelude="""const matrixRecords=Object.entries(groups).filter(([k])=>k!=='fine').flatMap(([,records])=>records);const contextualKeys=['--line','--muted'];const rawContextualEvidence={measurementCount:matrixRecords.length,keys:contextualKeys,recorded:matrixRecords.length===totals.comparisons&&matrixRecords.every((r)=>contextualKeys.every((k)=>String(r.sourceRootCustom?.[k]||'').trim().length>0&&String(r.syntheticRootCustom?.[k]||'').trim().length>0)),equivalent:false,distinctValues:Object.fromEntries(contextualKeys.map((k)=>[k,{source:uniq(matrixRecords.map((r)=>String(r.sourceRootCustom?.[k]??''))),synthetic:uniq(matrixRecords.map((r)=>String(r.syntheticRootCustom?.[k]??'')))}]))};rawContextualEvidence.equivalent=rawContextualEvidence.recorded&&matrixRecords.every((r)=>contextualKeys.every((k)=>r.sourceRootCustom?.[k]===r.syntheticRootCustom?.[k]));const finePointerEvidence={mode:finePointerProbe.mode,display:finePointerProbe.display,browserVersion:finePointerProbe.browserVersion,sourceCapability:finePointerProbe.sourceCapability,syntheticCapability:finePointerProbe.syntheticCapability,focusVisible:finePointerProbe.focusVisible,activeState:finePointerProbe.activeState,comparisons:fineTotals.comparisons,capabilityMeasured:Boolean(finePointerProbe.sourceCapability?.pointerFine===true&&finePointerProbe.sourceCapability?.hoverHover===true&&finePointerProbe.syntheticCapability?.pointerFine===true&&finePointerProbe.syntheticCapability?.hoverHover===true),deltas:{computed:fineTotals.computed,geometry:fineTotals.geometry,customProperties:fineTotals.custom,state:fineTotals.state,accessibility:fineTotals.accessibility,resourceFailures:fineTotals.resourceFailures,unresolved:fineTotals.unresolved},equivalent:false};finePointerEvidence.equivalent=finePointerEvidence.capabilityMeasured&&fineTotals.comparisons===6&&fineTotals.unresolved===0&&finePointerProbe.activeState?.source===true&&finePointerProbe.activeState?.synthetic===true&&finePointerProbe.focusVisible?.source?.focusVisible===true&&finePointerProbe.focusVisible?.synthetic?.focusVisible===true;\n"""
          readiness_anchor='const readinessChecks={'
          if text.count(readiness_anchor)!=1:
              raise SystemExit('readiness anchor changed unexpectedly')
          text=text.replace(readiness_anchor,evidence_prelude+readiness_anchor,1)
          p.write_text(text)
          PY
          node --check "$HARNESS_DIR/characterize.mjs"
          test -z "$(git -C "${GITHUB_WORKSPACE}/evidence" status --porcelain)"
          echo EVIDENCE_DEPENDENCIES_PASS
          echo TAB_TRANSITION_SYNCHRONIZATION_PASS
          echo KEYBOARD_TAB_TRANSITION_SYNCHRONIZATION_PASS
          echo FAVICON_RESOURCE_FALSE_POSITIVE_FILTER_PASS
          echo FORCED_COLORS_MATRIX_PATCH_PASS
          echo RAW_CONTEXTUAL_CUSTOM_PROPERTY_SCHEMA_PASS
          echo FINE_POINTER_INDEPENDENT_HEADED_XVFB_SCHEMA_PASS

      - name: Run isolated authenticated source-vs-synthetic matrix
        shell: bash
        env:
          SOURCE_DIR: ${{ github.workspace }}/source
          SYNTH_DIR: ${{ runner.temp }}/phase3b3c-synthetic
          OUT_DIR: ${{ runner.temp }}/phase3b3c-out
          SOURCE_SHA: a4671e5f4aa6ecc56fbf1b0b619e26fcb105f22f
          SOURCE_TREE: 9ad6d3078f73d6cc88bb1f02c6f8f3d76fea9037
          EVIDENCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          xvfb-run -a -s "-screen 0 1920x1080x24" node "${RUNNER_TEMP}/phase3b3c-harness/characterize.mjs" | tee "$OUT_DIR/console-summary.json"

      - name: Final source immutability and cleanliness gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git -C source fetch origin "$SOURCE_BRANCH"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$BASE_SHA"
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$BASE_TREE"
          git -C source diff --check
          git -C source diff --exit-code
          test -z "$(git -C source status --porcelain)"
          test -z "$(git -C source diff --name-only "$BASE_SHA")"
          echo FINAL_SOURCE_UNCHANGED_PASS

      - name: Write source verification artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/phase3b3c-out"
          mkdir -p "$OUT"
          cat > "$OUT/source-verification.json" <<EOF
          {
            "authoritativeSourceSha": "$BASE_SHA",
            "authoritativeSourceTree": "$BASE_TREE",
            "characterizationBranch": "$SOURCE_BRANCH",
            "evidenceSha": "${GITHUB_SHA}",
            "expectedProductionCss": 53,
            "sourceBranchUnchangedAtFinalGate": $(test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$BASE_SHA" && echo true || echo false),
            "trackedSourceClean": $(test -z "$(git -C source status --porcelain)" && echo true || echo false)
          }
          EOF

      - name: Upload characterization artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3b3c-authenticated-admin-characterization
          path: ${{ runner.temp }}/phase3b3c-out
          if-no-files-found: warn
          retention-days: 30
