name: BASAIR V1R12-R2 Isolated Read-Only Qualification (NEVER DEPLOYS)
on:
  push:
    branches:
      - basair/admin-preview-manual-release-v1r12r2
permissions:
  contents: read
jobs:
  source-contract-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exactly the candidate HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22.16.0 and npm 10.9.2
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Frozen authorities, exact change boundary, and dispatch security static tests
        shell: bash
        run: |
          set -euo pipefail
          BASE=40d9560a76c1c3d67995e59bf2e0ba7bb09176cb
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$BASE^{tree}")" = c67b4106c9519c5fec49637606adfb2e605bc89d
          test "$(git rev-parse 2fd0973b2ff68f0ba960ff2aa83d3520d9c3c243^{tree})" = 09aa7bd7325e7c078cc817f0790402a5667a3644
          test "$(git rev-parse badbaa175eba86960559b2145e2b9cee3a20a7d5^{tree})" = 2b8c98b9e5ae35f009d69582f4a8ef16d2264f6f
          test "$(git rev-parse 9cc2439970459bd8d4ed5c57b05dbf91cd1ea3ba^{tree})" = 02c16252787467e8b5a142bc212a10d96e603524
          test "$(git rev-parse e4ace99a4dfa876f9597f1cc0dbc0e0c3e7dc0a6^{tree})" = 6695ffe2a119dc99bce77575d77120aee08586df
          test "$(git rev-parse fd76499bd70e79592a67b41d428960091043c57a^{tree})" = 254532e2fcf0329144ffdb2bcc80f1a9ee007ebb
          test "$(git rev-parse 3ec08740edd956351a091924d35254b6c24d09d4^{tree})" = 4d12ba83c40eeb5166f66dd21e89d09d42caa04e
          test "$(git rev-parse cef59ba05b3382978b4c18e83592f08227b2f9c4^{commit})" = cef59ba05b3382978b4c18e83592f08227b2f9c4
          git merge-base --is-ancestor "$BASE" HEAD
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/admin-preview-manual-v1r12r2.yml|.github/workflows/admin-preview-manual-ci-v1r12r2.yml|tests/admin-preview-manual-contract-v1r12r2.mjs|scripts/admin-preview-parse-deployment-v1r12r2.mjs|docs/admin-preview-manual-release-v1r12r2.md) ;;
              *) echo "UNAUTHORIZED PATH: $file"; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          test "$(git diff --name-only "$BASE" HEAD | wc -l)" -eq 5
          git diff --exit-code "$BASE" HEAD -- admin.js admin.html firestore.rules firebase.json .firebaserc package.json package-lock.json
          node tests/admin-preview-manual-contract-v1r12r2.mjs
          node --check scripts/admin-preview-parse-deployment-v1r12r2.mjs
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Clean build, frozen five-file closure, separate package audit and target proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = v22.16.0
          test "$(npm -v)" = 10.9.2
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = 1a4b3f5403ceb7e516ee1c13d0a79be1ba4276784a792c17064cf7fdf424cc76
          npm ci
          npm audit --json > "$RUNNER_TEMP/v1r12r2-package-audit.json" || true
          node -e 'const f=require("fs");const a=JSON.parse(f.readFileSync(process.env.RUNNER_TEMP+"/v1r12r2-package-audit.json","utf8"));console.log("APPLICATION_AUDIT="+JSON.stringify(a.metadata?.vulnerabilities));if(a.metadata?.vulnerabilities?.total!==0)process.exit(1)'
          npm run build
          BASAIR_NPM_VERSION="$(npm --version)" node tests/admin-only-asset-closure-v1r10r1.mjs
          BASAIR_NPM_VERSION="$(npm --version)" node scripts/admin-dedicated-hosting-candidate-v1r11.mjs
          node tests/admin-dedicated-hosting-contract-v1r11.mjs
          node tests/admin-preview-target-guard-v1r12.mjs
          node tests/admin-preview-manual-contract-v1r12r2.mjs
          test -z "$(git status --porcelain)"
          echo READ_ONLY_CI_NO_FIREBASE_AUTH_NO_PREVIEW_DEPLOY=PASS
      - name: Inspect final Git identity and preserve evidence only
        shell: bash
        run: |
          set -euo pipefail
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"
      - name: Retain JSON-only static proof (no deployable Admin bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basair-v1r12r2-readonly-qualification
          path: |
            ${{ runner.temp }}/v1r12r2-package-audit.json
            ${{ runner.temp }}/v1r10r1-asset-manifest.json
            ${{ runner.temp }}/v1r11-candidate-summary.json
            ${{ runner.temp }}/v1r12-preview-preflight.json
            ${{ runner.temp }}/v1r12r2-manual-contract.json
          if-no-files-found: warn
          retention-days: 7
