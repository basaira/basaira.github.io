name: BASAIR V1R16 Solo Operator Safety Qualification READ ONLY NO DEPLOY
on:
  push:
    branches:
      - basair/admin-solo-operator-safety-qualification-v1r16
permissions:
  contents: read
jobs:
  isolated-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact isolated candidate with no persistent credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22.16.0 and npm 10.9.2
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Verify frozen V1R15, exact 5 paths, and V1R16 positive and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse ac644985086e5dbb792a3b1236008257868fecc5^{tree})" = d48ef39c2f504c84268e5f529652a1f67980a240
          test "$(git rev-parse 74027299ba927dc16db062d55e4b8ff17696ad55^{tree})" = 2a6165be8d360dd2a4b216de55d778e271d92c46
          test "$(git rev-parse fe93498beadf3d4f6efe65acc63559741e0f7006^{tree})" = 90caf98980935a1c98010a33fbb39510bd3e28d4
          test "$(git rev-parse 2fd0973b2ff68f0ba960ff2aa83d3520d9c3c243^{tree})" = 09aa7bd7325e7c078cc817f0790402a5667a3644
          test "$(git rev-parse cef59ba05b3382978b4c18e83592f08227b2f9c4^{commit})" = cef59ba05b3382978b4c18e83592f08227b2f9c4
          git merge-base --is-ancestor ac644985086e5dbb792a3b1236008257868fecc5 HEAD
          test "$(git diff --name-only ac644985086e5dbb792a3b1236008257868fecc5 HEAD | wc -l)" -eq 5
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/admin-solo-verification-manual-v1r16.yml|.github/workflows/admin-solo-verification-ci-v1r16.yml|scripts/admin-solo-operator-guards-v1r16.mjs|tests/admin-solo-operator-guards-v1r16.mjs|docs/admin-solo-operator-safety-v1r16.md) ;;
              *) echo "UNAUTHORIZED_V1R16_FILE $file"; exit 1 ;;
            esac
          done < <(git diff --name-only ac644985086e5dbb792a3b1236008257868fecc5 HEAD)
          git diff --exit-code ac644985086e5dbb792a3b1236008257868fecc5 HEAD -- package.json package-lock.json admin.js admin.html firebase.json .firebaserc firestore.rules
          node --check scripts/admin-solo-operator-guards-v1r16.mjs
          node --check tests/admin-solo-operator-guards-v1r16.mjs
          node tests/admin-solo-operator-guards-v1r16.mjs
          env MODE=VERIFY_ONLY REVIEWED_SHA="$GITHUB_SHA" REVIEWED_TREE="$(git rev-parse HEAD^{tree})" SITE_ID=basair-admin node scripts/admin-solo-operator-guards-v1r16.mjs source
          echo V1R16_REAL_VERIFY_ONLY_WITHOUT_OWNER_DEPLOY_AUTH=PASS
          node tests/admin-preview-integrated-guards-v1r15.mjs
          node tests/admin-preview-guards-v1r14.mjs
          node tests/admin-vite-security-contract-v1r13.mjs
          node tests/admin-preview-manual-contract-v1r12r2.mjs
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Zero-vulnerability clean install, full checks and exact five Admin assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = v22.16.0
          test "$(npm -v)" = 10.9.2
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = 62a543b624975ff938f77490ffcedd17a5771176af5a63e9e20809429013525a
          npm ci
          npm ls vite
          npm audit --json > "$RUNNER_TEMP/v1r16-audit.json" || true
          node -e 'const a=require(process.env.RUNNER_TEMP+"/v1r16-audit.json");console.log("V1R16_AUDIT="+JSON.stringify(a.metadata?.vulnerabilities));if(a.metadata?.vulnerabilities?.total!==0)process.exit(1)'
          npm run verify
          BASAIR_NPM_VERSION="$(npm --version)" node tests/admin-only-asset-closure-v1r10r1.mjs
          BASAIR_NPM_VERSION="$(npm --version)" node scripts/admin-dedicated-hosting-candidate-v1r11.mjs
          node tests/admin-dedicated-hosting-contract-v1r11.mjs
          node tests/admin-preview-target-guard-v1r12.mjs
          test -z "$(git status --porcelain)"
      - name: Read-only local Chromium CSP XFO and separate test tool audit
        shell: bash
        run: |
          set -euo pipefail
          export BASAIR_TEST_TOOLS="$RUNNER_TEMP/v1r16-playwright"
          npm install --prefix "$BASAIR_TEST_TOOLS" --save-exact --no-audit playwright@1.55.1
          npm audit --prefix "$BASAIR_TEST_TOOLS" --json > "$RUNNER_TEMP/v1r16-tool-audit.json" || true
          node -e 'const a=require(process.env.RUNNER_TEMP+"/v1r16-tool-audit.json");console.log("V1R16_TOOL_AUDIT="+JSON.stringify(a.metadata?.vulnerabilities));if(a.metadata?.vulnerabilities?.total!==0)process.exit(1)'
          "$BASAIR_TEST_TOOLS/node_modules/.bin/playwright" install --with-deps chromium
          BASAIR_ADMIN_ONLY_DIR="$RUNNER_TEMP/basair-v1r11-candidate/admin-only" node tests/admin-http-frame-proof-v1r10r1.mjs
          test -z "$(git status --porcelain)"
          echo V1R16_NO_GOOGLE_CREDENTIALS_NO_FIREBASE_DEPLOYMENT=PASS
      - name: Report final Git identity even on failure
        if: always()
        shell: bash
        run: |
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          git diff --name-only ac644985086e5dbb792a3b1236008257868fecc5 HEAD
      - name: Upload sanitized read-only JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basair-v1r16-solo-readonly-qualification
          path: |
            ${{ runner.temp }}/v1r16-verify_only-proof.json
            ${{ runner.temp }}/v1r16-audit.json
            ${{ runner.temp }}/v1r16-tool-audit.json
            ${{ runner.temp }}/v1r10r1-asset-manifest.json
            ${{ runner.temp }}/v1r11-candidate-summary.json
            ${{ runner.temp }}/v1r12-preview-preflight.json
            ${{ runner.temp }}/v1r10r1-http-frame-proof.json
          retention-days: 7
          if-no-files-found: warn
