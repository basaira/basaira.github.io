name: Phase 3B-1 Preimplementation Audit

on:
  push:
    branches:
      - basair/phase-3b-1-verification-evidence

permissions:
  contents: read

jobs:
  audit-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout evidence infrastructure
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit exact closed 3B-0 source
        shell: bash
        run: |
          set -euo pipefail
          TARGET=07477307402857cb73ff80eb726a43faa5e72ad3
          TARGET_TREE=ff6b9fade02f4c7311c9ea9692a7e89790039767
          CHECKER_BLOB=3dfc0605151abd9a9e6514a492a9b94137c96c63

          git fetch --all --prune
          rm -rf /tmp/basair-3b1-source
          git worktree add --detach /tmp/basair-3b1-source "$TARGET"
          test "$(git -C /tmp/basair-3b1-source rev-parse HEAD)" = "$TARGET"
          test "$(git -C /tmp/basair-3b1-source rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git -C /tmp/basair-3b1-source status --porcelain)"
          test "$(git -C /tmp/basair-3b1-source hash-object scripts/verify-css-consolidation-preflight.mjs)" = "$CHECKER_BLOB"

          cd /tmp/basair-3b1-source
          node scripts/verify-css-consolidation-preflight.mjs --out="$GITHUB_WORKSPACE/structural.json"

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const root = '/tmp/basair-3b1-source';
          const workspace = process.env.GITHUB_WORKSPACE;
          const structural = JSON.parse(fs.readFileSync(path.join(workspace,'structural.json'),'utf8'));
          const first = 'acquisition-precision-native-v2.css';
          const second = 'acquisition-polish-v2.css';
          const requiredRoutes = ['/en/','/en/quran-kids/','/en/quran-adults/','/en/arabic/','/ru/','/ru/quran/','/ru/arabic/','/uz/','/uz/quran/','/uz/arabic/'];
          const failures = [];
          const acq = structural.structuralSnapshot.entries.filter(e => e.surface === 'ACQUISITION');
          const actualRoutes = acq.map(e => e.route).sort();
          const expectedRoutes = [...requiredRoutes].sort();
          if (JSON.stringify(actualRoutes) !== JSON.stringify(expectedRoutes)) failures.push(`Acquisition routes mismatch: ${JSON.stringify(actualRoutes)}`);
          const routeProof = acq.map(e => {
            const eff = e.effectiveImportedOrder;
            const direct = e.directStylesheets;
            const fi = eff.indexOf(first), si = eff.indexOf(second);
            const fdi = direct.indexOf(first), sdi = direct.indexOf(second);
            const exactEffectiveAdjacency = fi >= 0 && si === fi + 1 && eff.filter(x=>x===first).length===1 && eff.filter(x=>x===second).length===1;
            const exactDirectAdjacency = fdi >= 0 && sdi === fdi + 1 && direct.filter(x=>x===first).length===1 && direct.filter(x=>x===second).length===1;
            if (!exactEffectiveAdjacency) failures.push(`${e.route}: effective pair not exact adjacent precision->polish`);
            if (!exactDirectAdjacency) failures.push(`${e.route}: direct links not exact adjacent precision->polish`);
            return {route:e.route, html:e.path, firstEffectiveIndex:fi, secondEffectiveIndex:si, firstDirectIndex:fdi, secondDirectIndex:sdi, exactEffectiveAdjacency, exactDirectAdjacency};
          });
          const importRefs = [];
          for (const [owner, deps] of Object.entries(structural.structuralSnapshot.importGraph || {})) {
            for (const dep of deps) if (dep === first || dep === second) importRefs.push({owner,dep});
          }
          if (importRefs.length) failures.push(`Candidate @import references found: ${JSON.stringify(importRefs)}`);

          const allFiles = new Set();
          function walk(d){for(const ent of fs.readdirSync(d,{withFileTypes:true})){if(['.git','node_modules','dist'].includes(ent.name))continue;const p=path.join(d,ent.name);if(ent.isDirectory())walk(p);else allFiles.add(path.relative(root,p).split(path.sep).join('/'));}}
          walk(root);
          function clean(u){return u.split(/[?#]/)[0];}
          function resolveLocal(from,u){u=clean(u.trim());if(!u || /^(?:[a-z]+:)?\/\//i.test(u) || u.startsWith('data:')) return null; const base=u.startsWith('/')?'':path.posix.dirname(from); const p=path.posix.normalize(path.posix.join(base,u.replace(/^\/+/,''))).replace(/^\.\//,''); return allFiles.has(p)?p:null;}
          const runtime = new Set();
          const queue = [];
          for (const h of structural.structuralSnapshot.productionHtmlEntries) {
            const s=fs.readFileSync(path.join(root,h),'utf8');
            for (const m of s.matchAll(/<script\b[^>]*\bsrc\s*=\s*(["'])(.*?)\1[^>]*>/gi)) { const p=resolveLocal(h,m[2]); if(p && /\.(?:js|mjs|ts)$/.test(p) && !runtime.has(p)){runtime.add(p);queue.push(p);} }
          }
          while(queue.length){const f=queue.shift(),s=fs.readFileSync(path.join(root,f),'utf8'); const specs=[]; for(const m of s.matchAll(/\bimport\s+(?:[^'"`]*?\sfrom\s*)?(["'])(.*?)\1/g)) specs.push(m[2]); for(const m of s.matchAll(/\bimport\s*\(\s*(["'])(.*?)\1\s*\)/g)) specs.push(m[2]); for(const spec of specs){const p=resolveLocal(f,spec);if(p&&/\.(?:js|mjs|ts)$/.test(p)&&!runtime.has(p)){runtime.add(p);queue.push(p);}}}
          const runtimeFilenameRefs=[]; const runtimeCssomHits=[];
          for(const f of [...runtime].sort()){
            const s=fs.readFileSync(path.join(root,f),'utf8');
            for(const name of [first,second]) if(s.includes(name)) runtimeFilenameRefs.push({file:f,name});
            for(const re of [/document\.styleSheets/g,/querySelector(?:All)?\s*\([^)]*(?:link|stylesheet|href)/g,/getElementsByTagName\s*\(\s*["']link["']/g]){re.lastIndex=0;let m;while((m=re.exec(s)))runtimeCssomHits.push({file:f,line:s.slice(0,m.index).split('\n').length,match:m[0]});}
          }
          if(runtimeFilenameRefs.length) failures.push(`Production runtime candidate filename refs: ${JSON.stringify(runtimeFilenameRefs)}`);

          const b1=fs.readFileSync(path.join(root,first)); const b2=fs.readFileSync(path.join(root,second)); const concat=Buffer.concat([b1,b2]);
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const out={
            targetHead:'07477307402857cb73ff80eb726a43faa5e72ad3',
            targetTree:'ff6b9fade02f4c7311c9ea9692a7e89790039767',
            checkerBlob:'3dfc0605151abd9a9e6514a492a9b94137c96c63',
            productionCssCount:structural.counts.productionCssFiles,
            acquisitionRouteCount:acq.length,
            requiredRoutes,
            routeProof,
            candidateImportReferences:importRefs,
            runtimeReachableJs:[...runtime].sort(),
            productionRuntimeCandidateFilenameReferences:runtimeFilenameRefs,
            productionRuntimeCssomHits:runtimeCssomHits,
            candidateBytes:{first:b1.length,second:b2.length,combined:concat.length},
            candidateSha256:{first:sha(b1),second:sha(b2),exactConcatenation:sha(concat)},
            directReferenceCounts:{first:routeProof.filter(x=>x.firstDirectIndex>=0).length,second:routeProof.filter(x=>x.secondDirectIndex>=0).length},
            leastChangeAnalysis:{htmlEditsIfFirstSurvives:10,htmlEditsIfSecondSurvives:10,preferredSurvivor:first,reason:'Both filenames are direct-linked once and adjacent in all 10 Acquisition entries. Keeping the first preserves the merged block at the original pair start position; implementation is append second bytes to first, delete second, and remove only the second link from each entry.'},
            failures,
            pass:failures.length===0
          };
          fs.writeFileSync(path.join(workspace,'phase-3b1-preimplementation-audit.json'),JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          if(failures.length) process.exit(1);
          NODE

      - name: Upload preimplementation audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-3b1-preimplementation-audit
          path: |
            structural.json
            phase-3b1-preimplementation-audit.json
          if-no-files-found: error
          retention-days: 7
