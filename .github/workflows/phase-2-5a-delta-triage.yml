name: Phase 2.5A Delta Triage
on:
  push:
    branches: ["basair/phase-2.5a-delta-triage"]
permissions:
  contents: read
jobs:
  canonical-table:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Recompute canonical 40-token disposition from raw observations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object phase-2.5-browser-characterization.json)" = b79d09a7639183665ed23b33dbeca0e6937e3fab
          node <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('phase-2.5-browser-characterization.json','utf8'));
          const groups=new Map(); for(const r of d.conflictTokenCharacterization){if(!groups.has(r.token))groups.set(r.token,[]);groups.get(r.token).push(r)}
          const contextual=new Set(['--acq-layout-gutter','--acq-layout-section','--acq-type-display','--acq-type-section','--admin-type-body','--admin-type-panel','--admin-type-support','--admin-type-title','--home-journey-section','--layout-gutter','--layout-section','--line','--muted','--pathway-accent','--pathway-accent-ink','--pathway-summary-bg','--pathway-summary-ink','--pathway-summary-line','--pathway-summary-muted','--type-body','--type-display','--type-section','--type-subsection']);
          const review=new Set(['--course-btn-glow','--course-btn-press','--layout-section-compact','--mobile-drawer-hidden-x']);
          const unobs=new Set(['--dossier-accent','--dossier-border','--fo-bg','--fo-border','--fo-border-strong','--fo-danger-bg','--fo-muted','--fo-shadow','--fo-success-bg','--fo-surface','--fo-surface-strong','--fo-text','--folio-opacity']);
          const out=[];
          for(const [token,rs] of [...groups].sort((a,b)=>a[0].localeCompare(b[0]))){
            const observedRows=rs.filter(r=>r.observed);
            const vals=[]; for(const r of observedRows) for(const v of (r.values||[])){const x=v.normalized??v.computedValue??v.value??String(v); if(!vals.includes(x)) vals.push(x)}
            const surfaces=[...new Set(observedRows.map(r=>r.surface))].sort();
            const bp=rs.some(r=>r.viewportChanges===true || (Array.isArray(r.viewportChanges)&&r.viewportChanges.length>0));
            const st=rs.some(r=>r.stateChanges===true || (Array.isArray(r.stateChanges)&&r.stateChanges.length>0));
            const cls=contextual.has(token)?'CONTEXTUAL — MUST NOT GLOBALIZE':review.has(token)?'REVIEW CANDIDATE — NOT YET APPROVED FOR CONSOLIDATION':unobs.has(token)?'UNOBSERVED — NO CONSOLIDATION EVIDENCE':'ERROR';
            const reason=cls.startsWith('UNOBSERVED')?'No rendered-sample value in the 48 CSS states.':cls.startsWith('REVIEW')?'Observed with one stable computed value and no breakpoint/state change in the sampled matrix; this is evidence for review, not consolidation approval.':(token==='--line'||token==='--muted')?'Different computed values across Acquisition and Admin surfaces; surface semantics must remain isolated.':bp?'Computed value changes by viewport/breakpoint and is therefore contextual.':'Observed surface/context variation requires component/surface ownership; do not globalize.';
            out.push({token,observed:observedRows.length>0,distinctValueCount:vals.length,distinctValues:vals,surfaces,breakpointDependent:bp,stateDependent:st,classification:cls,reason});
          }
          console.log('TABLE_JSON',JSON.stringify(out,null,2));
          console.log('PARTITION',JSON.stringify({contextual:out.filter(x=>x.classification.startsWith('CONTEXTUAL')).length,review:out.filter(x=>x.classification.startsWith('REVIEW')).length,unobserved:out.filter(x=>x.classification.startsWith('UNOBSERVED')).length,total:out.length}));
          console.log('BREAKPOINT',JSON.stringify(out.filter(x=>x.breakpointDependent).map(x=>x.token)));
          console.log('STATE',JSON.stringify(out.filter(x=>x.stateDependent).map(x=>x.token)));
          console.log('ASSERTIONS',JSON.stringify({total:d.criticalOwnershipAssertions.length,passed:d.criticalOwnershipAssertions.filter(x=>x.pass===true).length,failed:d.criticalOwnershipAssertions.filter(x=>x.pass!==true).length,nameCounts:Object.fromEntries([...new Set(d.criticalOwnershipAssertions.map(x=>x.name))].sort().map(n=>[n,d.criticalOwnershipAssertions.filter(x=>x.name===n).length]))},null,2));
          console.log('RAW_COUNTS',JSON.stringify({states:d.surfaceDetection.length,conflictRows:d.conflictTokenCharacterization.length,baselineRows:d.baselineComparison.length,screenshots:d.screenshots.length},null,2));
          NODE
          test -z "$(git status --porcelain)"