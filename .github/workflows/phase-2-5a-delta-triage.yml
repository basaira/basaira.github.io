name: Phase 2.5A Delta Triage
on:
  push:
    branches: ["basair/phase-2.5a-delta-triage"]
permissions:
  contents: read
jobs:
  recover-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Recover original Phase 2.5 capture algorithm and target evidence
        shell: bash
        run: |
          set -euo pipefail
          git show d02415a3144d6e991adb8386278244cad7fc4e0f:.github/workflows/phase-2-5-browser-characterization-rerun.yml >/tmp/orig.yml
          awk '/phase25-characterize.b64/{flag=1;next}/^          B64$/{flag=0}flag{gsub(/^          /,"");print}' /tmp/orig.yml >/tmp/orig.b64
          base64 -d /tmp/orig.b64 >/tmp/orig.mjs
          node --check /tmp/orig.mjs
          echo '--- relevant algorithm lines ---'
          grep -nE 'mainCardPanel|fonts\.ready|setTimeout|waitFor|sleep|screenshot|representative|fingerprint|categories|dashboard|viewport' /tmp/orig.mjs | head -220
          echo '--- target screenshots ---'
          node <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('phase-2.5-browser-characterization.json','utf8'));
          console.log(JSON.stringify(d.screenshots.filter(s=>s.logicalName.includes('/en/quran-kids/:wide')),null,2));
          console.log('TARGET_FINAL_FP',JSON.stringify(d.representativeElementFingerprints.find(x=>x.route==='/en/quran-kids/'&&x.viewport==='wide')?.categories?.mainCardPanel,null,2));
          console.log('TARGET_BASELINE',JSON.stringify(d.baselineComparison[11],null,2));
          NODE