name: Phase 2.5A Delta Triage
on:
  push:
    branches: ["basair/phase-2.5a-delta-triage"]
permissions:
  contents: read
jobs:
  inspect-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Robust raw evidence introspection
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
          echo "JSON_BLOB=$(git hash-object phase-2.5-browser-characterization.json)"
          test "$(git hash-object phase-2.5-browser-characterization.json)" = "b79d09a7639183665ed23b33dbeca0e6937e3fab"
          test -z "$(git status --porcelain)"
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('phase-2.5-browser-characterization.json','utf8'));
          const typ=v=>Array.isArray(v)?`array(${v.length})`:(v&&typeof v==='object'?`object(${Object.keys(v).length})`:`${typeof v}:${String(v).slice(0,80)}`);
          console.log('ROOT_TYPE',typ(d));
          console.log('ROOT_KEYS',JSON.stringify(Object.keys(d)));
          for(const [k,v] of Object.entries(d)) console.log('ROOT_CHILD',k,typ(v));
          const cat5=[]; const hits84=[]; const named=[];
          function walk(x,path=''){
            if(x===84 || (typeof x==='string' && /(^|\D)84(?:\/84)?(\D|$)/.test(x))) hits84.push({path,value:x});
            if(!x||typeof x!=='object') return;
            if(!Array.isArray(x) && x.category===5) cat5.push({path,value:x});
            if(!Array.isArray(x)){
              for(const k of Object.keys(x)) if(/^(routes|viewports|observations|ownership|stateChecks|coverage|tokenAuthority|conflictEvaluationMethod|baselineComparison)$/i.test(k)) named.push({path:path?`${path}.${k}`:k,type:typ(x[k])});
            }
            if(Array.isArray(x)) x.forEach((v,i)=>walk(v,`${path}[${i}]`));
            else Object.entries(x).forEach(([k,v])=>walk(v,path?`${path}.${k}`:k));
          }
          walk(d,'');
          console.log('NAMED_PATHS',JSON.stringify(named,null,2));
          console.log('CATEGORY5_COUNT',cat5.length);
          console.log('CATEGORY5',JSON.stringify(cat5,null,2));
          console.log('HITS84',JSON.stringify(hits84,null,2));
          const bc=d.baselineComparison;
          if(Array.isArray(bc)){
            const targetRows=bc.map((v,i)=>({i,v})).filter(({v})=>JSON.stringify(v).includes('"category":5'));
            console.log('BC_TARGET_ROWS',JSON.stringify(targetRows,null,2));
            if(targetRows[0]) console.log('BC_TARGET_KEYS',JSON.stringify(Object.keys(targetRows[0].v)));
          }
          NODE