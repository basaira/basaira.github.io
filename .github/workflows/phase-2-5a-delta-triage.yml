name: Phase 2.5A Delta Triage
on:
  push:
    branches: ["basair/phase-2.5a-delta-triage"]
permissions:
  contents: read
jobs:
  isolate-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare exact Phase 0 and Phase 2 trees
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/basair-p0 6e46539a02db342838d7c113a45ff558192658e5
          git worktree add --detach /tmp/basair-p2 1504baad33b2123056877c1e92f4e2d558c00d51
          test "$(git -C /tmp/basair-p0 rev-parse HEAD^{tree})" = "8c18f5050f4ffa33c2317823e540766a4b2bc9ff"
          test "$(git -C /tmp/basair-p2 rev-parse HEAD^{tree})" = "1d987040d0158387d0425d6e6ed00fe2a68ec617"
          test -z "$(git -C /tmp/basair-p0 status --porcelain)"
          test -z "$(git -C /tmp/basair-p2 status --porcelain)"
          cd /tmp/basair-p0 && npm ci && npm run build
          cd /tmp/basair-p2 && npm ci && npm run verify && npm run build && git diff --check
          echo 'PHASE2_CONTRACT_RECHECK=PASS'
      - name: Prepare isolated browser tooling and servers
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_BIN"
          echo "BROWSER_BIN=$BROWSER_BIN" >> "$GITHUB_ENV"
          "$BROWSER_BIN" --version
          mkdir -p /tmp/basair-browser-tooling && cd /tmp/basair-browser-tooling
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 >/dev/null
          echo "PUPPETEER=$(node -p "require('puppeteer-core/package.json').version")"
          echo "NODE=$(node --version)"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/basair-p2/dist >/tmp/p2-server.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/basair-p0/dist >/tmp/p0-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/en/quran-kids/ >/dev/null && curl -fsS http://127.0.0.1:4174/en/quran-kids/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run 5x5 isolated measurements with cascade provenance
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/basair-browser-tooling/triage.cjs <<'JS'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          const crypto = require('crypto');

          const route = '/en/quran-kids/';
          const viewport = {name:'wide',width:1920,height:1080,deviceScaleFactor:1};
          const bases = {phase0:'http://127.0.0.1:4174',phase2:'http://127.0.0.1:4173'};
          const browser = await puppeteer.launch({executablePath:process.env.BROWSER_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const version = await browser.version();

          async function originalSettle(page){
            await page.evaluate(async()=>{
              if(document.fonts?.ready) await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1800))]);
            }).catch(()=>{});
            await new Promise(r=>setTimeout(r,180));
          }

          async function panelSnapshot(page){
            return page.evaluate(()=>{
              const visible=el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'};
              const descriptor=el=>{if(!el)return null;const sec=el.closest?.('section,main,header,nav,form,article');const classes=el.classList?[...el.classList].slice(0,4).join('.'):'';return `${el.tagName.toLowerCase()}${el.id?'#'+el.id:''}${classes?'.'+classes:''}${sec&&sec!==el?` @ ${sec.tagName.toLowerCase()}${sec.id?'#'+sec.id:''}`:''}`};
              const visibleElements=[...document.querySelectorAll('body *')].filter(visible);
              const el=visibleElements.filter(el=>['ARTICLE','FORM','DIV','SECTION'].includes(el.tagName)).map(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();const score=((s.backgroundColor!=='rgba(0, 0, 0, 0)'&&s.backgroundColor!=='transparent')?3:0)+(parseFloat(s.borderTopWidth)>0?2:0)+(s.boxShadow!=='none'?2:0)+(r.width*r.height>15000?1:0);return {el,score}}).sort((a,b)=>b.score-a.score)[0]?.el||null;
              if(!el) return null;
              const s=getComputedStyle(el), r=el.getBoundingClientRect(), root=getComputedStyle(document.documentElement);
              const ancestors=[]; for(let n=el;n&&ancestors.length<8;n=n.parentElement){const cs=getComputedStyle(n);ancestors.push({tag:n.tagName.toLowerCase(),id:n.id||null,classes:[...n.classList],color:cs.color,inlineStyle:n.getAttribute('style')})}
              const links=[...document.querySelectorAll('link[rel="stylesheet"]')].map(l=>({href:l.href,sheet:!!l.sheet,disabled:l.disabled,media:l.media||''}));
              const cssRulesFor=(node)=>{const out=[];let order=0;function visit(rules,href,media=[]){for(const rule of [...rules]){order++;try{if(rule.cssRules){let ok=true,next=media;if(rule.conditionText){ok=matchMedia(rule.conditionText).matches;next=[...media,{condition:rule.conditionText,matches:ok}]}if(ok)visit(rule.cssRules,href,next);continue}if(rule.selectorText&&node.matches(rule.selectorText)){const color=rule.style?.getPropertyValue('color')?.trim();const ink=rule.style?.getPropertyValue('--ink')?.trim();const primary=rule.style?.getPropertyValue('--color-text-primary')?.trim();if(color||ink||primary)out.push({selector:rule.selectorText,color,ink,primary,colorImportant:rule.style?.getPropertyPriority('color')||'',href,order,media:media.slice()})}}catch{}}}
                for(const sheet of [...document.styleSheets]){try{visit(sheet.cssRules,sheet.href||'INLINE')}catch{}}return out};
              return {
                descriptor:descriptor(el), directSelectorMatch: el===document.querySelector('div.dashboard.reveal'),
                color:s.color, backgroundColor:s.backgroundColor, borderColor:s.borderColor,
                rect:{x:r.x,y:r.y,width:r.width,height:r.height},
                rootInk:root.getPropertyValue('--ink').trim(), rootPrimary:root.getPropertyValue('--color-text-primary').trim(),
                bodyColor:getComputedStyle(document.body).color,
                fontFamily:s.fontFamily,fontSize:s.fontSize,lineHeight:s.lineHeight,fontWeight:s.fontWeight,
                fontsStatus:document.fonts?.status||null,fontLoaded:document.fonts?.check?.(`${s.fontSize} ${s.fontFamily}`)??null,
                textMetrics:{textLength:(el.innerText||'').length,scrollWidth:el.scrollWidth,clientWidth:el.clientWidth,scrollHeight:el.scrollHeight,clientHeight:el.clientHeight},
                viewport:{innerWidth,innerHeight,clientWidth:document.documentElement.clientWidth,clientHeight:document.documentElement.clientHeight,scrollbarWidth:innerWidth-document.documentElement.clientWidth,dpr:devicePixelRatio},
                document:{dir:document.documentElement.dir||getComputedStyle(document.documentElement).direction,lang:document.documentElement.lang,readyState:document.readyState},
                pseudo:{before:{color:getComputedStyle(el,'::before').color,content:getComputedStyle(el,'::before').content},after:{color:getComputedStyle(el,'::after').color,content:getComputedStyle(el,'::after').content}},
                links, ancestors, matchedColorRules:cssRulesFor(el), bodyMatchedRules:cssRulesFor(document.body)
              };
            });
          }

          async function cdpProvenance(page){
            const cdp=await page.createCDPSession(); await cdp.send('DOM.enable'); await cdp.send('CSS.enable');
            const doc=await cdp.send('DOM.getDocument',{depth:-1,pierce:true});
            const q=await cdp.send('DOM.querySelector',{nodeId:doc.root.nodeId,selector:'div.dashboard.reveal'});
            const m=await cdp.send('CSS.getMatchedStylesForNode',{nodeId:q.nodeId});
            const slimRule=r=>({selector:r.rule?.selectorList?.text||null,origin:r.rule?.origin||null,styleSheetId:r.rule?.styleSheetId||null,range:r.rule?.style?.range||null,properties:(r.rule?.style?.cssProperties||[]).filter(p=>p.name==='color'||p.name==='--ink'||p.name==='--color-text-primary').map(p=>({name:p.name,value:p.value,important:p.important||false,range:p.range||null})),specificities:(r.rule?.selectorList?.selectors||[]).map(s=>s.specificity||null)});
            const direct=(m.matchedCSSRules||[]).map(slimRule).filter(r=>r.properties.length);
            const inherited=(m.inherited||[]).map((x,i)=>({level:i,inline:(x.inlineStyle?.cssProperties||[]).filter(p=>p.name==='color'||p.name==='--ink'||p.name==='--color-text-primary').map(p=>({name:p.name,value:p.value,important:p.important||false})),rules:(x.matchedCSSRules||[]).map(slimRule).filter(r=>r.properties.length)})).filter(x=>x.inline.length||x.rules.length);
            await cdp.detach(); return {direct,inherited};
          }

          async function one(label,index){
            const context=await browser.createBrowserContext(); const page=await context.newPage();
            await page.setViewport(viewport); await page.emulateMediaFeatures([{name:'prefers-reduced-motion',value:'reduce'},{name:'prefers-color-scheme',value:'light'}]);
            await page.setJavaScriptEnabled(false);
            const failed=[]; page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||'failed'}));
            const response=await page.goto(new URL(route,bases[label]).href,{waitUntil:'domcontentloaded',timeout:15000});
            await originalSettle(page);
            const originalPoint=await panelSnapshot(page);
            let stylesheetSettlement=true;
            try{await page.waitForFunction(()=>[...document.querySelectorAll('link[rel="stylesheet"]')].every(l=>!!l.sheet),{timeout:5000});}catch{stylesheetSettlement=false}
            const settledPoint=await panelSnapshot(page);
            const cdp=await cdpProvenance(page);
            const png=await page.screenshot({fullPage:false});
            const screenshotSha256=crypto.createHash('sha256').update(png).digest('hex');
            const out={label,index,status:response?.status()||null,stylesheetSettlement,failedResources:failed,originalPoint,settledPoint,cdp,screenshotSha256};
            await context.close(); return out;
          }

          const observations=[];
          for(let i=1;i<=5;i++){observations.push(await one('phase0',i)); observations.push(await one('phase2',i));}
          const result={environment:{browser:version,puppeteer:require('puppeteer-core/package.json').version,node:process.version,platform:process.platform,viewport,reducedMotion:'reduce',colorScheme:'light',javaScriptEnabled:false,originalDelayMs:180,fontReadyTimeoutMs:1800},route,observations};
          fs.writeFileSync('/tmp/phase25a-rerun.json',JSON.stringify(result,null,2));
          console.log('RERUN_SUMMARY',JSON.stringify(observations.map(o=>({label:o.label,index:o.index,originalColor:o.originalPoint?.color,settledColor:o.settledPoint?.color,body:o.settledPoint?.bodyColor,ink:o.settledPoint?.rootInk,primary:o.settledPoint?.rootPrimary,descriptor:o.settledPoint?.descriptor,rect:o.settledPoint?.rect,stylesheetsSettled:o.stylesheetSettlement,failed:o.failedResources.length,screenshotSha256:o.screenshotSha256})),null,2));
          console.log('PHASE0_PROVENANCE',JSON.stringify(observations.find(o=>o.label==='phase0'),null,2));
          console.log('PHASE2_PROVENANCE',JSON.stringify(observations.find(o=>o.label==='phase2'),null,2));
          await browser.close();
          JS
          cd /tmp/basair-browser-tooling
          node --check triage.cjs
          node triage.cjs
      - name: Prove audit checkout itself remains clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo 'AUDIT_CHECKOUT_CLEAN=YES'