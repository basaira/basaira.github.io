name: Phase 2.5A Delta Triage
on:
  push:
    branches: ["basair/phase-2.5a-delta-triage"]
permissions:
  contents: read
jobs:
  exact-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Extract exact category-5 record and raw token partition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object phase-2.5-browser-characterization.json)" = "b79d09a7639183665ed23b33dbeca0e6937e3fab"
          node <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('phase-2.5-browser-characterization.json','utf8'));
          console.log('BC0_KEYS',JSON.stringify(Object.keys(d.baselineComparison[0])));
          const rows=d.baselineComparison.map((v,i)=>({i,...v})).filter(v=>v.route==='/en/'&&v.viewport==='desktop');
          console.log('EN_DESKTOP',JSON.stringify(rows,null,2));
          const shots=d.screenshots.map((v,i)=>({i,...v})).filter(v=>v.route==='/en/'&&v.viewport==='desktop');
          console.log('SHOTS',JSON.stringify(shots,null,2));
          const matches=[];
          function walk(x,path=''){
            if(!x||typeof x!=='object')return;
            if(!Array.isArray(x)){
              const s=JSON.stringify(x);
              if(s.includes('rgb(205, 183, 116)')||s.includes('rgb(212, 175, 55)')||/unrelated\/unexplained computed-style delta/i.test(s)) matches.push({path,value:x});
            }
            if(Array.isArray(x))x.forEach((v,i)=>walk(v,`${path}[${i}]`)); else Object.entries(x).forEach(([k,v])=>walk(v,path?`${path}.${k}`:k));
          }
          walk(d.baselineComparison,'baselineComparison'); console.log('MATCHES',JSON.stringify(matches.slice(-15),null,2));
          const groups=new Map(); for(const r of d.conflictTokenCharacterization){if(!groups.has(r.token))groups.set(r.token,[]);groups.get(r.token).push(r)}
          const table=[];
          for(const [token,rs] of [...groups].sort((a,b)=>a[0].localeCompare(b[0]))){
            const obs=rs.filter(r=>r.observed); const values=[...new Set(obs.flatMap(r=>r.values.map(v=>v.normalized??v.computedValue)))]; const surfaces=[...new Set(obs.map(r=>r.surface))];
            const bp=rs.some(r=>r.viewportChanges===true); const st=rs.some(r=>Array.isArray(r.stateChanges)&&r.stateChanges.length>0);
            const cls=!obs.length?'UNOBSERVED — NO CONSOLIDATION EVIDENCE':(values.length>1||bp||st?'CONTEXTUAL — MUST NOT GLOBALIZE':'REVIEW CANDIDATE — NOT YET APPROVED FOR CONSOLIDATION');
            table.push({token,observed:!!obs.length,distinctValues:values,surfaces,breakpointDependent:bp,stateDependent:st,classification:cls});
          }
          console.log('RAW_TABLE',JSON.stringify(table,null,2));
          console.log('PARTITION',JSON.stringify(Object.fromEntries([...new Set(table.map(x=>x.classification))].map(c=>[c,table.filter(x=>x.classification===c).map(x=>x.token)])),null,2));
          NODE