                if(!first.accepted||!second.accepted){cross.viewports[v.n].push({pair:i,order,accepted:false,error:first.error||second.error});crossPass=false;continue}
                const a=first.variant==='M4'?first:second,b=first.variant==='M5'?first:second;
                const cmp=compare('cross-'+v.n+'-'+i,a,b);
                cross.viewports[v.n].push({pair:i,order,accepted:true,comparison:cmp});
                if(!cmp.pixelIdentical)crossPass=false;
              }
            }
            fs.writeFileSync(path.join(OUT,'folio-quiet-window-cross-variant-recheck.json'),JSON.stringify(cross,null,2));
          }

          function firstFailedComparison(){
            const pools=[samePage.M4,samePage.M5,...Object.values(contextByViewport).flatMap(x=>[x.M4,x.M5]),...Object.values(processByViewport).flatMap(x=>[x.M4,x.M5])];
            for(const p of pools){const z=(p.comparisons||[]).find(x=>!x.pixelIdentical);if(z)return{phase:p,comparison:z}}
            return null;
          }
          const failed=firstFailedComparison();
          let rootCause='Q9 — NO NONDETERMINISM REPRODUCED UNDER STRICT QUIET WINDOW',outcome='G — INCONCLUSIVE';
          if(allSelfPass&&crossPass)outcome='A — SELF-CONSISTENCY STABILIZED; M4↔M5 PIXEL EQUIVALENCE PROVEN';
          else if(allSelfPass&&!crossPass){outcome='B — SELF-CONSISTENCY STABILIZED; STABLE M4↔M5 VISUAL DIFFERENCE REMAINS';rootCause='Q9 — NO NONDETERMINISM REPRODUCED UNDER STRICT QUIET WINDOW'}
          else{
            const contextFail=!freshContext.M4.pass||!freshContext.M5.pass;
            const processStable=freshProcess.M4.pass&&freshProcess.M5.pass;
            if(contextFail&&processStable){rootCause='Q6 — SHARED BROWSER-PROCESS / CONTEXT CACHE NONDETERMINISM';outcome='D — SHARED BROWSER-PROCESS / CONTEXT NONDETERMINISM IDENTIFIED BUT NOT FULLY STABILIZED'}
            else if(failed){
              const c=failed.comparison;
              if(!c.resourceSetSha256Equal){rootCause='Q1 — EXTERNAL / RESOURCE ASYNC NONDETERMINISM';outcome='C — RESOURCE / ASYNC NONDETERMINISM IDENTIFIED BUT NOT FULLY STABILIZED'}
              else if(!c.fontStateSha256Equal){rootCause='Q4 — FONT / TEXT RENDER STATE NONDETERMINISM';outcome='G — INCONCLUSIVE'}
              else if(!c.imageStateSha256Equal){rootCause='Q5 — IMAGE / MEDIA STATE NONDETERMINISM';outcome='C — RESOURCE / ASYNC NONDETERMINISM IDENTIFIED BUT NOT FULLY STABILIZED'}
              else if(!c.geometrySha256Equal){rootCause='Q3 — LAYOUT-SHIFT / GEOMETRY NONDETERMINISM';outcome='F — INTERNAL DOM / LAYOUT INSTABILITY PERSISTS'}
              else if(c.renderStateSha256Equal){rootCause='Q7 — BROWSER RASTER / COMPOSITOR NONDETERMINISM';outcome='E — BROWSER RASTER / COMPOSITOR NONDETERMINISM PERSISTS'}
              else{rootCause='Q2 — INTERNAL DOM MUTATION NONDETERMINISM';outcome='F — INTERNAL DOM / LAYOUT INSTABILITY PERSISTS'}
            }else{
              const anyRejected=[samePage.M4,samePage.M5,freshContext.M4,freshContext.M5,freshProcess.M4,freshProcess.M5].some(x=>x.accepted<x.required);
              rootCause=anyRejected?'Q10 — INCONCLUSIVE':'Q10 — INCONCLUSIVE';outcome='G — INCONCLUSIVE';
            }
          }

          const crossRows=cross?Object.values(cross.viewports).flat():[];
          const crossComparisons=crossRows.filter(x=>x.accepted).map(x=>x.comparison);
          const summary={
            outcome,rootCauseClassification:rootCause,
            primaryViewport:mobile.n,
            primary:{M4:{samePage:samePage.M4.pass?'SELF-STABLE':'FAIL',freshContext:freshContext.M4.pass?'SELF-STABLE':'FAIL',freshProcess:freshProcess.M4.pass?'SELF-STABLE':'FAIL'},M5:{samePage:samePage.M5.pass?'SELF-STABLE':'FAIL',freshContext:freshContext.M5.pass?'SELF-STABLE':'FAIL',freshProcess:freshProcess.M5.pass?'SELF-STABLE':'FAIL'}},
            allViewportSelfStability:allSelfPass?'PASS':'NOT PROVEN',viewports:allViewport,
            quietWindow:{pendingLocal:'0 continuously for 1000ms on accepted captures',mutationDelta:0,layoutShiftDelta:'0 or UNSUPPORTED',geometry:'stable',fonts:'loaded/stable',resourceSet:'stable',imageState:'stable'},
            crossLegallyReached:!!cross,
            crossPairs:crossComparisons.length,
            crossPass,
            allCrossDiffPixels:crossPass?0:null,
            allCrossMaxChannelDelta:crossPass?0:null,
            allCrossDiffRatio:crossPass?0:null,
            pixelEquivalence:allSelfPass&&crossPass?'PROVEN UNDER SELF-STABLE QUIET-WINDOW HARNESS':allSelfPass?'FALSE OR NOT PROVEN':'NOT TESTABLE RELIABLY',
            fifthRuleRole:'F3 — DEAD REDUNDANT FOLIO RESIDUE',
            naturalMatchCount:0,reachableMarkerCreationPaths:0,m5BuiltFolioResidues:0,
            fifthPathDisposition:allSelfPass&&crossPass?'P1 — SAFE FUTURE REMOVAL CANDIDATE':'NOT ADVANCED',
            m5ContractStatus:allSelfPass&&crossPass?'READY FOR RE-AUTHORIZATION REVIEW':'NO',
            implementationAuthorized:false,promotionAuthorized:false,deploymentAuthorized:false,
            nextPossibleGate:allSelfPass&&crossPass?'FOLIO OPACITY M4 → M5 IMPLEMENTATION RE-AUTHORIZATION REVIEW':allSelfPass?'STABLE M4↔M5 VISUAL CAUSALITY REVIEW':'SELF-CONSISTENCY FOLLOW-UP ONLY',
            doNotMutateProduction:true
          };
          fs.writeFileSync(path.join(OUT,'folio-self-consistency-root-cause.json'),JSON.stringify({rootCauseClassification:rootCause,outcome,failedSample:failed?.comparison||null,regimeMatrix:matrix},null,2));
          fs.writeFileSync(path.join(OUT,'folio-quiet-window-summary.json'),JSON.stringify(summary,null,2));

          fs.writeFileSync(path.join(OUT,'folio-quiet-window-resource-manifests.json'),JSON.stringify(allResourceManifests,null,2));
          fs.writeFileSync(path.join(OUT,'folio-quiet-window-resource-hashes.json'),JSON.stringify(allResourceHashes,null,2));
          fs.writeFileSync(path.join(OUT,'folio-quiet-window-font-hashes.json'),JSON.stringify(allFontHashes,null,2));
          fs.writeFileSync(path.join(OUT,'folio-quiet-window-image-hashes.json'),JSON.stringify(allImageHashes,null,2));
          fs.writeFileSync(path.join(OUT,'folio-quiet-window-geometry-hashes.json'),JSON.stringify(allGeometryHashes,null,2));
          fs.writeFileSync(path.join(OUT,'folio-quiet-window-render-state-hashes.json'),JSON.stringify(allRenderHashes,null,2));
          fs.writeFileSync(path.join(OUT,'folio-quiet-window-mutation-samples.json'),JSON.stringify(allMutationSamples,null,2));
          fs.writeFileSync(path.join(OUT,'folio-quiet-window-layout-shift-samples.json'),JSON.stringify(allLayoutSamples,null,2));
          fs.writeFileSync(path.join(OUT,'folio-quiet-window-pending-request-samples.json'),JSON.stringify(allPendingSamples,null,2));
          fs.writeFileSync(path.join(OUT,'folio-self-diff-regions.json'),JSON.stringify(allSelfDiffs.map(x=>({key:x.key,diffPixels:x.diffPixels,maxChannelDelta:x.maxChannelDelta,diffRatio:x.diffRatio,boundingBox:x.boundingBox,renderStateSha256Equal:x.renderStateSha256Equal,resourceSetSha256Equal:x.resourceSetSha256Equal,fontStateSha256Equal:x.fontStateSha256Equal,imageStateSha256Equal:x.imageStateSha256Equal,geometrySha256Equal:x.geometrySha256Equal})),null,2));
          fs.writeFileSync(path.join(OUT,'folio-self-diff-elements.json'),JSON.stringify(allSelfDiffElements,null,2));
          fs.writeFileSync(path.join(OUT,'folio-self-diff-pixel-colors.json'),JSON.stringify(allSelfDiffColors,null,2));
          fs.writeFileSync(path.join(OUT,'folio-quiet-window-network-policy.json'),JSON.stringify({installedBeforeNavigation:true,sameOriginSafeReads:['GET','HEAD','OPTIONS'],externalReads:'BLOCK',telemetry:'BLOCK',mutatingRequests:'BLOCK',mutatingDispatchCount:networkRecords.reduce((n,x)=>n+x.blockedUnsafeCount,0),captures:networkRecords},null,2));
          JS

          OUT="$OUT" M4="$M4" M5="$M5" node .quiet.mjs
          rm -f .quiet.mjs
          test -z "$(git status --porcelain)"
      - name: Terminal refs and required evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/quiet"
          mkdir -p "$OUT"
          api(){ curl --fail --silent --show-error --location -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$1"; }
          MAIN="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main"|jq -r '.object.sha')"
          M4="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/basair/post-3b-folio-opacity-implementation"|jq -r '.object.sha')"
          GH="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/gh-pages"|jq -r '.object.sha')"
          MG="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/git/commits/$MAIN")"
          M4G="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/git/commits/$M4")"
          GG="$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/git/commits/$GH")"
          test "$MAIN" = "$MAIN_SHA"; test "$M4" = "$M4_SHA"; test "$GH" = "$GH_SHA"
          test "$(jq -r '.tree.sha'<<<"$MG")" = "$MAIN_TREE"
          test "$(jq -r '.tree.sha'<<<"$M4G")" = "$M4_TREE"
          test "$(jq -r '.tree.sha'<<<"$GG")" = "$GH_TREE"
          jq -n --arg main "$MAIN" --arg m4 "$M4" --arg gh "$GH" --arg mt "$(jq -r '.tree.sha'<<<"$MG")" --arg m4t "$(jq -r '.tree.sha'<<<"$M4G")" --arg gt "$(jq -r '.tree.sha'<<<"$GG")" '{main:$main,blockedM4:$m4,ghPages:$gh,mainTree:$mt,m4Tree:$m4t,ghPagesTree:$gt,mainMoved:false,blockedImplementationRewritten:false,ghPagesMoved:false,noPromotion:true,noDeployment:true,noPagesSettingsMutation:true,noFirebaseMutation:true,noBackendMutation:true}' > "$OUT/folio-quiet-window-terminal-refs.json"

          for F in \
            folio-quiet-window-preflight.json \
            folio-quiet-window-build-identities.json \
            folio-quiet-window-browser-environment.json \
            folio-quiet-window-network-policy.json \
            folio-quiet-window-resource-manifests.json \
            folio-quiet-window-resource-hashes.json \
            folio-quiet-window-font-hashes.json \
            folio-quiet-window-image-hashes.json \
            folio-quiet-window-geometry-hashes.json \
            folio-quiet-window-render-state-hashes.json \
            folio-quiet-window-mutation-samples.json \
            folio-quiet-window-layout-shift-samples.json \
            folio-quiet-window-pending-request-samples.json \
            folio-m4-same-page-stability.json \
            folio-m5-same-page-stability.json \
            folio-m4-fresh-context-stability.json \
            folio-m5-fresh-context-stability.json \
            folio-m4-fresh-process-stability.json \
            folio-m5-fresh-process-stability.json \
            folio-self-consistency-regime-matrix.json \
            folio-self-diff-regions.json \
            folio-self-diff-elements.json \
            folio-self-diff-pixel-colors.json \
            folio-self-consistency-root-cause.json \
            folio-all-viewport-self-stability.json \
            folio-quiet-window-summary.json \
            folio-quiet-window-terminal-refs.json
          do test -s "$OUT/$F"; done

      - name: Upload quiet-window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-3b-folio-opacity-self-consistency-quiet-window-resolution
          path: ${{ runner.temp }}/quiet
          if-no-files-found: error
          retention-days: 90
