name: BASAIR Admin Repair Verification

on:
  push:
    branches:
      - 'basair/admin-functional-security-repair'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout isolated candidate (no production refs)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java for local Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify frozen base and single-branch scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2fd0973b2ff68f0ba960ff2aa83d3520d9c3c243 HEAD
          test "$(git branch --show-current || true)" = "" || true
          test -z "$(git status --porcelain)"
          git diff --check 2fd0973b2ff68f0ba960ff2aa83d3520d9c3c243 HEAD
          if git diff --name-only 2fd0973b2ff68f0ba960ff2aa83d3520d9c3c243 HEAD | grep -Eq '^(index.html|overdrive-v1.js|overdrive-v1.css|visual-layout-hotfix-v2.css|token-authority-manifest.json)$'; then
            echo 'Protected Folio/public artifact changed unexpectedly'
            exit 1
          fi

      - name: Production-independent source and public regression gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --json > /tmp/basair-admin-npm-audit.json || true
          node --input-type=module -e 'import fs from "node:fs"; const a=JSON.parse(fs.readFileSync("/tmp/basair-admin-npm-audit.json","utf8")); for(const [name,v] of Object.entries(a.vulnerabilities||{})){ if(["high","critical"].includes(v.severity)) console.log(JSON.stringify({name,severity:v.severity,via:v.via,effects:v.effects,range:v.range,fixAvailable:v.fixAvailable})); }'
          npm run verify
          npm run build
          node token-authority-check.mjs
          node scripts/verify-css-consolidation-preflight.mjs --expected-css-count=51
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Admin unit regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/admin-policy.test.mjs

      - name: Synthetic read-only Admin browser integration
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4179 --bind 127.0.0.1 > /tmp/basair-admin-test-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4179/admin.html > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4179/admin.html > /dev/null
          node tests/admin-browser-smoke.mjs
          test -z "$(git status --porcelain)"

      - name: Firestore emulator synthetic security tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false firebase@12.15.0 @firebase/rules-unit-testing@5.0.0
          npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-basair-admin-security "node --test tests/admin-firestore-emulator.test.mjs"
          test -z "$(git status --porcelain)"

      - name: Actual Admin UI to Firestore emulator write paths
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 firebase@12.15.0 @firebase/rules-unit-testing@5.0.0
          python3 -m http.server 4179 --bind 127.0.0.1 > /tmp/basair-admin-write-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4179/admin.html > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4179/admin.html > /dev/null
          npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-basair-admin-write-path "node tests/admin-real-write-path.mjs"
          test -z "$(git status --porcelain)"

      - name: Final candidate-only path inventory
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat 2fd0973b2ff68f0ba960ff2aa83d3520d9c3c243 HEAD
          test -z "$(git status --porcelain)"

