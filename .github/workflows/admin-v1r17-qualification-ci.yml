name: BASAIR Final Architecture Readiness - Official Action Pins and Isolated Audit
on:
  push:
    branches:
      - basair/admin-final-architecture-readiness-qualification
permissions:
  contents: read
jobs:
  isolated-registration-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout isolated V1R17 with complete reviewed history, no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22.16.0 and npm 10.9.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Verify immutable authorities, exactly five changed paths, and real pinned V16 manual simulation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse 3da010de1c444d956deecead8dd2e39823360e26^{tree})" = 5ed825108eb100de4879b6d5923f9ba4e572e5cc
          test "$(git rev-parse ac644985086e5dbb792a3b1236008257868fecc5^{tree})" = d48ef39c2f504c84268e5f529652a1f67980a240
          test "$(git rev-parse 2fd0973b2ff68f0ba960ff2aa83d3520d9c3c243^{tree})" = 09aa7bd7325e7c078cc817f0790402a5667a3644
          test "$(git rev-parse cef59ba05b3382978b4c18e83592f08227b2f9c4^{commit})" = cef59ba05b3382978b4c18e83592f08227b2f9c4
          git merge-base --is-ancestor 3da010de1c444d956deecead8dd2e39823360e26 HEAD
          test "$(git diff --name-only 3da010de1c444d956deecead8dd2e39823360e26 HEAD | wc -l)" -eq 5
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/admin-verify-only-registration-v1r17.yml|.github/workflows/admin-v1r17-qualification-ci.yml|scripts/admin-v1r17-registration-contract.mjs|tests/admin-v1r17-registration-qualification.mjs|docs/admin-v1r17-registration-qualification.md) ;;
              *) echo "V1R17_UNAUTHORIZED_PATH=$file"; exit 1 ;;
            esac
          done < <(git diff --name-only 3da010de1c444d956deecead8dd2e39823360e26 HEAD)
          git diff --exit-code 3da010de1c444d956deecead8dd2e39823360e26 HEAD -- admin.js admin.html package.json package-lock.json firebase.json .firebaserc firestore.rules
          if git cat-file -e 2fd0973b2ff68f0ba960ff2aa83d3520d9c3c243:.github/workflows/admin-verify-only-registration-v1r17.yml 2>/dev/null; then
            echo "Workflow already on frozen Main: STOP"
            exit 1
          fi
          # Independently map approved upstream release tags to signed GitHub-hosted official repositories.
          checkout_tag="$(git ls-remote --exit-code https://github.com/actions/checkout.git refs/tags/v4.2.2 | cut -f1)"
          setup_tag="$(git ls-remote --exit-code https://github.com/actions/setup-node.git refs/tags/v4.4.0 | cut -f1)"
          upload_tag="$(git ls-remote --exit-code https://github.com/actions/upload-artifact.git refs/tags/v4.6.2 | cut -f1)"
          test "$checkout_tag" = 11bd71901bbe5b1630ceea73d27597364c9af683
          test "$setup_tag" = 49933ea5288caeca8642d1e84afbd3f7d6820020
          test "$upload_tag" = ea165f8d65b6e75b540449e92b4886f43607fa02
          echo VERIFIED_OFFICIAL_ACTION_TAG_MAPPING=PASS
          # All changes since V1R17 remain within its five originally approved qualification paths.
          test "$(git diff --name-only 2eb91de735576fa603bd60492932b4914b75fc45 HEAD | wc -l)" -eq 5
          git diff --exit-code 2eb91de735576fa603bd60492932b4914b75fc45 HEAD -- admin.js admin.html firestore.rules package-lock.json firebase.json .firebaserc
          node --check scripts/admin-v1r17-registration-contract.mjs
          node --check tests/admin-v1r17-registration-qualification.mjs
          node scripts/admin-v1r17-registration-contract.mjs check
          node tests/admin-v1r17-registration-qualification.mjs
          node tests/admin-solo-operator-guards-v1r16.mjs
          node tests/admin-preview-integrated-guards-v1r15.mjs
          node tests/admin-preview-guards-v1r14.mjs
          node tests/admin-vite-security-contract-v1r13.mjs
          git diff --check
          test -z "$(git status --porcelain)"
          echo V1R17_MAIN_REGISTRATION_PROPOSAL_ONLY=PASS
      - name: Read-only security audit reproducible build and exact five Admin SHA-256 files
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = v22.16.0
          test "$(npm -v)" = 10.9.2
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = 62a543b624975ff938f77490ffcedd17a5771176af5a63e9e20809429013525a
          npm ci
          npm audit --json > "$RUNNER_TEMP/v1r17-audit.json"
          node -e 'const a=require(process.env.RUNNER_TEMP+"/v1r17-audit.json");console.log("V1R17_AUDIT="+JSON.stringify(a.metadata?.vulnerabilities));if(a.metadata?.vulnerabilities?.total!==0)process.exit(1)'
          npm run verify
          BASAIR_NPM_VERSION="$(npm --version)" node tests/admin-only-asset-closure-v1r10r1.mjs
          BASAIR_NPM_VERSION="$(npm --version)" node scripts/admin-dedicated-hosting-candidate-v1r11.mjs
          node tests/admin-dedicated-hosting-contract-v1r11.mjs
          node tests/admin-preview-target-guard-v1r12.mjs
          test -z "$(git status --porcelain)"
      - name: Read-only local Chromium CSP XFO with production Firebase APIs blocked
        shell: bash
        run: |
          set -euo pipefail
          export BASAIR_TEST_TOOLS="$RUNNER_TEMP/v1r17-playwright"
          npm install --prefix "$BASAIR_TEST_TOOLS" --save-exact --no-audit playwright@1.55.1
          npm audit --prefix "$BASAIR_TEST_TOOLS" --json > "$RUNNER_TEMP/v1r17-tool-audit.json"
          node -e 'const a=require(process.env.RUNNER_TEMP+"/v1r17-tool-audit.json");console.log("V1R17_TOOL_AUDIT="+JSON.stringify(a.metadata?.vulnerabilities));if(a.metadata?.vulnerabilities?.total!==0)process.exit(1)'
          "$BASAIR_TEST_TOOLS/node_modules/.bin/playwright" install --with-deps chromium
          BASAIR_ADMIN_ONLY_DIR="$RUNNER_TEMP/basair-v1r11-candidate/admin-only" node tests/admin-http-frame-proof-v1r10r1.mjs
          test -z "$(git status --porcelain)"
          echo V1R17_NO_MAIN_WRITE_NO_GOOGLE_NO_FIREBASE_DEPLOYMENT=PASS
      - name: Pin Java 21 for local Firestore Emulator only
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Current Admin browser and Firestore Emulator regressions - synthetic only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(printenv FIREBASE_TOKEN || true)"
          test -z "$(printenv GOOGLE_APPLICATION_CREDENTIALS || true)"
          test -z "$(printenv GOOGLE_GHA_CREDS_PATH || true)"
          test "$GITHUB_REF" = refs/heads/basair/admin-final-architecture-readiness-qualification
          java_ref="$(git ls-remote --exit-code https://github.com/actions/setup-java.git refs/tags/v4.7.1 | cut -f1)"
          test "$java_ref" = c5195efecf7bdfc987ee8bae7a71cb8b11521c00
          npm install --no-save --package-lock=false playwright@1.55.1 firebase@12.15.0 @firebase/rules-unit-testing@5.0.0 esbuild@0.25.10
          mkdir -p "$RUNNER_TEMP/fb-emulator-tools"
          npm install --prefix "$RUNNER_TEMP/fb-emulator-tools" --no-audit --no-fund --save-exact firebase-tools@15.28.1
          FB="$RUNNER_TEMP/fb-emulator-tools/node_modules/.bin/firebase"
          test "$("$FB" --version)" = 15.28.1
          python3 -m http.server 4179 --bind 127.0.0.1 > "$RUNNER_TEMP/v1r17-functional-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4179/admin.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4179/admin.html >/dev/null
          node --test tests/admin-policy.test.mjs
          node tests/admin-browser-smoke.mjs
          "$FB" emulators:exec --only firestore --project demo-basair-admin-security "node --test tests/admin-firestore-emulator.test.mjs"
          "$FB" emulators:exec --only firestore --project demo-basair-admin-write-path "node tests/admin-real-write-path.mjs"
          "$FB" emulators:exec --only firestore --project demo-basair-no-email-security "node tests/admin-no-email-rules.mjs"
          for pair in A B C D E F; do
            TEST_PAIR="$pair" "$FB" emulators:exec --only firestore --project "demo-basair-compat-${pair,,}" "node tests/admin-four-state.mjs"
          done
          test -z "$(git status --porcelain)"
          echo V1R17_CURRENT_ADMIN_EMULATOR_AND_BROWSER_FUNCTIONAL=PASS
      - name: Report exact final identity and five files
        if: always()
        shell: bash
        run: |
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          git diff --name-only 3da010de1c444d956deecead8dd2e39823360e26 HEAD
      - name: Upload sanitized non-deploy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: basair-v1r17-manual-registration-qualification
          path: |
            ${{ runner.temp }}/v1r17-registration-proof.json
            ${{ runner.temp }}/v1r17-audit.json
            ${{ runner.temp }}/v1r17-tool-audit.json
            ${{ runner.temp }}/v1r10r1-asset-manifest.json
            ${{ runner.temp }}/v1r11-candidate-summary.json
            ${{ runner.temp }}/v1r12-preview-preflight.json
            ${{ runner.temp }}/v1r10r1-http-frame-proof.json
          retention-days: 7
          if-no-files-found: warn
