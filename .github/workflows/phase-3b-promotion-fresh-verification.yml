name: Phase 3B Promotion Fresh Read-Only Verification

on:
  push:
    branches:
      - 'basair/phase-3b-promotion-fresh-verification-evidence'

permissions:
  contents: read

env:
  MAIN_SHA: 2c573b31f48fe6b97a96fc1049b41aa23d15cca5
  MAIN_TREE: ecd7aa310cfa97af832018e33ca6c3044f7732f2
  FINAL_SHA: f66f41a1e4bef0cf3af4f63240727a482bdda7c5
  FINAL_TREE: 26f1b18a0696b7f78963011a5d6b23474d70d9e6
  GH_PAGES_SHA: 72df1faa15c1277eace3a7ceb2161c48cd0dd19d
  EVIDENCE_BRANCH: basair/phase-3b-promotion-fresh-verification-evidence
  FINAL_BRANCH: basair/phase-3b-5-hero-delight-animate-exact-concat
  WORKFLOW_PATH: .github/workflows/phase-3b-promotion-fresh-verification.yml

jobs:
  fresh-final-verification:
    name: fresh-final-verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Phase 3B final
        uses: actions/checkout@v4
        with:
          ref: f66f41a1e4bef0cf3af4f63240727a482bdda7c5
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove exact final identity
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/promotion-fresh/final"
          mkdir -p "${EVIDENCE}"
          HEAD_SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          STATUS="$(git status --porcelain)"
          {
            echo "head=${HEAD_SHA}"
            echo "tree=${TREE_SHA}"
            echo "expected_head=${FINAL_SHA}"
            echo "expected_tree=${FINAL_TREE}"
            echo "status_begin"
            printf '%s\n' "${STATUS}"
            echo "status_end"
          } | tee "${EVIDENCE}/identity.txt"
          test "${HEAD_SHA}" = "${FINAL_SHA}"
          test "${TREE_SHA}" = "${FINAL_TREE}"
          test -z "${STATUS}"

      - name: Fresh CSS consolidation preflight
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/promotion-fresh/final"
          node scripts/verify-css-consolidation-preflight.mjs --expected-css-count=51 2>&1 | tee "${EVIDENCE}/preflight.txt"

      - name: Fresh npm ci
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/promotion-fresh/final"
          npm ci 2>&1 | tee "${EVIDENCE}/npm-ci.txt"

      - name: Fresh npm verify
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/promotion-fresh/final"
          npm run verify 2>&1 | tee "${EVIDENCE}/npm-verify.txt"

      - name: Fresh standalone npm build
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/promotion-fresh/final"
          npm run build 2>&1 | tee "${EVIDENCE}/npm-build.txt"

      - name: Fresh git cleanliness gate
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/promotion-fresh/final"
          {
            git diff --check
            echo "git_diff_check=PASS"
            git diff --exit-code
            echo "git_diff_exit_code=PASS"
            STATUS="$(git status --porcelain)"
            echo "status_begin"
            printf '%s\n' "${STATUS}"
            echo "status_end"
            test -z "${STATUS}"
            echo "git_status_porcelain=EMPTY"
          } 2>&1 | tee "${EVIDENCE}/git-status.txt"

      - name: Fresh token authority
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/promotion-fresh/final"
          node token-authority-check.mjs 2>&1 | tee "${EVIDENCE}/token-authority.txt"

      - name: Upload fresh-final raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3b-promotion-fresh-final-verification
          path: ${{ runner.temp }}/promotion-fresh/final/
          if-no-files-found: warn
          retention-days: 90

  simulated-main-verification:
    name: simulated-main-verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout evidence branch with full history
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-promotion-fresh-verification-evidence
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove exact main identity before FF
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/promotion-fresh/simulated-main"
          mkdir -p "${EVIDENCE}"
          git checkout --detach "${MAIN_SHA}"
          HEAD_SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          STATUS="$(git status --porcelain)"
          {
            echo "head=${HEAD_SHA}"
            echo "tree=${TREE_SHA}"
            echo "expected_head=${MAIN_SHA}"
            echo "expected_tree=${MAIN_TREE}"
            echo "status_begin"
            printf '%s\n' "${STATUS}"
            echo "status_end"
          } | tee "${EVIDENCE}/before-identity.txt"
          test "${HEAD_SHA}" = "${MAIN_SHA}"
          test "${TREE_SHA}" = "${MAIN_TREE}"
          test -z "${STATUS}"

      - name: Execute actual ff-only simulation
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/promotion-fresh/simulated-main"
          set +e
          git merge --ff-only "${FINAL_SHA}" 2>&1 | tee "${EVIDENCE}/ff-result.txt"
          FF_EXIT="${PIPESTATUS[0]}"
          set -e
          echo "exit_code=${FF_EXIT}" | tee -a "${EVIDENCE}/ff-result.txt"
          test "${FF_EXIT}" -eq 0

      - name: Prove post-FF identity and zero diff
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/promotion-fresh/simulated-main"
          HEAD_SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          STATUS="$(git status --porcelain)"
          PARENT_COUNT="$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')"
          {
            echo "head=${HEAD_SHA}"
            echo "tree=${TREE_SHA}"
            echo "expected_head=${FINAL_SHA}"
            echo "expected_tree=${FINAL_TREE}"
            echo "parent_count=${PARENT_COUNT}"
            echo "status_begin"
            printf '%s\n' "${STATUS}"
            echo "status_end"
            git diff "${FINAL_SHA}" HEAD
            echo "final_to_head_diff=EMPTY"
          } 2>&1 | tee "${EVIDENCE}/after-identity.txt"
          test "${HEAD_SHA}" = "${FINAL_SHA}"
          test "${TREE_SHA}" = "${FINAL_TREE}"
          test "${PARENT_COUNT}" -eq 1
          test -z "${STATUS}"
          git diff --quiet "${FINAL_SHA}" HEAD

      - name: Fresh simulated-main CSS consolidation preflight
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/promotion-fresh/simulated-main"
          node scripts/verify-css-consolidation-preflight.mjs --expected-css-count=51 2>&1 | tee "${EVIDENCE}/preflight.txt"

      - name: Fresh simulated-main npm ci
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/promotion-fresh/simulated-main"
          npm ci 2>&1 | tee "${EVIDENCE}/npm-ci.txt"

      - name: Fresh simulated-main npm verify
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/promotion-fresh/simulated-main"
          npm run verify 2>&1 | tee "${EVIDENCE}/npm-verify.txt"

      - name: Fresh simulated-main standalone npm build
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/promotion-fresh/simulated-main"
          npm run build 2>&1 | tee "${EVIDENCE}/npm-build.txt"

      - name: Fresh simulated-main git cleanliness gate
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/promotion-fresh/simulated-main"
          {
            git diff --check
            echo "git_diff_check=PASS"
            git diff --exit-code
            echo "git_diff_exit_code=PASS"
            STATUS="$(git status --porcelain)"
            echo "status_begin"
            printf '%s\n' "${STATUS}"
            echo "status_end"
            test -z "${STATUS}"
            echo "git_status_porcelain=EMPTY"
          } 2>&1 | tee "${EVIDENCE}/git-status.txt"

      - name: Fresh simulated-main token authority
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="${RUNNER_TEMP}/promotion-fresh/simulated-main"
          node token-authority-check.mjs 2>&1 | tee "${EVIDENCE}/token-authority.txt"

      - name: Upload simulated-main raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3b-promotion-fresh-simulated-main-verification
          path: ${{ runner.temp }}/promotion-fresh/simulated-main/
          if-no-files-found: warn
          retention-days: 90

  promotion-characterization-summary:
    name: promotion-characterization-summary
    needs:
      - fresh-final-verification
      - simulated-main-verification
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout evidence branch for terminal checks
        uses: actions/checkout@v4
        with:
          ref: basair/phase-3b-promotion-fresh-verification-evidence
          fetch-depth: 0
          persist-credentials: false

      - name: Terminal read-only characterization
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FINAL_JOB_RESULT: ${{ needs.fresh-final-verification.result }}
          SIM_JOB_RESULT: ${{ needs.simulated-main-verification.result }}
        run: |
          set -uo pipefail
          EVIDENCE="${RUNNER_TEMP}/promotion-fresh/summary"
          mkdir -p "${EVIDENCE}"
          FAILED=0

          read_ref() {
            local REF_PATH="$1"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/${REF_PATH}" \
              | jq -r '.object.sha'
          }

          REMOTE_MAIN="$(read_ref "heads/main")" || REMOTE_MAIN=""
          REMOTE_FINAL="$(read_ref "heads/${FINAL_BRANCH}")" || REMOTE_FINAL=""
          REMOTE_GH_PAGES="$(read_ref "heads/gh-pages")" || REMOTE_GH_PAGES=""

          if [ "${REMOTE_MAIN}" != "${MAIN_SHA}" ]; then FAILED=1; fi
          if [ "${REMOTE_FINAL}" != "${FINAL_SHA}" ]; then FAILED=1; fi
          if [ "${REMOTE_GH_PAGES}" != "${GH_PAGES_SHA}" ]; then FAILED=1; fi

          MERGE_BASE=""
          AHEAD=""
          BEHIND=""
          MAIN_ONLY=""
          if git cat-file -e "${REMOTE_MAIN}^{commit}" 2>/dev/null && git cat-file -e "${REMOTE_FINAL}^{commit}" 2>/dev/null; then
            MERGE_BASE="$(git merge-base "${REMOTE_MAIN}" "${REMOTE_FINAL}")"
            AHEAD="$(git rev-list --count "${REMOTE_MAIN}..${REMOTE_FINAL}")"
            BEHIND="$(git rev-list --count "${REMOTE_FINAL}..${REMOTE_MAIN}")"
            MAIN_ONLY="${BEHIND}"
          else
            FAILED=1
          fi

          if [ "${MERGE_BASE}" != "${MAIN_SHA}" ]; then FAILED=1; fi
          if [ "${AHEAD}" != "22" ]; then FAILED=1; fi
          if [ "${BEHIND}" != "0" ]; then FAILED=1; fi
          if [ "${MAIN_ONLY}" != "0" ]; then FAILED=1; fi

          EVIDENCE_HEAD="$(git rev-parse HEAD)"
          EVIDENCE_TREE="$(git rev-parse HEAD^{tree})"
          EVIDENCE_PARENT="$(git rev-parse HEAD^)"
          mapfile -t CHANGED_PATHS < <(git diff --name-only "${FINAL_SHA}" HEAD)
          CHANGED_COUNT="${#CHANGED_PATHS[@]}"
          EXPECTED_PATH=".github/workflows/phase-3b-promotion-fresh-verification.yml"

          if [ "${EVIDENCE_PARENT}" != "${FINAL_SHA}" ]; then FAILED=1; fi
          if [ "${CHANGED_COUNT}" -ne 1 ]; then FAILED=1; fi
          if [ "${CHANGED_COUNT}" -eq 1 ] && [ "${CHANGED_PATHS[0]}" != "${EXPECTED_PATH}" ]; then FAILED=1; fi

          if [ "${FINAL_JOB_RESULT}" != "success" ]; then FAILED=1; fi
          if [ "${SIM_JOB_RESULT}" != "success" ]; then FAILED=1; fi

          {
            echo "remote_main=${REMOTE_MAIN}"
            echo "remote_final=${REMOTE_FINAL}"
            echo "remote_gh_pages=${REMOTE_GH_PAGES}"
            echo "merge_base=${MERGE_BASE}"
            echo "ahead_by=${AHEAD}"
            echo "behind_by=${BEHIND}"
            echo "main_only_commits=${MAIN_ONLY}"
            echo "fresh_final_job=${FINAL_JOB_RESULT}"
            echo "simulated_main_job=${SIM_JOB_RESULT}"
            echo "evidence_head=${EVIDENCE_HEAD}"
            echo "evidence_tree=${EVIDENCE_TREE}"
            echo "evidence_parent=${EVIDENCE_PARENT}"
            echo "changed_path_count=${CHANGED_COUNT}"
            printf 'changed_path=%s\n' "${CHANGED_PATHS[@]}"
            echo "workflow_permissions=contents:read"
            echo "pages_branch_expected_unchanged=${GH_PAGES_SHA}"
            echo "remote_ref_mutation_performed=NO"
            echo "deployment_step_present=NO"
            echo "firebase_deployment_step_present=NO"
            echo "failed=${FAILED}"
          } | tee "${EVIDENCE}/terminal.txt"

          jq -n \
            --arg remote_main "${REMOTE_MAIN}" \
            --arg remote_final "${REMOTE_FINAL}" \
            --arg remote_gh_pages "${REMOTE_GH_PAGES}" \
            --arg merge_base "${MERGE_BASE}" \
            --argjson ahead_by "${AHEAD:-0}" \
            --argjson behind_by "${BEHIND:-0}" \
            --argjson main_only_commits "${MAIN_ONLY:-0}" \
            --arg fresh_final_job "${FINAL_JOB_RESULT}" \
            --arg simulated_main_job "${SIM_JOB_RESULT}" \
            --arg evidence_head "${EVIDENCE_HEAD}" \
            --arg evidence_tree "${EVIDENCE_TREE}" \
            --arg evidence_parent "${EVIDENCE_PARENT}" \
            --argjson changed_path_count "${CHANGED_COUNT}" \
            --arg changed_path "${CHANGED_PATHS[0]:-}" \
            --argjson failed "${FAILED}" \
            '{
              remote_refs:{main:$remote_main,final:$remote_final,gh_pages:$remote_gh_pages},
              topology:{merge_base:$merge_base,ahead_by:$ahead_by,behind_by:$behind_by,main_only_commits:$main_only_commits},
              jobs:{fresh_final:$fresh_final_job,simulated_main:$simulated_main_job},
              evidence_branch:{head:$evidence_head,tree:$evidence_tree,parent:$evidence_parent,changed_path_count:$changed_path_count,changed_path:$changed_path},
              security:{permissions:"contents:read",remote_ref_mutation:false,deployment:false,firebase_deployment:false},
              failed:($failed == 1)
            }' > "${EVIDENCE}/summary.json"

          if [ "${FAILED}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload terminal summary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3b-promotion-characterization-summary
          path: ${{ runner.temp }}/promotion-fresh/summary/
          if-no-files-found: warn
          retention-days: 90
