name: Phase 2.5 Browser Characterization Final Rerun
on:
  push:
    branches: ["basair/phase-2.5-browser-characterization"]
permissions:
  contents: write
jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact closed Phase 2 source
        uses: actions/checkout@v4
        with:
          ref: 1504baad33b2123056877c1e92f4e2d558c00d51
          fetch-depth: 0
      - name: Prove authoritative starting state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1504baad33b2123056877c1e92f4e2d558c00d51"
          test "$(git rev-parse HEAD^{tree})" = "1d987040d0158387d0425d6e6ed00fe2a68ec617"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse 6e46539a02db342838d7c113a45ff558192658e5^{tree})" = "8c18f5050f4ffa33c2317823e540766a4b2bc9ff"
          echo "START_HEAD=$(git rev-parse HEAD)"
          echo "START_TREE=$(git rev-parse HEAD^{tree})"
          echo "WORKTREE=CLEAN"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify untouched Phase 2 production tree
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify
          npm run build
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Prepare exact Phase 0 comparison worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/basair-phase0 6e46539a02db342838d7c113a45ff558192658e5
          cd /tmp/basair-phase0
          test "$(git rev-parse HEAD)" = "6e46539a02db342838d7c113a45ff558192658e5"
          test "$(git rev-parse HEAD^{tree})" = "8c18f5050f4ffa33c2317823e540766a4b2bc9ff"
          test -z "$(git status --porcelain)"
          npm ci
          npm run build
      - name: Prepare isolated real-browser tooling
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER_BIN" ]; then echo "NO_REAL_BROWSER_ENGINE" >&2; exit 78; fi
          echo "BROWSER_BIN=$BROWSER_BIN" >> "$GITHUB_ENV"
          "$BROWSER_BIN" --version
          mkdir -p /tmp/basair-browser-tooling
          cd /tmp/basair-browser-tooling
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false puppeteer-core@24.16.0 >/dev/null
          node -p "require('puppeteer-core/package.json').version"
      - name: Serve both built trees
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/dist" >/tmp/phase2-server.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/basair-phase0/dist >/tmp/phase0-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null && curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Materialize and syntax-check temporary browser harness
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/phase25-characterize.b64 <<'B64'
          
          B64
          base64 -d /tmp/phase25-characterize.b64 | gunzip -c > /tmp/basair-browser-tooling/characterize.mjs
          node --check /tmp/basair-browser-tooling/characterize.mjs
          echo "HARNESS_SYNTAX=PASS"
      - name: Run exhaustive real-browser characterization
        shell: bash
        env:
          PHASE2_BASE_URL: http://127.0.0.1:4173/
          PHASE0_BASE_URL: http://127.0.0.1:4174/
        run: |
          set -euo pipefail
          cd /tmp/basair-browser-tooling
          node characterize.mjs
      - name: Upload final temporary screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-2.5-screenshots-final
          path: /tmp/phase-2.5-screenshots-final
          if-no-files-found: error
          retention-days: 14
      - name: Publish only characterization artifacts
        shell: bash
        run: |
          set -euo pipefail
          BASE=1504baad33b2123056877c1e92f4e2d558c00d51
          cp PHASE_2_5_BROWSER_CHARACTERIZATION.md /tmp/PHASE_2_5_BROWSER_CHARACTERIZATION.md
          cp phase-2.5-browser-characterization.json /tmp/phase-2.5-browser-characterization.json
          rm -f PHASE_2_5_BROWSER_CHARACTERIZATION.md phase-2.5-browser-characterization.json
          git fetch origin basair/phase-2.5-browser-characterization
          git switch --track -c phase25-final origin/basair/phase-2.5-browser-characterization
          cp /tmp/PHASE_2_5_BROWSER_CHARACTERIZATION.md .
          cp /tmp/phase-2.5-browser-characterization.json .
          rm -f .github/workflows/phase-2-5-browser-characterization-rerun.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only "$BASE")
          printf 'FINAL_NET_CHANGED_FILES_FROM_PHASE2:\n'; printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq 'PHASE_2_5_BROWSER_CHARACTERIZATION.md'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'phase-2.5-browser-characterization.json'
          test "$(git hash-object track-buttons-v6.css)" = "$(git rev-parse "$BASE:track-buttons-v6.css")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Phase 2.5: complete real-browser characterization matrix'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:basair/phase-2.5-browser-characterization
